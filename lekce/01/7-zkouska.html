<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 1: Zkouška</title>
<meta name="description" content="Lekce 1, sekce 7 z 7: šest otázek za 100 bodů.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
</head>
<body>

<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<a class="zpet" href="index.html" data-t="nav.prehled"></a>
<p class="krokLabel" id="krokLabel"></p>

<section class="plat" id="secZkouska">
  <p class="eyebrow" data-t="zkouska.eyebrow"></p>
  <h2 class="platNadpis"><em data-t="zkouska.over"></em><span data-t="zkouska.title"></span></h2>
  <p class="lede" data-t="zkouska.lede"></p>

  <div class="meter" id="zMeter"></div>
  <div id="zQuiz"></div>
  <div class="tools">
    <button type="button" id="zSubmit" data-t="zkouska.submit" disabled></button>
    <button type="button" id="zAgain" class="quiet" data-t="zkouska.again" hidden></button>
  </div>
  <p class="note" id="zNote"></p>
  <div class="result" id="zResult" hidden></div>

  <p class="listMark" data-t="zkouska.foot"></p>
</section>

<div class="sekceNav" id="sekceNav"></div>
<div class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></div>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, blob, clipPath, hatch, pin } from '../../js/platy.js';
import { vytvorZkousku } from '../../js/zkouska.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-01.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 1: Zkouška' : 'ROUTING — Lesson 1: Exam',
});

/* ============================================================================
 * ZKOUŠKA — miniatury pro obrázkové otázky (Q1, Q4), adaptované z
 * `test-lekce-01.html` na `js/platy.js`. Viewbox `0 0 120 220` nastavuje
 * `zkouska.js` sám.
 * ==========================================================================*/
function hatchRectMini(svg, clipId, box, angle, gap, op, seed) {
  hatch(svg, clipId, box, angle, gap, { w: 0.45, op, seed });
}

function kresliMiniFilozofie(svg, kind) {
  const defs = E(svg, 'defs', {});
  const sur = blob(60, 110, 52, 102, 0, 7, 0.04, 40);
  const cs = 'mf' + kind + 's';
  clipPath(defs, cs, sur);
  E(svg, 'path', { d: sur, fill: V('--turf-d', svg), opacity: 0.4 });
  hatchRectMini(svg, cs, { x: 0, y: 0, w: 120, h: 220 }, 1.1, 3.4, 0.3, 4);
  E(svg, 'path', { d: sur, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 0.9, opacity: 0.7 });

  const F = { a: 'M44 186 L42 62 L78 62 L76 186 Z', b: 'M34 190 L28 84 L92 78 L96 190 Z', c: 'M30 188 L26 60 L96 60 L92 188 Z' }[kind];
  E(svg, 'path', { d: F, fill: V('--turf', svg) });
  E(svg, 'path', { d: F, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1 });

  if (kind === 'a') {
    ['M10 62 L42 62 L44 186 L10 186 Z', 'M76 62 L110 62 L110 186 L78 186 Z'].forEach((d) =>
      E(svg, 'path', { d, fill: V('--water', svg), opacity: 0.75, stroke: V('--ink', svg), 'stroke-width': 0.9 }));
  }
  if (kind === 'b') {
    const bd = blob(40, 100, 15, 20, 0, 11, 0.18, 30);
    E(svg, 'path', { d: bd, fill: V('--sand', svg), stroke: V('--ink', svg), 'stroke-width': 1 });
    const wd = blob(88, 64, 17, 10, 0, 13, 0.15, 30);
    E(svg, 'path', { d: wd, fill: V('--water', svg), opacity: 0.8, stroke: V('--ink', svg), 'stroke-width': 0.9 });
  }
  if (kind === 'c') {
    E(svg, 'path', { d: 'M26 156 L104 74 L104 112 L36 178 Z', fill: V('--water', svg), opacity: 0.75, stroke: V('--ink', svg), 'stroke-width': 0.9 });
  }
  const gp = blob(60, 46, 24, 16, 0, 21, 0.08, 34);
  E(svg, 'path', { d: gp, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1.1 });
  pin(svg, 60, 44, { h: 16, r: 2, flagW: 12, flagH: 4 });
  E(svg, 'rect', { x: 52, y: 192, width: 18, height: 7, rx: 2, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1 });
}

function kresliMiniBunkr(svg, pos) {
  const defs = E(svg, 'defs', {});
  const sur = blob(60, 110, 52, 102, 0, 31, 0.04, 40);
  const cs = 'mb' + pos + 's';
  clipPath(defs, cs, sur);
  E(svg, 'path', { d: sur, fill: V('--turf-d', svg), opacity: 0.4 });
  hatchRectMini(svg, cs, { x: 0, y: 0, w: 120, h: 220 }, 1.1, 3.6, 0.26, 8);
  E(svg, 'path', { d: sur, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 0.9, opacity: 0.7 });

  const F = 'M34 190 L28 88 L90 78 L98 190 Z';
  E(svg, 'path', { d: F, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1 });
  const wd = blob(90, 64, 17, 10, 0, 33, 0.15, 30);
  E(svg, 'path', { d: wd, fill: V('--water', svg), opacity: 0.8, stroke: V('--ink', svg), 'stroke-width': 0.9 });
  const gp = blob(54, 46, 23, 15, 0, 35, 0.08, 34);
  E(svg, 'path', { d: gp, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1.1 });
  pin(svg, 56, 44, { h: 16, r: 2, flagW: 12, flagH: 4 });
  E(svg, 'rect', { x: 56, y: 192, width: 18, height: 7, rx: 2, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1 });

  const P = { a: [62, 160], b: [38, 104], c: [96, 118] }[pos];
  const bd = blob(P[0], P[1], 14, 9, 0.3, 41, 0.18, 30);
  E(svg, 'path', { d: bd, fill: V('--sand', svg), stroke: V('--ink', svg), 'stroke-width': 1.1 });
}

const zkouskaOtazky = [
  {
    typ: 'obrazek', body: 20, tema: 'strategie', textKlic: 'zkouska.q1.text', hintKlic: 'zkouska.q1.hint',
    vysvetleniKlic: 'zkouska.q1.why', zpetKlic: 'zkouska.q1.back', spravna: 'b',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniFilozofie(svg, id) })),
  },
  {
    typ: 'jedna', body: 15, tema: 'trest', textKlic: 'zkouska.q2.text',
    vysvetleniKlic: 'zkouska.q2.why', zpetKlic: 'zkouska.q2.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q2.' + id })),
  },
  {
    typ: 'jedna', body: 15, tema: 'riziko-odmena', textKlic: 'zkouska.q3.text',
    vysvetleniKlic: 'zkouska.q3.why', zpetKlic: 'zkouska.q3.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q3.' + id })),
  },
  {
    typ: 'obrazek', body: 20, tema: 'umisteni-hazardu', textKlic: 'zkouska.q4.text', hintKlic: 'zkouska.q4.hint',
    vysvetleniKlic: 'zkouska.q4.why', zpetKlic: 'zkouska.q4.back', spravna: 'b',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniBunkr(svg, id) })),
  },
  {
    typ: 'vice', body: 15, tema: 'strategie', textKlic: 'zkouska.q5.text', hintKlic: 'zkouska.q5.hint',
    vysvetleniKlic: 'zkouska.q5.why', zpetKlic: 'zkouska.q5.back',
    moznosti: [
      { id: 'a', textKlic: 'zkouska.q5.a', ok: true },
      { id: 'b', textKlic: 'zkouska.q5.b', ok: true },
      { id: 'c', textKlic: 'zkouska.q5.c', ok: false },
      { id: 'd', textKlic: 'zkouska.q5.d', ok: true },
    ],
  },
  {
    typ: 'jedna', body: 15, tema: 'trest', textKlic: 'zkouska.q6.text',
    vysvetleniKlic: 'zkouska.q6.why', zpetKlic: 'zkouska.q6.back', spravna: 'c',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q6.' + id })),
  },
];

vytvorZkousku({
  lekce: 1,
  otazky: zkouskaOtazky,
  slovnik,
  jazyk,
  el: { meter: $('zMeter'), quiz: $('zQuiz'), submit: $('zSubmit'), again: $('zAgain'), note: $('zNote'), result: $('zResult') },
});

jazyk.on(() => {
  vykresliNavSekci({ lekce: 1, index: 6, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
});
</script>
</body>
</html>
