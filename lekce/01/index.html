<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, rng, blob, blobPts, hatch, radial, stipple, pin, clipPath, vykresliJamku } from '../../js/platy.js';
import { HRACI, odehrajKolo, bocniChyba, puttyPlynule, normCdf } from '../../js/simulace.js';
import { vytvorZkousku } from '../../js/zkouska.js';

const $ = (id) => document.getElementById(id);
const fmt = (n, lang, d = 2) => {
  const s = n.toFixed(d);
  return lang === 'cs' ? s.replace('.', ',') : s;
};

const [slovnik, kartaSawgrass, kartaPebble, kartaRiviera, kartaKarlstejn] = await Promise.all([
  nactiSlovnik('../../data/preklady/lekce-01.json'),
  nactiSlovnik('../../data/jamky/tpc-sawgrass-17.json'),
  nactiSlovnik('../../data/jamky/pebble-beach-18.json'),
  nactiSlovnik('../../data/jamky/riviera-10.json'),
  nactiSlovnik('../../data/jamky/karlstejn-15.json'),
]);

const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 1: Proč jamka vypadá, jak vypadá' : 'ROUTING — Lesson 1: Why a hole looks the way it does',
});

/* ============================================================================
 * TEE SHOT 1 — „Tři otázky“. Tři filozofie na stejném kusu země. Geometrie
 * cest a hazardů je čistě ilustrativní (ne vázaná na simulaci) — jde o
 * princip, ne o čísla. Tvary vycházejí ze stejné myšlenky jako miniatury
 * v `test-lekce-01.html` (viz `kresliMiniFilozofie` níže), jen ve velkém.
 * ==========================================================================*/
const F1 = {
  trest: 'M150 580 L143 260 L162 118 L238 118 L257 260 L250 580 Z',
  strategie: 'M120 580 L98 280 L140 128 L260 128 L302 280 L280 580 Z',
  heroika: 'M120 580 L98 280 L140 128 L260 128 L302 280 L280 580 Z',
};
let teeShot1Mode = 'strategie';

function kresliTeeShot1(svg, mode, lang) {
  clear(svg);
  const defs = E(svg, 'defs', {});

  const sur = blob(200, 330, 178, 300, 0, 101, 0.04);
  const cSur = 't1sur';
  clipPath(defs, cSur, sur);
  E(svg, 'path', { d: sur, fill: V('--turf-d', svg), opacity: 0.42 });
  hatch(svg, cSur, { x: 15, y: 20, w: 370, h: 620 }, 1.15, 3.6, { op: 0.3, seed: 5 });
  E(svg, 'path', { d: sur, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1, opacity: 0.7 });

  // vodní hazard u trestající jamky leží zcela mimo fairway, takže na
  // pořadí kreslení nezáleží — ale bunkr a diagonální hazard u strategické
  // a heroické jamky zasahují DO plochy fairwaye, takže musí být nakreslené
  // AŽ PO fairwayi, jinak by je fairway přemaloval (viz poznamky.md, krok 4).
  if (mode === 'trest') {
    const wL = blob(75, 320, 68, 260, 0, 111, 0.05, 44);
    const wR = blob(325, 320, 68, 260, 0, 112, 0.05, 44);
    [wL, wR].forEach((d) => E(svg, 'path', { d, fill: V('--water', svg), opacity: 0.72, stroke: V('--ink', svg), 'stroke-width': 0.9 }));
  }

  const fd = F1[mode];
  const cf = 't1fw';
  clipPath(defs, cf, fd);
  E(svg, 'path', { d: fd, fill: V('--turf', svg), opacity: 0.96 });
  hatch(svg, cf, { x: 90, y: 120, w: 220, h: 470 }, Math.PI / 2, 5, { op: 0.1, seed: 12 });
  E(svg, 'path', { d: fd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1 });

  if (mode === 'strategie') {
    const bx = 150, by = 300, brx = 42, bry = 78;
    const bd = blob(bx, by, brx, bry, 0.12, 131, 0.16, 40);
    const cb = 't1bunk';
    clipPath(defs, cb, bd);
    E(svg, 'path', { d: bd, fill: V('--sand', svg) });
    stipple(svg, cb, { x: bx - brx, y: by - bry, w: brx * 2, h: bry * 2 }, 40, 132, { op: 0.5 });
    E(svg, 'path', { d: bd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1 });
    radial(svg, blobPts(bx, by, brx, bry, 0.12, 131, 0.16, 40), 133, { len: 10, w: 0.55, op: 0.65 });
  } else if (mode === 'heroika') {
    const hd = blob(190, 430, 118, 52, -0.5, 141, 0.08, 40);
    const ch = 't1water';
    clipPath(defs, ch, hd);
    E(svg, 'path', { d: hd, fill: V('--water', svg), opacity: 0.75, stroke: V('--ink', svg), 'stroke-width': 0.9 });
    const wg = E(svg, 'g', { 'clip-path': `url(#${ch})`, stroke: V('--ink', svg), 'stroke-width': 0.6, opacity: 0.45, fill: 'none' });
    for (let i = 0; i < 5; i++) {
      E(wg, 'path', { d: `M${190 - 130 + i * 10} ${430 - 24 + i * 10} q10 -4 20 0 t20 0 t20 0 t20 0 t20 0 t20 0` });
    }
    E(svg, 'path', { d: hd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1 });
  }

  const gd = blob(200, 88, 46, 34, 0, 202, 0.07, 46);
  const cg = 't1green';
  clipPath(defs, cg, gd);
  E(svg, 'path', { d: gd, fill: V('--turf', svg) });
  hatch(svg, cg, { x: 150, y: 50, w: 100, h: 76 }, 0.4, 4, { op: 0.16, seed: 22 });
  E(svg, 'path', { d: gd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.2 });
  radial(svg, blobPts(200, 88, 52, 40, 0, 202, 0.07, 46), 77, { len: 7, w: 0.5, op: 0.5 });
  pin(svg, 200, 88, { h: 30 });
  E(svg, 'text', { x: 200, y: 40, class: 'lab', 'text-anchor': 'middle' }, jazyk.t('teeShot1.L.green'));

  E(svg, 'rect', { x: 182, y: 585, width: 36, height: 18, rx: 3, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1.2 });
  E(svg, 'text', { x: 200, y: 626, class: 'lab', 'text-anchor': 'middle' }, jazyk.t('teeShot1.L.odpaliste'));

  const L = mode === 'trest' ? jazyk.t('teeShot1.L.trest')
    : mode === 'strategie' ? jazyk.t('teeShot1.L.strategieAgresivni')
    : jazyk.t('teeShot1.L.heroikaSkala');
  const lx = mode === 'trest' ? 200 : mode === 'strategie' ? 150 : 190;
  const ly = mode === 'trest' ? 300 : mode === 'strategie' ? 300 : 430;
  E(svg, 'text', { x: lx, y: ly - 6, class: 'lab sm', 'text-anchor': 'middle' }, L[0]);
  E(svg, 'text', { x: lx, y: ly + 10, class: 'lab sm', 'text-anchor': 'middle' }, L[1]);

  if (mode === 'strategie') {
    E(svg, 'text', { x: 280, y: 300, class: 'lab sm', 'text-anchor': 'middle' }, jazyk.t('teeShot1.L.strategieBezpecna')[0]);
    E(svg, 'text', { x: 280, y: 316, class: 'lab sm', 'text-anchor': 'middle' }, jazyk.t('teeShot1.L.strategieBezpecna')[1]);
  }
}

function renderTeeShot1() {
  kresliTeeShot1($('p1'), teeShot1Mode, jazyk.lang);
  $('teeShot1Popis').textContent = jazyk.t('teeShot1.popis.' + teeShot1Mode);
  document.querySelectorAll('#teeShot1Toggle button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === teeShot1Mode));
  });
}
document.querySelectorAll('#teeShot1Toggle button').forEach((b) => {
  b.addEventListener('click', () => { teeShot1Mode = b.dataset.mode; renderTeeShot1(); });
});

/* ============================================================================
 * TEE SHOT 2 — „Trest úměrný chybě“. Dvě jamky, stejná odchylka od linie
 * (0–20 m), jiná reakce návrhu. Prahy a přírůstky ran jsou ilustrativní
 * konstanty (ne ze `simulace.js` — ten model je pro approach, ne tee shot),
 * zdokumentované v `poznamky.md`, krok 4.
 * ==========================================================================*/
const T2_HRANICE = 8;   // m od osy — kde končí fairway na obou jamkách
const T2_HRANICE_B = 14; // m — jamka B: kde končí přechodová tráva a začíná bunkr
const T2_TREST_ROUGH = 0.4;
const T2_TREST_BUNKR = 0.9;
const T2_SCALE = 4.2; // px na metr uvnitř laně

function zonaT2(lane, v) {
  const av = Math.abs(v);
  if (av <= T2_HRANICE) return 'fairway';
  if (lane === 'B' && av <= T2_HRANICE_B) return 'rough';
  return 'bunkr';
}
function trestT2(lane, v) {
  const z = zonaT2(lane, v);
  return z === 'fairway' ? 0 : z === 'rough' ? T2_TREST_ROUGH : T2_TREST_BUNKR;
}

function kresliLane(svg, cx, lane, v, lang) {
  const defs = svg.querySelector('defs') || E(svg, 'defs', {});
  const top = 60, bot = 400, halfW = 90;

  // pás fairway/rough/bunkr — zvenku dovnitř
  const outerD = `M${cx - halfW} ${top} L${cx - halfW} ${bot} L${cx + halfW} ${bot} L${cx + halfW} ${top} Z`;
  E(svg, 'path', { d: outerD, fill: V('--sand', svg), opacity: lane === 'A' ? 0.9 : 0.85 });

  if (lane === 'B') {
    const roughHalf = T2_HRANICE_B * T2_SCALE;
    const roughD = `M${cx - roughHalf} ${top} L${cx - roughHalf} ${bot} L${cx + roughHalf} ${bot} L${cx + roughHalf} ${top} Z`;
    E(svg, 'path', { d: roughD, fill: V('--turf-d', svg) });
  }
  const fwHalf = T2_HRANICE * T2_SCALE;
  const fwD = `M${cx - fwHalf} ${top} L${cx - fwHalf} ${bot} L${cx + fwHalf} ${bot} L${cx + fwHalf} ${top} Z`;
  const cf = 'lane' + lane + 'fw';
  clipPath(defs, cf, fwD);
  E(svg, 'path', { d: fwD, fill: V('--turf', svg) });
  hatch(svg, cf, { x: cx - fwHalf, y: top, w: fwHalf * 2, h: bot - top }, Math.PI / 2, 5, { op: 0.12, seed: lane === 'A' ? 31 : 32 });
  E(svg, 'path', { d: fwD, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1 });
  E(svg, 'path', { d: outerD, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1 });

  // odpaliště + green markery
  E(svg, 'rect', { x: cx - 16, y: bot + 6, width: 32, height: 15, rx: 2.5, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1 });
  const gd = blob(cx, top - 30, 30, 20, 0, 500 + (lane === 'A' ? 1 : 2), 0.06, 36);
  const cg = 'lane' + lane + 'g';
  clipPath(defs, cg, gd);
  E(svg, 'path', { d: gd, fill: V('--turf', svg) });
  E(svg, 'path', { d: gd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1 });
  pin(svg, cx, top - 30, { h: 18, flagW: 12, flagH: 4 });

  // míček
  const zone = zonaT2(lane, v);
  const mx = cx + Math.min(v, 20) * T2_SCALE;
  const my = 220;
  E(svg, 'circle', { cx: mx, cy: my, r: 5, fill: V('--ink', svg), stroke: V('--paper', svg), 'stroke-width': 1.4 });

  E(svg, 'text', { x: cx, y: bot + 40, class: 'lab sm', 'text-anchor': 'middle' }, jazyk.t('teeShot2.L.' + (lane === 'A' ? 'jamkaA' : 'jamkaB')));
}

function kresliTeeShot2(svg, v, lang) {
  clear(svg);
  E(svg, 'defs', {});
  kresliLane(svg, 110, 'A', v, lang);
  kresliLane(svg, 290, 'B', v, lang);
  E(svg, 'line', { x1: 200, y1: 20, x2: 200, y2: 440, stroke: V('--ink2', svg), 'stroke-width': 0.8, opacity: 0.35, 'stroke-dasharray': '3 4' });
}

function renderTeeShot2() {
  const v = Number($('teeShot2Slider').value);
  $('teeShot2Out').textContent = v + ' m';
  kresliTeeShot2($('p2'), v, jazyk.lang);
  const radek = jazyk.t('teeShot2.radek');
  const fill = (lane, nadpisKlic) => radek
    .replace('{jamka}', jazyk.t('teeShot2.' + nadpisKlic + '.nadpis'))
    .replace('{stav}', jazyk.t('teeShot2.stav.' + zonaT2(lane, v)))
    .replace('{cost}', fmt(trestT2(lane, v), jazyk.lang, 1));
  $('teeShot2RadekA').innerHTML = fill('A', 'jamkaA');
  $('teeShot2RadekB').innerHTML = fill('B', 'jamkaB');
}
$('teeShot2Slider').addEventListener('input', renderTeeShot2);

/* ============================================================================
 * FAIRWAY — karty reálných jamek. Jedna funkce vykreslí libovolnou kartu
 * (viz `vykresliJamku` v `js/platy.js`), tenhle modul jen doplní textový
 * panel kolem plátu.
 * ==========================================================================*/
function kartaJamky(container, karta, lang) {
  const wrap = document.createElement('div');
  wrap.className = 'karta';
  // Připoj plát do živého dokumentu DŘÍV, než do něj kreslíš — `vykresliJamku`
  // čte barvy přes `getComputedStyle` (viz `V()` v `js/platy.js`), a na
  // odpojeném uzlu vrací počítaný styl prázdné hodnoty. Proto container.append
  // hned teď, ne až s celou hotovou kartou na konci (past, kterou tenhle
  // krok objevil — viz poznamky.md, krok 4).
  container.appendChild(wrap);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('role', 'img');
  wrap.appendChild(svg);
  vykresliJamku(svg, karta);

  const K = slovnik[lang].spolecneKarty;
  const nazev = karta.nazev && karta.nazev[lang] ? `${karta.hriste} — ${karta.nazev[lang]}` : `${karta.hriste} · #${karta.jamka}`;
  const dl = karta.delky[0];
  const architekt = karta.architekt.uvadeny[lang];

  const hlava = document.createElement('p');
  hlava.className = 'kartaHlava';
  hlava.textContent = karta.zeme + ' · #' + karta.jamka;
  wrap.appendChild(hlava);

  const h3 = document.createElement('p');
  h3.className = 'kartaNazev';
  h3.textContent = nazev;
  wrap.appendChild(h3);

  const meta = document.createElement('p');
  meta.className = 'kartaMeta';
  meta.innerHTML = `<b>${K.parLabel}</b> ${karta.par} &nbsp;·&nbsp; <b>${K.delkaLabel}</b> ${dl.m} m / ${dl.yd} yd &nbsp;·&nbsp; <b>${K.architektLabel}</b> ${architekt} &nbsp;·&nbsp; <b>${K.vznikLabel}</b> ${karta.vznik}`;
  wrap.appendChild(meta);

  const otazka = document.createElement('p');
  otazka.className = 'kartaOtazka';
  otazka.innerHTML = `<b>${K.otazkaLabel}:</b> ${karta.otazka[lang]}`;
  wrap.appendChild(otazka);

  const specsHead = document.createElement('div');
  specsHead.className = 'hr';
  specsHead.style.marginTop = '16px';
  specsHead.innerHTML = `<span>${K.specsHead}</span>`;
  wrap.appendChild(specsHead);

  const specs = document.createElement('div');
  specs.className = 'specs kartaPrvky';
  karta.prvky.forEach((p) => {
    const d = document.createElement('div');
    d.className = 'spec';
    d.innerHTML = `<h3>${p.nazev[lang]}</h3><div class="bar"></div><p>${p.popis[lang]}</p>`;
    specs.appendChild(d);
  });
  wrap.appendChild(specs);

  const prameny = document.createElement('p');
  prameny.className = 'kartaPrameny';
  prameny.innerHTML = `<b>${K.prameny}:</b> ` + karta.prameny.map((p) => `<a href="${p.url}" target="_blank" rel="noopener">${p.titul}</a>`).join(' · ');
  wrap.appendChild(prameny);

  return wrap;
}

function renderKartyFairway() {
  const c = $('fairwayCards');
  c.innerHTML = '';
  [kartaSawgrass, kartaPebble, kartaRiviera].forEach((k) => kartaJamky(c, k, jazyk.lang));
}
function renderKartaCeska() {
  const c = $('ceskaKarta');

  kartaJamky(c, kartaKarlstejn, jazyk.lang);
}

/* ============================================================================
 * APPROACH 1 — „Kam patří bunkr“. Adaptace `cviceni-bunkr-perokresba.html`
 * na `js/platy.js` a `js/simulace.js`. Souřadnice v metrech, stejná
 * geometrie jako v prototypu.
 * ==========================================================================*/
const A1_WX = [-46, 46], A1_WY = [-25, 375];
const A1_SX = 400 / (A1_WX[1] - A1_WX[0]), A1_SY = 900 / (A1_WY[1] - A1_WY[0]);
const a1px = (x) => (x - A1_WX[0]) * A1_SX;
const a1py = (y) => 900 - (y - A1_WY[0]) * A1_SY;

const A1_GREEN = { x: 18, y: 345, rx: 16, ry: 13 };
const A1_PIN = { x: 20, y: 349 };
const A1_WATER = { x: 31, y: 314, rx: 17, ry: 12 };
const A1_OB = 44;
const A1_EDGES = [
  { y: 35, L: -20, R: 22 }, { y: 120, L: -22, R: 26 }, { y: 200, L: -20, R: 24 },
  { y: 260, L: -24, R: 16 }, { y: 302, L: -24, R: 2 },
];
function a1EdgesAt(y) {
  if (y < A1_EDGES[0].y || y > A1_EDGES[A1_EDGES.length - 1].y) return null;
  for (let i = 0; i < A1_EDGES.length - 1; i++) {
    const a = A1_EDGES[i], b = A1_EDGES[i + 1];
    if (y >= a.y && y <= b.y) { const t = (y - a.y) / (b.y - a.y); return { L: a.L + (b.L - a.L) * t, R: a.R + (b.R - a.R) * t }; }
  }
  return null;
}
const a1InEll = (x, y, e) => ((x - e.x) ** 2) / (e.rx ** 2) + ((y - e.y) ** 2) / (e.ry ** 2) <= 1;
const a1InFw = (x, y) => { const e = a1EdgesAt(y); return !!e && x >= e.L && x <= e.R; };

let a1Bunkers = [];
const A1_BR = 9;
const a1InBunker = (x, y) => a1Bunkers.some((b) => Math.hypot(x - b.x, y - b.y) <= b.r);

function a1ResolveLie(x, y) {
  if (Math.abs(x) > A1_OB) return { trest: true, x: Math.sign(x) * (A1_OB - 3), y };
  if (a1InEll(x, y, A1_WATER)) return { trest: true, x: A1_WATER.x - A1_WATER.rx - 7, y: A1_WATER.y - 5 };
  if (a1InEll(x, y, A1_GREEN)) return { typ: 'green' };
  if (a1InBunker(x, y)) return { typ: 'bunkr' };
  if (a1InFw(x, y)) return { typ: 'fairway' };
  return { typ: 'rough' };
}
function a1Aim(hrac) {
  const e = a1EdgesAt(Math.min(hrac.drive, 300)) || { L: -22, R: 12 };
  return { x: (e.L + e.R) / 2, y: hrac.drive };
}
function a1Hraj(hrac, n) {
  return odehrajKolo(hrac, { pin: A1_PIN, aim: a1Aim(hrac), resolveLie: a1ResolveLie }, n);
}

let a1Shots = null;
let a1Base = null;

function kresliApproach1(svg) {
  clear(svg);
  const defs = E(svg, 'defs', {});

  const sur = blob(200, 450, 182, 432, 0, 101, 0.03);
  const cS = 'a1sur';
  clipPath(defs, cS, sur);
  E(svg, 'path', { d: sur, fill: V('--turf-d', svg), opacity: 0.42 });
  hatch(svg, cS, { x: 10, y: 10, w: 380, h: 880 }, 1.15, 3.6, { op: 0.3, seed: 5 });
  hatch(svg, cS, { x: 10, y: 10, w: 380, h: 880 }, -0.5, 9, { op: 0.14, seed: 6 });
  E(svg, 'path', { d: sur, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1, opacity: 0.7 });

  let d = '';
  A1_EDGES.forEach((e, i) => { d += (i ? 'L' : 'M') + a1px(e.L).toFixed(1) + ' ' + a1py(e.y).toFixed(1) + ' '; });
  for (let i = A1_EDGES.length - 1; i >= 0; i--) d += 'L' + a1px(A1_EDGES[i].R).toFixed(1) + ' ' + a1py(A1_EDGES[i].y).toFixed(1) + ' ';
  d += 'Z';
  const cF = 'a1fw';
  clipPath(defs, cF, d);
  E(svg, 'path', { d, fill: V('--turf', svg), opacity: 0.95 });
  hatch(svg, cF, { x: 60, y: 180, w: 280, h: 700 }, Math.PI / 2, 5, { op: 0.1, seed: 12 });
  E(svg, 'path', { d, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1 });

  const wd = blob(a1px(A1_WATER.x), a1py(A1_WATER.y), A1_WATER.rx * A1_SX, A1_WATER.ry * A1_SY, 0, 404, 0.08, 44);
  const cW = 'a1water';
  clipPath(defs, cW, wd);
  E(svg, 'path', { d: wd, fill: V('--water', svg), opacity: 0.75 });
  const wg = E(svg, 'g', { 'clip-path': `url(#${cW})`, stroke: V('--ink', svg), 'stroke-width': 0.7, opacity: 0.5, fill: 'none' });
  for (let i = 0; i < 7; i++) {
    E(wg, 'path', { d: `M${a1px(A1_WATER.x) - 70} ${a1py(A1_WATER.y) - 24 + i * 8} q10 -4 20 0 t20 0 t20 0 t20 0 t20 0 t20 0` });
  }
  E(svg, 'path', { d: wd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1 });

  const gd = blob(a1px(A1_GREEN.x), a1py(A1_GREEN.y), A1_GREEN.rx * A1_SX, A1_GREEN.ry * A1_SY, 0, 202, 0.07, 50);
  const cG = 'a1green';
  clipPath(defs, cG, gd);
  E(svg, 'path', { d: gd, fill: V('--turf', svg) });
  hatch(svg, cG, { x: a1px(A1_GREEN.x) - 80, y: a1py(A1_GREEN.y) - 40, w: 160, h: 80 }, 0.4, 4, { op: 0.16, seed: 22 });
  E(svg, 'path', { d: gd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.3 });
  radial(svg, blobPts(a1px(A1_GREEN.x), a1py(A1_GREEN.y), A1_GREEN.rx * A1_SX + 7, A1_GREEN.ry * A1_SY + 5, 0, 202, 0.07, 50), 77, { len: 7, w: 0.5, op: 0.45 });

  a1Bunkers.forEach((b, i) => {
    const cx = a1px(b.x), cy = a1py(b.y), rx = b.r * A1_SX, ry = b.r * A1_SY;
    const bd = blob(cx, cy, rx, ry, 0.3 + i, 303 + i * 111, 0.17, 40);
    const id = 'a1b' + i;
    clipPath(defs, id, bd);
    E(svg, 'path', { d: bd, fill: V('--sand', svg) });
    stipple(svg, id, { x: cx - rx * 1.3, y: cy - ry * 1.3, w: rx * 2.6, h: ry * 2.6 }, 70, 333 + i * 97);
    E(svg, 'path', { d: bd, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.2 });
    radial(svg, blobPts(cx, cy, rx, ry, 0.3 + i, 303 + i * 111, 0.17, 40), 808 + i * 13, { len: 11, w: 0.6, op: 0.65 });
  });

  if (a1Shots) {
    const g24 = E(svg, 'g', { stroke: V('--ink2', svg), 'stroke-width': 0.9, opacity: 0.55, fill: 'none' });
    a1Shots.p24.forEach((p) => {
      const X = a1px(p.x), Y = a1py(p.y);
      E(g24, 'path', { d: `M${(X - 2.6).toFixed(1)} ${(Y - 2.6).toFixed(1)} l5.2 5.2 M${(X + 2.6).toFixed(1)} ${(Y - 2.6).toFixed(1)} l-5.2 5.2` });
    });
    const g0 = E(svg, 'g', { fill: V('--ink', svg), opacity: 0.85 });
    a1Shots.p0.forEach((p) => E(g0, 'circle', { cx: a1px(p.x).toFixed(1), cy: a1py(p.y).toFixed(1), r: 2.1 }));
  }

  pin(svg, a1px(A1_PIN.x), a1py(A1_PIN.y), { h: 26 });
  E(svg, 'rect', { x: a1px(0) - 18, y: a1py(0) - 9, width: 36, height: 18, rx: 3, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1.2 });

  const ax = E(svg, 'g', { stroke: V('--ink2', svg), 'stroke-width': 0.9, opacity: 0.65, fill: 'none' });
  [100, 200, 300].forEach((m) => {
    E(ax, 'line', { x1: 6, y1: a1py(m), x2: 20, y2: a1py(m) });
    E(svg, 'text', { x: 24, y: a1py(m) + 5, class: 'lab sm' }, m + ' m');
  });
  E(svg, 'text', { x: a1px(A1_GREEN.x), y: a1py(A1_GREEN.y) - 42, class: 'lab', 'text-anchor': 'middle' }, jazyk.t('approach1.L.green'));
  E(svg, 'text', { x: a1px(A1_WATER.x), y: a1py(A1_WATER.y) + 6, class: 'lab sm', 'text-anchor': 'middle' }, jazyk.t('approach1.L.rybnik'));
  E(svg, 'text', { x: a1px(0), y: a1py(0) + 34, class: 'lab', 'text-anchor': 'middle' }, jazyk.t('approach1.L.odpaliste'));

  E(svg, 'path', { d: `M300 ${a1py(288)} L${a1px(6).toFixed(0)} ${a1py(276)}`, class: 'lead' });
  const fs = jazyk.t('approach1.L.fairwaySmer');
  E(svg, 'text', { x: 396, y: a1py(292), class: 'lab sm', 'text-anchor': 'end' }, fs[0]);
  E(svg, 'text', { x: 396, y: a1py(292) + 18, class: 'lab sm', 'text-anchor': 'end' }, fs[1]);
}

function a1StateText() {
  const n = a1Bunkers.length;
  if (!n) return jazyk.t('approach1.stavPrazdno');
  const slovo = jazyk.t('approach1.slovoBunkr.' + (n === 1 ? 'jeden' : n < 5 ? 'malo' : 'hodne'));
  return jazyk.t('approach1.stavPocet').replace('{n}', n).replace('{slovo}', slovo);
}

function a1Verdict(r0, r24) {
  const lang = jazyk.lang;
  const sp = r24.prumer - r0.prumer;
  if (!a1Bunkers.length) {
    return jazyk.t('approach1.verdict.prazdna').replace('{spread}', fmt(sp, lang));
  }
  const d0 = r0.prumer - a1Base.r0.prumer, d24 = r24.prumer - a1Base.r24.prumer;
  let t;
  if (d24 > d0 + 0.15) t = jazyk.t('approach1.verdict.trest').replace('{d24}', fmt(d24, lang)).replace('{d0}', fmt(d0, lang));
  else if (d0 > d24 + 0.1) t = jazyk.t('approach1.verdict.strategie').replace('{d0}', fmt(d0, lang)).replace('{d24}', fmt(d24, lang));
  else if (Math.abs(d0) < 0.06 && Math.abs(d24) < 0.06) t = jazyk.t('approach1.verdict.dekorace').replace('{d0}', fmt(d0, lang)).replace('{d24}', fmt(d24, lang));
  else t = jazyk.t('approach1.verdict.oba').replace('{d0}', fmt(d0, lang)).replace('{d24}', fmt(d24, lang));
  if (sp > 3.4) t += jazyk.t('approach1.verdict.spreadVarovani').replace('{spread}', fmt(sp, lang));
  return t;
}

function a1UpdateResults() {
  if (!a1Shots) return;
  const lang = jazyk.lang;
  const rows = [
    ['HCP 0', a1Shots.r0, a1Base && a1Base.r0],
    ['HCP 24', a1Shots.r24, a1Base && a1Base.r24],
  ];
  $('a1tb').innerHTML = rows.map(([name, r, base]) => {
    let dl = '';
    if (base && a1Bunkers.length) {
      const dv = r.prumer - base.prumer;
      dl = `<small class="${Math.abs(dv) < 0.06 ? 'flat' : ''}">${dv >= 0 ? '+' : '−'}${fmt(Math.abs(dv), lang)}</small>`;
    }
    return `<tr><td>${name}</td><td>${Math.round(r.fairwayPct)} %</td><td>${Math.round(r.bunkrPct)} %</td>` +
      `<td>${Math.round(r.trestPct)} %</td><td class="score">${fmt(r.prumer, lang)}${dl}</td></tr>`;
  }).join('');
  $('a1verdict').innerHTML = a1Verdict(a1Shots.r0, a1Shots.r24);
}

function renderApproach1() {
  kresliApproach1($('p3'));
  $('a1state').textContent = a1StateText();
  if (a1Shots) a1UpdateResults();
}

$('p3').addEventListener('click', (ev) => {
  const r = $('p3').getBoundingClientRect();
  const sx = (ev.clientX - r.left) / r.width * 400, sy = (ev.clientY - r.top) / r.height * 900;
  const wx = sx / A1_SX + A1_WX[0], wy = (900 - sy) / A1_SY + A1_WY[0];
  const hit = a1Bunkers.findIndex((b) => Math.hypot(wx - b.x, wy - b.y) <= b.r + 3);
  if (hit >= 0) a1Bunkers.splice(hit, 1);
  else if (a1Bunkers.length < 4) a1Bunkers.push({ x: wx, y: wy, r: A1_BR });
  a1Shots = null;
  $('a1results').hidden = true;
  renderApproach1();
});
$('a1run').addEventListener('click', () => {
  const r0 = a1Hraj(HRACI[0], 100), r24 = a1Hraj(HRACI[24], 100);
  a1Shots = { p0: r0.dopady, p24: r24.dopady, r0, r24 };
  renderApproach1();
  $('a1results').hidden = false;
  a1UpdateResults();
});
// Základní hodnota (prázdná jamka, bez bunkru) se počítá jednou při načtení
// stránky, ne až při prvním klepnutí na „Odehrát“ — jinak by `a1Base` zůstal
// `null`, kdyby student položil bunkr ještě před prvním odehráním (viz
// poznamky.md, krok 4). Vyšší `n` (300) kvůli stabilitě základní hodnoty.
a1Base = { r0: a1Hraj(HRACI[0], 300), r24: a1Hraj(HRACI[24], 300) };
$('a1clear').addEventListener('click', () => {
  a1Bunkers = []; a1Shots = null;
  $('a1results').hidden = true;
  renderApproach1();
});

/* ============================================================================
 * APPROACH 2 — „Kde je rovnováha“. Model podle poznámek ke kroku 4: hráč
 * HCP 18, referenční vzdálenost přiblížení 140 m, jezdec 0–100 % těsnosti
 * lineárně mění bezpečnou marži (24 → 2 m) i zkrácení přístupu (0 → 30 m).
 * Zisk počítá `puttyPlynule()` (plynulá verze `putty()` ze `simulace.js`) —
 * obyčejná `putty()` má jen pět schodů po 2/5/10/20 m, takže by na tomhle
 * rozsahu vzdáleností (přiblížení kolem 110–140 m, boční chyba ~10 %,
 * tedy 11–15 m od jamky) zůstala celou dobu v jednom pásmu a jezdec by
 * nedělal vůbec nic — viz poznamky.md, krok 4.
 *
 * Konstanty (D0, bezpečná marže, zkrácení) jsou zvolené tak, aby se křivky
 * na posuvníku 0–100 % skutečně PROTNULY (kolem 60 %) — s původními
 * hodnotami z prvního návrhu (D0 140 m, marže 24→2 m, zkrácení 30 m) riziko
 * převyšovalo zisk už od nuly a průsečík by nikdy nenastal. Vyladěno
 * numerickým hledáním, viz poznamky.md, krok 4.
 * ==========================================================================*/
const A2_D0 = 150, A2_HCP = 18;
const a2SafeMargin = (t) => 40 - (t / 100) * 37;
const a2MetersSaved = (t) => (t / 100) * 50;
const a2Remaining = (t) => A2_D0 - a2MetersSaved(t);
const a2ApproachStrokes = (d) => 1 + puttyPlynule(d * bocniChyba(A2_HCP));
const a2Gain = (t) => a2ApproachStrokes(A2_D0) - a2ApproachStrokes(a2Remaining(t));
const a2Sigma = (t) => a2Remaining(t) * bocniChyba(A2_HCP);
const a2PHazard = (t) => 1 - normCdf(a2SafeMargin(t) / a2Sigma(t));
const a2Risk = (t) => a2PHazard(t);

function kresliApproach2(svg, t) {
  clear(svg);
  const padL = 34, padR = 12, padT = 14, padB = 26;
  const w = 400 - padL - padR, h = 300 - padT - padB;
  const N = 40;
  let maxV = 0.1;
  const gains = [], risks = [];
  for (let i = 0; i <= N; i++) { const tt = i / N * 100; const g = a2Gain(tt), r = a2Risk(tt); gains.push(g); risks.push(r); maxV = Math.max(maxV, g, r); }
  maxV *= 1.12;
  const X = (tt) => padL + (tt / 100) * w;
  const Y = (v) => padT + h - (v / maxV) * h;

  E(svg, 'line', { x1: padL, y1: padT, x2: padL, y2: padT + h, stroke: V('--ink2', svg), 'stroke-width': 1, opacity: 0.6 });
  E(svg, 'line', { x1: padL, y1: padT + h, x2: padL + w, y2: padT + h, stroke: V('--ink2', svg), 'stroke-width': 1, opacity: 0.6 });
  [0, 25, 50, 75, 100].forEach((tt) => {
    E(svg, 'text', { x: X(tt), y: padT + h + 16, class: 'lab sm', 'text-anchor': 'middle' }, tt + '%');
  });

  const ptsG = gains.map((g, i) => `${X(i / N * 100).toFixed(1)},${Y(g).toFixed(1)}`).join(' ');
  const ptsR = risks.map((r, i) => `${X(i / N * 100).toFixed(1)},${Y(r).toFixed(1)}`).join(' ');
  E(svg, 'polyline', { points: ptsG, fill: 'none', stroke: V('--olive', svg), 'stroke-width': 2 });
  E(svg, 'polyline', { points: ptsR, fill: 'none', stroke: V('--flag', svg), 'stroke-width': 2 });

  E(svg, 'line', { x1: X(t), y1: padT, x2: X(t), y2: padT + h, stroke: V('--ink', svg), 'stroke-width': 1, 'stroke-dasharray': '3 4', opacity: 0.6 });
  E(svg, 'circle', { cx: X(t), cy: Y(a2Gain(t)), r: 3.6, fill: V('--olive', svg) });
  E(svg, 'circle', { cx: X(t), cy: Y(a2Risk(t)), r: 3.6, fill: V('--flag', svg) });
}

function renderApproach2() {
  const t = Number($('a2Slider').value);
  const lang = jazyk.lang;
  kresliApproach2($('p4'), t);
  $('a2Out').textContent = t + ' %';
  $('a2Tesnost').textContent = t + ' %';
  const jednotka = jazyk.t('approach2.jednotka');
  const g = a2Gain(t), r = a2Risk(t);
  $('a2Zisk').textContent = fmt(g, lang) + ' ' + jednotka;
  $('a2Riziko').textContent = fmt(r, lang) + ' ' + jednotka;
  $('a2Cisty').textContent = fmt(g - r, lang) + ' ' + jednotka;
  const klic = Math.abs(g - r) < 0.01 ? 'vyrokVyrovnano' : g > r ? 'vyrokPresahuje' : 'vyrokZaostava';
  $('a2vyrok').innerHTML = jazyk.t('approach2.' + klic).replace('{t}', t).replace('{zisk}', fmt(g, lang)).replace('{riziko}', fmt(r, lang));
}
$('a2Slider').addEventListener('input', renderApproach2);

/* ============================================================================
 * PUTT — tři otevřené otázky, ukládané do localStorage (bez bodování).
 * ==========================================================================*/
const PUTT_KLIC = 'routing.poznamky.lekce1';
function puttNacti() {
  try { const a = JSON.parse(localStorage.getItem(PUTT_KLIC) || '[]'); return Array.isArray(a) ? a : []; } catch { return []; }
}
function puttUloz(i, text) {
  const a = puttNacti();
  a[i] = text;
  localStorage.setItem(PUTT_KLIC, JSON.stringify(a));
}
function renderPutt() {
  const c = $('puttQuestions');
  c.innerHTML = '';
  const otazky = jazyk.t('putt.otazky');
  const ulozene = puttNacti();
  otazky.forEach((text, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'puttQ';
    const p = document.createElement('p');
    p.className = 'otazka';
    p.textContent = text;
    const ta = document.createElement('textarea');
    ta.placeholder = jazyk.t('putt.poznamkaPlaceholder');
    ta.value = ulozene[i] || '';
    const saved = document.createElement('p');
    saved.className = 'puttSaved';
    saved.textContent = ta.value ? jazyk.t('putt.ulozeno') : '';
    ta.addEventListener('input', () => {
      puttUloz(i, ta.value);
      saved.textContent = jazyk.t('putt.ulozeno');
    });
    wrap.appendChild(p); wrap.appendChild(ta); wrap.appendChild(saved);
    c.appendChild(wrap);
  });
}

  const c = $('slovnicekList');

/* ============================================================================
 * ZKOUŠKA — miniatury pro obrázkové otázky (Q1, Q4), adaptované z
 * `test-lekce-01.html` na `js/platy.js`. Viewbox `0 0 120 220` nastavuje
 * `zkouska.js` sám.
 * ==========================================================================*/
function hatchRectMini(svg, clipId, box, angle, gap, op, seed) {
  hatch(svg, clipId, box, angle, gap, { w: 0.45, op, seed });
}

function kresliMiniFilozofie(svg, kind) {
  const defs = E(svg, 'defs', {});
  const sur = blob(60, 110, 52, 102, 0, 7, 0.04, 40);
  const cs = 'mf' + kind + 's';
  clipPath(defs, cs, sur);
  E(svg, 'path', { d: sur, fill: V('--turf-d', svg), opacity: 0.4 });
  hatchRectMini(svg, cs, { x: 0, y: 0, w: 120, h: 220 }, 1.1, 3.4, 0.3, 4);
  E(svg, 'path', { d: sur, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 0.9, opacity: 0.7 });

  const F = { a: 'M44 186 L42 62 L78 62 L76 186 Z', b: 'M34 190 L28 84 L92 78 L96 190 Z', c: 'M30 188 L26 60 L96 60 L92 188 Z' }[kind];
  E(svg, 'path', { d: F, fill: V('--turf', svg) });
  E(svg, 'path', { d: F, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1 });

  if (kind === 'a') {
    ['M10 62 L42 62 L44 186 L10 186 Z', 'M76 62 L110 62 L110 186 L78 186 Z'].forEach((d) =>
      E(svg, 'path', { d, fill: V('--water', svg), opacity: 0.75, stroke: V('--ink', svg), 'stroke-width': 0.9 }));
  }
  if (kind === 'b') {
    const bd = blob(40, 100, 15, 20, 0, 11, 0.18, 30);
    E(svg, 'path', { d: bd, fill: V('--sand', svg), stroke: V('--ink', svg), 'stroke-width': 1 });
    const wd = blob(88, 64, 17, 10, 0, 13, 0.15, 30);
    E(svg, 'path', { d: wd, fill: V('--water', svg), opacity: 0.8, stroke: V('--ink', svg), 'stroke-width': 0.9 });
  }
  if (kind === 'c') {
    E(svg, 'path', { d: 'M26 156 L104 74 L104 112 L36 178 Z', fill: V('--water', svg), opacity: 0.75, stroke: V('--ink', svg), 'stroke-width': 0.9 });
  }
  const gp = blob(60, 46, 24, 16, 0, 21, 0.08, 34);
  E(svg, 'path', { d: gp, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1.1 });
  pin(svg, 60, 44, { h: 16, r: 2, flagW: 12, flagH: 4 });
  E(svg, 'rect', { x: 52, y: 192, width: 18, height: 7, rx: 2, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1 });
}

function kresliMiniBunkr(svg, pos) {
  const defs = E(svg, 'defs', {});
  const sur = blob(60, 110, 52, 102, 0, 31, 0.04, 40);
  const cs = 'mb' + pos + 's';
  clipPath(defs, cs, sur);
  E(svg, 'path', { d: sur, fill: V('--turf-d', svg), opacity: 0.4 });
  hatchRectMini(svg, cs, { x: 0, y: 0, w: 120, h: 220 }, 1.1, 3.6, 0.26, 8);
  E(svg, 'path', { d: sur, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 0.9, opacity: 0.7 });

  const F = 'M34 190 L28 88 L90 78 L98 190 Z';
  E(svg, 'path', { d: F, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1 });
  const wd = blob(90, 64, 17, 10, 0, 33, 0.15, 30);
  E(svg, 'path', { d: wd, fill: V('--water', svg), opacity: 0.8, stroke: V('--ink', svg), 'stroke-width': 0.9 });
  const gp = blob(54, 46, 23, 15, 0, 35, 0.08, 34);
  E(svg, 'path', { d: gp, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1.1 });
  pin(svg, 56, 44, { h: 16, r: 2, flagW: 12, flagH: 4 });
  E(svg, 'rect', { x: 56, y: 192, width: 18, height: 7, rx: 2, fill: V('--turf', svg), stroke: V('--ink', svg), 'stroke-width': 1 });

  const P = { a: [62, 160], b: [38, 104], c: [96, 118] }[pos];
  const bd = blob(P[0], P[1], 14, 9, 0.3, 41, 0.18, 30);
  E(svg, 'path', { d: bd, fill: V('--sand', svg), stroke: V('--ink', svg), 'stroke-width': 1.1 });
}

const zkouskaOtazky = [
  {
    typ: 'obrazek', body: 20, tema: 'strategie', textKlic: 'zkouska.q1.text', hintKlic: 'zkouska.q1.hint',
