<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, clipPath, blob } from '../../js/platy.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-06.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 6: Tee shot' : 'ROUTING — Lesson 6: Tee shot',
});

/* ============================================================================
 * JEDEN GREEN, TŘI POVRCHY
 *
 * Obrys greenu je ve všech třech variantách STEJNÝ — elipsa 13 × 12 metrů,
 * tedy zhruba 490 m², což je běžná velikost greenu na turnajovém hřišti.
 * Mění se jen výšková funkce `h(x, y)` v metrech. Použitelná plocha se
 * nezadává, POČÍTÁ SE: plán se navzorkuje po půl metru, v každém vzorku se
 * numericky spočítá spád (velikost gradientu výškové funkce) a sečte se
 * plocha vzorků se spádem pod 3 %. Čísla pod obrázkem tedy popisují přesně
 * tu plochu, která je na obrázku vyšrafovaná — nejsou to hodnoty vypsané
 * z hlavy.
 *
 * Hranice 3 % vychází z toho, co o pinovatelnosti říkají prameny
 * k Pinehurstu No. 2 (viz karta jamky v sekci 2): USGA jde výjimečně na
 * čtyři procenta, výš už se míč u jamky neudrží.
 *
 * Souřadnice jsou v metrech se středem uprostřed greenu; y roste směrem
 * DOZADU (od hráče), takže „zezadu dopředu" znamená klesající y.
 * ==========================================================================*/
const GRX = 15, GRY = 11;                 // poloosy greenu v metrech
const S = 10.5;                           // metry → jednotky viewBoxu
const toX = (x) => 200 + x * S;
const toY = (y) => 160 - y * S;
const KROK = 0.5;                         // vzorkovací krok v metrech
const MEZ = 0.03;                         // 3 % spádu

const POVRCHY = {
  /* Rovnoměrný spád zezadu dopředu, 1,5 %. */
  rovny: (x, y) => 0.015 * y,
  /* Dvě rovné plošiny (1,2 %) oddělené rampou 0,55 m na třech metrech. */
  patra: (x, y) => {
    const zaklad = 0.012 * y;
    if (y > 2) return zaklad + 0.55;
    if (y < -1) return zaklad;
    return zaklad + 0.55 * ((y + 1) / 3);
  },
  /* Vypouklý green: uprostřed plošinka, k okraji stále prudší spád.
     Čtvrtá mocnina normované vzdálenosti od středu — ne parabola, ta by
     měla prudký spád hned od středu a pinovatelných by zbyla pár procent. */
  vypukly: (x, y) => {
    const u2 = (x / GRX) ** 2 + (y / GRY) ** 2;
    return -0.5 * u2 * u2;
  },
};

function vGreenu(x, y) { return (x / GRX) ** 2 + (y / GRY) ** 2 <= 1; }

/** Spád (velikost gradientu) v daném bodě, numericky. */
function spad(f, x, y) {
  const d = 0.25;
  const gx = (f(x + d, y) - f(x - d, y)) / (2 * d);
  const gy = (f(x, y + d) - f(x, y - d)) / (2 * d);
  return { gx, gy, velikost: Math.hypot(gx, gy) };
}

/** Navzorkuje green a vrátí použitelné buňky i plochy v m². */
function analyza(klic) {
  const f = POVRCHY[klic];
  const bunky = [];
  let celkem = 0, pouzitelna = 0;
  for (let x = -GRX; x <= GRX; x += KROK) {
    for (let y = -GRY; y <= GRY; y += KROK) {
      if (!vGreenu(x, y)) continue;
      celkem += KROK * KROK;
      const s = spad(f, x, y);
      if (s.velikost < MEZ) { pouzitelna += KROK * KROK; bunky.push({ x, y }); }
    }
  }
  return { bunky, celkem, pouzitelna, podil: celkem ? (pouzitelna / celkem) * 100 : 0 };
}

const ANALYZY = {};
Object.keys(POVRCHY).forEach((k) => { ANALYZY[k] = analyza(k); });

function cislo(n, des = 0) {
  const t = n.toFixed(des);
  return jazyk.lang === 'cs' ? t.replace('.', ',') : t;
}

function kresliPlat(svg, klic) {
  clear(svg);
  const defs = E(svg, 'defs', {});
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg),
    turfD = V('--turf-d', svg), flag = V('--flag', svg);
  const a = ANALYZY[klic], f = POVRCHY[klic];

  E(svg, 'rect', { x: 0, y: 0, width: 400, height: 330, fill: turfD, opacity: 0.3 });

  // obrys greenu
  const gd = blob(toX(0), toY(0), GRX * S, GRY * S, 0, 6101, 0.05, 60);
  clipPath(defs, 'l6-gr', gd);
  E(svg, 'path', { d: gd, fill: turf, opacity: 0.95 });

  // použitelná plocha — buňky se spádem pod 3 %
  const g = E(svg, 'g', { 'clip-path': 'url(#l6-gr)' });
  const k = KROK * S;
  a.bunky.forEach((b) => {
    E(g, 'rect', { x: (toX(b.x) - k / 2).toFixed(1), y: (toY(b.y) - k / 2).toFixed(1), width: k.toFixed(1), height: k.toFixed(1), fill: ink, opacity: 0.22 });
  });

  E(svg, 'path', { d: gd, fill: 'none', stroke: ink, 'stroke-width': 1.3 });

  // šipky spádnice na hrubé mřížce
  const sipky = E(svg, 'g', { stroke: ink2, 'stroke-width': 1, fill: 'none', opacity: 0.75, 'clip-path': 'url(#l6-gr)' });
  for (let x = -10; x <= 10; x += 5) {
    for (let y = -9; y <= 9; y += 4.5) {
      if (!vGreenu(x * 1.08, y * 1.08)) continue;
      const s = spad(f, x, y);
      if (s.velikost < 0.004) continue;
      const dl = Math.min(16, 5 + s.velikost * 90);
      const ux = -s.gx / s.velikost, uy = -s.gy / s.velikost;     // dolů po spádnici
      const x1 = toX(x), y1 = toY(y);
      const x2 = x1 + ux * dl, y2 = y1 - uy * dl;
      E(sipky, 'line', { x1: x1.toFixed(1), y1: y1.toFixed(1), x2: x2.toFixed(1), y2: y2.toFixed(1) });
      const ang = Math.atan2(y2 - y1, x2 - x1);
      E(sipky, 'path', {
        d: `M${x2.toFixed(1)} ${y2.toFixed(1)} L${(x2 - Math.cos(ang - 0.45) * 4.5).toFixed(1)} ${(y2 - Math.sin(ang - 0.45) * 4.5).toFixed(1)}`
          + ` M${x2.toFixed(1)} ${y2.toFixed(1)} L${(x2 - Math.cos(ang + 0.45) * 4.5).toFixed(1)} ${(y2 - Math.sin(ang + 0.45) * 4.5).toFixed(1)}`,
      });
    }
  }

  const cs = jazyk.lang === 'cs';
  E(svg, 'text', { x: 200, y: 324, class: 'lab sm', 'text-anchor': 'middle', fill: ink },
    cs ? 'PŘÍCHOD RÁNY' : 'SHOT COMES FROM HERE');
  E(svg, 'path', { d: 'M200 316 L200 302 M200 302 L196 308 M200 302 L204 308', stroke: flag, 'stroke-width': 1.6, fill: 'none' });
}

function render() {
  const klic = document.querySelector('#povrchToggle button[aria-pressed="true"]')?.dataset.povrch || 'rovny';
  kresliPlat($('p1'), klic);
  $('povrchPopis').innerHTML = jazyk.t('teeShot.popis.' + klic);
  const a = ANALYZY[klic];
  const jed = jazyk.lang === 'cs' ? ' m²' : ' m²';
  $('pCelkem').textContent = cislo(a.celkem) + jed;
  $('pPouzit').textContent = cislo(a.pouzitelna) + jed;
  $('pPodil').textContent = cislo(a.podil) + ' %';
  const klicV = a.podil > 85 ? 'siroky' : (a.podil < 45 ? 'ostrov' : 'uzky');
  $('plochaVerdikt').textContent = jazyk.t('teeShot.verdikt.' + klicV).replace('{proc}', cislo(a.podil));
}

document.querySelectorAll('#povrchToggle button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#povrchToggle button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
});

jazyk.on(() => {
  render();
  vykresliNavSekci({ lekce: 6, index: 0, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 6, index: 0, jazyk, slovnikPojmu });
});
</script>
