<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 6: Zkouška</title>
<meta name="description" content="Lekce 6, sekce 7 z 7: šest otázek za 100 bodů.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
</head>
<body>

<a class="preskocit" href="#obsah" data-t="nav.preskocit">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language" data-t="nav.jazykLabel" data-t-attr="aria-label">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
<p class="krokLabel" id="krokLabel"></p>
<nav class="kroky" id="kroky"></nav>
</header>

<main id="obsah">

<section class="plat" id="secZkouska">
  <p class="eyebrow" data-t="zkouska.eyebrow"></p>
  <h1 class="platNadpis"><em data-t="zkouska.over"></em><span data-t="zkouska.title"></span></h1>
  <p class="lede" data-t="zkouska.lede"></p>
  <div class="cileBox" id="cileBox" hidden></div>

  <div class="meter" id="zMeter"></div>
  <div id="zQuiz"></div>
  <div class="tools">
    <button type="button" id="zSubmit" data-t="zkouska.submit" disabled></button>
    <button type="button" id="zAgain" class="quiet" data-t="zkouska.again" hidden></button>
  </div>
  <p class="note" id="zNote"></p>
  <div class="result" id="zResult" hidden></div>

  <p class="listMark" data-t="zkouska.foot"></p>
</section>

<div class="zapamatujBox" id="zapamatujBox" hidden></div>

<nav class="sekceNav" id="sekceNav" data-t="nav.sekceNavLabel" data-t-attr="aria-label"></nav>
</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V } from '../../js/platy.js';
import { vytvorZkousku } from '../../js/zkouska.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-06.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 6: Zkouška' : 'ROUTING — Lesson 6: Exam',
});

/* ============================================================================
 * MINIATURY PRO OBRÁZKOVÉ OTÁZKY
 *
 * Q1 — tři greeny se stejným obrysem, ale jinou použitelnou plochou
 *      (tmavší výplň = spád pod 3 %). Šipky ukazují, kudy plocha padá.
 * Q4 — tři polohy praporku vůči témuž bunkru; hledá se ta nejvíc short-side.
 * ==========================================================================*/
function sipka(svg, x1, y1, x2, y2, barva) {
  const g = E(svg, 'g', { stroke: barva, 'stroke-width': 1.1, fill: 'none', opacity: 0.75 });
  E(g, 'line', { x1, y1, x2, y2 });
  const ang = Math.atan2(y2 - y1, x2 - x1);
  E(g, 'path', {
    d: `M${x2} ${y2} L${(x2 - Math.cos(ang - 0.45) * 4).toFixed(1)} ${(y2 - Math.sin(ang - 0.45) * 4).toFixed(1)}`
      + ` M${x2} ${y2} L${(x2 - Math.cos(ang + 0.45) * 4).toFixed(1)} ${(y2 - Math.sin(ang + 0.45) * 4).toFixed(1)}`,
  });
}

function kresliMiniGreen(svg, kind) {
  const ink = V('--ink', svg), turf = V('--turf', svg), turfD = V('--turf-d', svg);
  E(svg, 'rect', { x: 0, y: 0, width: 120, height: 220, fill: turfD, opacity: 0.35 });
  // stejný obrys u všech tří
  const cx = 60, cy = 110, rx = 40, ry = 78;
  E(svg, 'ellipse', { cx, cy, rx, ry, fill: turf, stroke: ink, 'stroke-width': 1.2 });
  const id = 'mg-' + kind;
  const clip = E(E(svg, 'defs', {}), 'clipPath', { id });
  E(clip, 'ellipse', { cx, cy, rx, ry });
  const g = E(svg, 'g', { 'clip-path': `url(#${id})` });
  if (kind === 'a') {
    // rovnoměrný mírný spád — použitelná je celá plocha
    E(g, 'rect', { x: 10, y: 20, width: 100, height: 180, fill: ink, opacity: 0.16 });
    sipka(svg, 60, 70, 60, 100, ink);
    sipka(svg, 60, 130, 60, 160, ink);
  } else if (kind === 'b') {
    // dvě patra — použitelné dva pruhy, mezi nimi sráz
    E(g, 'rect', { x: 10, y: 20, width: 100, height: 78, fill: ink, opacity: 0.16 });
    E(g, 'rect', { x: 10, y: 118, width: 100, height: 82, fill: ink, opacity: 0.16 });
    E(g, 'path', { d: 'M20 108 H100', stroke: ink, 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0.8, fill: 'none' });
    sipka(svg, 60, 100, 60, 118, ink);
  } else {
    // vypouklý — použitelná jen plošinka uprostřed
    E(g, 'ellipse', { cx, cy, rx: 15, ry: 28, fill: ink, opacity: 0.16 });
    sipka(svg, 60, 90, 60, 46, ink);
    sipka(svg, 60, 130, 60, 174, ink);
    sipka(svg, 46, 110, 22, 110, ink);
    sipka(svg, 74, 110, 98, 110, ink);
  }
}

function kresliMiniShortSide(svg, kind) {
  const ink = V('--ink', svg), turf = V('--turf', svg), turfD = V('--turf-d', svg), sand = V('--sand', svg), flag = V('--flag', svg);
  E(svg, 'rect', { x: 0, y: 0, width: 120, height: 220, fill: turfD, opacity: 0.35 });
  // u všech tří tentýž green a tentýž bunkr vpravo
  E(svg, 'ellipse', { cx: 56, cy: 105, rx: 38, ry: 62, fill: turf, stroke: ink, 'stroke-width': 1.2 });
  E(svg, 'ellipse', { cx: 104, cy: 105, rx: 15, ry: 20, fill: sand, stroke: ink, 'stroke-width': 1 });
  const px = { a: 86, b: 56, c: 28 }[kind];
  E(svg, 'circle', { cx: px, cy: 105, r: 2, fill: ink });
  E(svg, 'path', { d: `M${px} 105 L${px} 84 L${px + 13} 89 L${px} 94`, fill: flag, stroke: ink, 'stroke-width': 0.9 });
  // míč v bunkru — u všech stejný
  E(svg, 'circle', { cx: 104, cy: 112, r: 2.6, fill: 'none', stroke: ink, 'stroke-width': 1.2 });
  E(svg, 'text', { x: 104, y: 145, class: 'lab sm', 'text-anchor': 'middle', fill: ink },
    jazyk.lang === 'cs' ? 'MÍČ' : 'BALL');
}

const zkouskaOtazky = [
  {
    typ: 'obrazek', body: 20, tema: 'green-komplex', textKlic: 'zkouska.q1.text', hintKlic: 'zkouska.q1.hint',
    vysvetleniKlic: 'zkouska.q1.why', zpetKlic: 'zkouska.q1.back', spravna: 'c',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniGreen(svg, id) })),
  },
  {
    typ: 'jedna', body: 15, tema: 'green-komplex', textKlic: 'zkouska.q2.text',
    vysvetleniKlic: 'zkouska.q2.why', zpetKlic: 'zkouska.q2.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q2.' + id })),
  },
  {
    typ: 'jedna', body: 15, tema: 'trest', textKlic: 'zkouska.q3.text',
    vysvetleniKlic: 'zkouska.q3.why', zpetKlic: 'zkouska.q3.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q3.' + id })),
  },
  {
    typ: 'obrazek', body: 20, tema: 'umisteni-hazardu', textKlic: 'zkouska.q4.text', hintKlic: 'zkouska.q4.hint',
    vysvetleniKlic: 'zkouska.q4.why', zpetKlic: 'zkouska.q4.back', spravna: 'a',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniShortSide(svg, id) })),
  },
  {
    typ: 'vice', body: 15, tema: 'green-komplex', textKlic: 'zkouska.q5.text', hintKlic: 'zkouska.q5.hint',
    vysvetleniKlic: 'zkouska.q5.why', zpetKlic: 'zkouska.q5.back',
    moznosti: [
      { id: 'a', textKlic: 'zkouska.q5.a', ok: true },
      { id: 'b', textKlic: 'zkouska.q5.b', ok: false },
      { id: 'c', textKlic: 'zkouska.q5.c', ok: true },
      { id: 'd', textKlic: 'zkouska.q5.d', ok: true },
    ],
  },
  {
    typ: 'jedna', body: 15, tema: 'cteni-terenu', textKlic: 'zkouska.q6.text',
    vysvetleniKlic: 'zkouska.q6.why', zpetKlic: 'zkouska.q6.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q6.' + id })),
  },
];

vytvorZkousku({
  lekce: 6,
  otazky: zkouskaOtazky,
  slovnik,
  jazyk,
  el: { meter: $('zMeter'), quiz: $('zQuiz'), submit: $('zSubmit'), again: $('zAgain'), note: $('zNote'), result: $('zResult') },
});

jazyk.on(() => {
  vykresliNavSekci({ lekce: 6, index: 6, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 6, index: 6, jazyk, slovnikPojmu });
});
</script>
</body>
</html>
