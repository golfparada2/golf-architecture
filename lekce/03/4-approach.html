<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, blob, hatch, clipPath } from '../../js/platy.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec, ovladaniKlavesnici } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-03.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 3: Approach' : 'ROUTING — Lesson 3: Approach',
});

/* ============================================================================
 * SPOLEČNÝ POZEMEK — stejná shodná kopie jako v `1-tee-shot.html`.
 * ==========================================================================*/
const POZEMEK = blob(205, 265, 178, 228, 0.08, 303, 0.045, 60);
const KLUBOVNA = { x: 55, y: 470 };

function kresliPozemek(svg, defs) {
  const cid = 'r3-obrys';
  clipPath(defs, cid, POZEMEK);
  E(svg, 'path', { d: POZEMEK, fill: V('--turf-d', svg), opacity: 0.55 });
  hatch(svg, cid, { x: 10, y: 20, w: 390, h: 500 }, 0.7, 4.4, { op: 0.2, seed: 11 });
  E(svg, 'path', { d: POZEMEK, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1, opacity: 0.8 });
  return cid;
}

function kresliZaklad(svg, defs, L) {
  kresliPozemek(svg, defs);
  const potok = 'M355 90 C 320 160, 330 230, 270 300 C 220 355, 190 380, 150 440';
  E(svg, 'path', { d: potok, fill: 'none', stroke: V('--water', svg), 'stroke-width': 6, opacity: 0.7, 'stroke-linecap': 'round' });
  E(svg, 'path', { d: potok, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1, opacity: 0.5 });
  E(svg, 'path', {
    d: `M20 518 L${KLUBOVNA.x - 4} ${KLUBOVNA.y + 30} L${KLUBOVNA.x} ${KLUBOVNA.y + 14}`,
    fill: 'none', stroke: V('--ink2', svg), 'stroke-width': 3, opacity: 0.5, 'stroke-dasharray': '1 5', 'stroke-linecap': 'round',
  });
  E(svg, 'rect', { x: KLUBOVNA.x - 12, y: KLUBOVNA.y - 8, width: 24, height: 16, fill: V('--paper', svg), stroke: V('--ink', svg), 'stroke-width': 1.3 });
  E(svg, 'path', { d: `M${KLUBOVNA.x - 15} ${KLUBOVNA.y - 8} L${KLUBOVNA.x} ${KLUBOVNA.y - 20} L${KLUBOVNA.x + 15} ${KLUBOVNA.y - 8} Z`, fill: V('--ink', svg), opacity: 0.85 });
  E(svg, 'text', { x: KLUBOVNA.x, y: KLUBOVNA.y + 34, class: 'lab sm', 'text-anchor': 'middle' }, L.klubovna);
}

/* ============================================================================
 * APPROACH 1 — „Šest jamek". Student klepáním umisťuje šest greenů v
 * pořadí; klepnutí na existující bod ho smaže i se všemi pozdějšími. Jakmile
 * jsou umístěné všechny, spočítají se tři metriky: celková délka koridorů,
 * opakující se směr a křížení. Viz `poznamky.md`, krok 5, pro odůvodnění
 * konstanty `SCALE` a záměrné vynechání kontroly minimálního rozestupu.
 * ==========================================================================*/
const SCALE = 1.7;
const KOMPAS = ['V', 'JV', 'J', 'JZ', 'Z', 'SZ', 'S', 'SV'];
let a1body = [];

function kresliApproach1(svg) {
  clear(svg);
  const defs = E(svg, 'defs', {});
  const L = jazyk.t('approach1.L');
  kresliZaklad(svg, defs, L);

  const body = [[KLUBOVNA.x, KLUBOVNA.y], ...a1body.map((b) => [b.x, b.y])];
  if (body.length > 1) {
    let d = `M${body[0][0]} ${body[0][1]}`;
    for (let i = 1; i < body.length; i++) d += ` L${body[i][0]} ${body[i][1]}`;
    E(svg, 'path', { d, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.5, opacity: 0.75 });
  }
  a1body.forEach((b, i) => {
    E(svg, 'circle', { cx: b.x, cy: b.y, r: 10, fill: V('--flag', svg), opacity: 0.9, stroke: V('--paper', svg), 'stroke-width': 2 });
    E(svg, 'text', { x: b.x, y: b.y + 4, class: 'lab sm', 'text-anchor': 'middle', fill: V('--paper', svg) }, String(i + 1));
  });
}

function segIntersect(p1, p2, p3, p4) {
  function ccw(a, b, c) { return (c.y - a.y) * (b.x - a.x) > (b.y - a.y) * (c.x - a.x); }
  return ccw(p1, p3, p4) !== ccw(p2, p3, p4) && ccw(p1, p2, p3) !== ccw(p1, p2, p4);
}

function formatM(n, lang) {
  const cele = Math.round(n);
  const s = String(cele);
  const oddel = lang === 'cs' ? ' ' : ',';
  const skupiny = [];
  let zbytek = s;
  while (zbytek.length > 3) {
    skupiny.unshift(zbytek.slice(-3));
    zbytek = zbytek.slice(0, -3);
  }
  skupiny.unshift(zbytek);
  return skupiny.join(oddel) + ' m';
}

function a1Metriky() {
  const body = [KLUBOVNA, ...a1body];
  const segmenty = [];
  for (let i = 0; i < body.length - 1; i++) segmenty.push([body[i], body[i + 1]]);

  const delkaCelkem = segmenty.reduce((s, [a, b]) => s + Math.hypot(b.x - a.x, b.y - a.y), 0) * SCALE;

  const oktanty = segmenty.map(([a, b]) => {
    const deg = (Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + 360) % 360;
    return KOMPAS[Math.round(deg / 45) % 8];
  });
  let opakBeh = null;
  for (let i = 0; i < oktanty.length; i++) {
    let j = i;
    while (j + 1 < oktanty.length && oktanty[j + 1] === oktanty[i]) j++;
    if (j - i + 1 >= 3) { opakBeh = { od: i, do: j, smer: oktanty[i] }; break; }
  }

  let krizeni = null;
  outer:
  for (let i = 0; i < segmenty.length; i++) {
    for (let j = i + 2; j < segmenty.length; j++) {
      if (segIntersect(segmenty[i][0], segmenty[i][1], segmenty[j][0], segmenty[j][1])) {
        krizeni = { a: i + 1, b: j + 1 };
        break outer;
      }
    }
  }

  return { delkaCelkem, opakBeh, krizeni };
}

function a1Render() {
  kresliApproach1($('p2'));
  const n = a1body.length;
  if (n === 0) $('a1state').textContent = jazyk.t('approach1.stav.prazdno');
  else if (n === 6) $('a1state').textContent = jazyk.t('approach1.stav.hotovo');
  else $('a1state').textContent = jazyk.t('approach1.stav.pokrok').replace('{n}', n).replace('{dalsi}', n + 1);

  const wrap = $('a1metriky');
  if (n < 6) { wrap.hidden = true; wrap.innerHTML = ''; return; }
  wrap.hidden = false;
  wrap.innerHTML = '';
  const m = a1Metriky();
  const M = jazyk.t('approach1.metriky');
  const smery = jazyk.t('smery');

  const kDelka = document.createElement('div');
  kDelka.className = 'a1Metrik';
  kDelka.innerHTML = `<h4>${M.prechody}</h4><p>${formatM(m.delkaCelkem, jazyk.lang)}</p>`;
  wrap.appendChild(kDelka);

  const kSmer = document.createElement('div');
  if (m.opakBeh) {
    kSmer.className = 'a1Metrik spatne';
    const seznam = [];
    for (let i = m.opakBeh.od; i <= m.opakBeh.do; i++) seznam.push(i + 1);
    const text = jazyk.t('approach1.varovani.smerOpakovani')
      .replace('{seznam}', seznam.join(', '))
      .replace('{smer}', smery[m.opakBeh.smer]);
    kSmer.innerHTML = `<h4>${M.smery}</h4><p>${text}</p>`;
  } else {
    kSmer.className = 'a1Metrik dobre';
    kSmer.innerHTML = `<h4>${M.smery}</h4><p>${M.zadneOpakovani}</p>`;
  }
  wrap.appendChild(kSmer);

  const kKriz = document.createElement('div');
  if (m.krizeni) {
    kKriz.className = 'a1Metrik spatne';
    const text = jazyk.t('approach1.varovani.krizeni')
      .replace('{a}', m.krizeni.a).replace('{b}', m.krizeni.b);
    kKriz.innerHTML = `<h4>${M.krizeni}</h4><p>${text}</p>`;
  } else {
    kKriz.className = 'a1Metrik dobre';
    kKriz.innerHTML = `<h4>${M.krizeni}</h4><p>${M.zadneKrizeni}</p>`;
  }
  wrap.appendChild(kKriz);
}

function a1Vyber(x, y) {
  for (let i = 0; i < a1body.length; i++) {
    if (Math.hypot(x - a1body[i].x, y - a1body[i].y) <= 16) {
      a1body = a1body.slice(0, i);
      a1Render();
      return;
    }
  }
  if (a1body.length < 6) {
    a1body.push({ x, y });
    a1Render();
  }
}
$('p2').addEventListener('click', (ev) => {
  const r = $('p2').getBoundingClientRect();
  a1Vyber((ev.clientX - r.left) / r.width * 400, (ev.clientY - r.top) / r.height * 520);
});
const a1Klavesy = ovladaniKlavesnici($('p2'), {
  sirka: 400, vyska: 520, jazyk, krok: 18, stavEl: $('a1kurzor'),
  onVyber: (x, y) => { a1Vyber(x, y); a1Klavesy.kresliKurzor(); },
});
$('a1clear').addEventListener('click', () => { a1body = []; a1Render(); });

jazyk.on(() => {
  a1Render();
  vykresliNavSekci({ lekce: 3, index: 3, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 3, index: 3, jazyk, slovnikPojmu });
});
</script>
