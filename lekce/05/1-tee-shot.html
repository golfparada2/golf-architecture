<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, hatch, clipPath, blob, vlnky, pin } from '../../js/platy.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-05.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 5: Tee shot' : 'ROUTING — Lesson 5: Tee shot',
});

/* ============================================================================
 * GEOMETRIE A ČÍSLA SÁZKY
 *
 * Jamka je ilustrativní, ne převzatá z konkrétního hřiště — stejně jako plát
 * v lekci 4 (viz `poznamky.md`, Krok 13). Tři varianty mají tutéž fairway,
 * týž green a totéž odpaliště; liší se JEN velikostí a polohou rybníka
 * a tím, kam vede odvážná linie. To je celý smysl plátu: student má vidět,
 * že „dramatičtější“ hazard sám o sobě nedělá lepší jamku.
 *
 * Čísla sázky (cena / odměna / šance) jsou v JS, ne ve slovníku, protože
 * nejsou jazykové — slovník má jen popisky a verdikty. Jsou to rozumné
 * modelové hodnoty pro průměrného hráče, ne měření: mají ukázat aritmetiku,
 * ne předpovědět skóre. Skutečná simulace je až v sekci 4.
 *
 * Souřadnice v metrech, y roste od odpaliště ke greenu, x kladně vpravo
 * (stejná konvence jako `js/simulace.js` i karty jamek).
 * ==========================================================================*/
/* Vodorovné měřítko je záměrně větší než podélné (2,6 : 1,35). Jamka je
   300 m dlouhá a 100 m široká — při stejném měřítku obou os by z ní na
   plátu zbyl nečitelný proužek. Podélné zkrácení je stejná konvence jako
   u karet jamek (`js/platy.js`, `meritkoJamky`); tady se nepřiznává
   měřítkem po straně, protože jamka je ilustrativní a žádné skutečné
   vzdálenosti se z ní neodečítají. */
const SX = 3.2, SY = 1.35;
const toX = (x) => 150 + x * SX;
const toY = (y) => 500 - y * SY;

const OSA = [[0, 0], [120, 0], [200, 10], [300, 30]];   // [y, x]
const HALF_W = 20;
function osaX(y) {
  if (y <= OSA[0][0]) return OSA[0][1];
  for (let i = 0; i < OSA.length - 1; i++) {
    const [y0, x0] = OSA[i], [y1, x1] = OSA[i + 1];
    if (y <= y1) return x0 + (x1 - x0) * ((y - y0) / (y1 - y0));
  }
  return OSA[OSA.length - 1][1];
}

const GREEN = { x: 30, y: 300, rx: 11, ry: 9 };

const VARIANTY = {
  /* Ve všech třech variantách je stejná fairway, stejný green a STEJNÉ DVĚ
     LINIE — bezpečná i odvážná míří pokaždé na týž bod. Mění se jen rybník,
     a tím i dvě ze tří čísel sázky: šance na úspěch a cena prohry. Odměna
     zůstává stejná (odvážná linie zkracuje přihrávku zhruba o 60 metrů),
     aby bylo vidět, že o kvalitě jamky nerozhoduje velikost odměny, ale
     poměr všech tří čísel. */
  zadarmo: {
    rybnik: { x: 46, y: 150, rx: 9, ry: 13, seed: 5101 },
    bezpecne: { x: -8, y: 175 }, odvazne: { x: 30, y: 232 },
    sazka: { cena: 0.9, odmena: 0.45, sance: 0.90 },
  },
  poctiva: {
    rybnik: { x: 32, y: 170, rx: 18, ry: 36, seed: 5102 },
    bezpecne: { x: -8, y: 175 }, odvazne: { x: 30, y: 232 },
    sazka: { cena: 1.2, odmena: 0.45, sance: 0.72 },
  },
  trest: {
    rybnik: { x: 34, y: 175, rx: 28, ry: 48, seed: 5103 },
    bezpecne: { x: -8, y: 175 }, odvazne: { x: 30, y: 232 },
    sazka: { cena: 2.0, odmena: 0.45, sance: 0.55 },
  },
};

/** Čistý zisk odvážné cesty v ranách. Kladné = vyplácí se. */
function cistyZisk(s) { return s.sance * s.odmena - (1 - s.sance) * s.cena; }

/** Číslo česky s desetinnou čárkou, anglicky s tečkou. */
function cislo(n, des = 2) {
  const t = n.toFixed(des);
  return jazyk.lang === 'cs' ? t.replace('.', ',') : t;
}

function fairwayPathD() {
  const n = 40, left = [], right = [];
  for (let i = 0; i <= n; i++) {
    const y = (i / n) * 320;
    const cx = osaX(y);
    left.push([toX(cx - HALF_W), toY(y)]);
    right.push([toX(cx + HALF_W), toY(y)]);
  }
  let d = `M${left[0][0]} ${left[0][1]} `;
  left.slice(1).forEach(([x, y]) => { d += `L${x} ${y} `; });
  right.reverse().forEach(([x, y]) => { d += `L${x} ${y} `; });
  return d + 'Z';
}

function sipka(svg, x1, y1, x2, y2, color, dash) {
  const g = E(svg, 'g', { stroke: color, 'stroke-width': 2.2, fill: 'none', 'stroke-dasharray': dash || '' });
  E(g, 'line', { x1, y1, x2, y2 });
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const ax = x2 - Math.cos(ang - 0.4) * 11, ay = y2 - Math.sin(ang - 0.4) * 11;
  const bx = x2 - Math.cos(ang + 0.4) * 11, by = y2 - Math.sin(ang + 0.4) * 11;
  E(g, 'path', { d: `M${x2} ${y2} L${ax} ${ay} M${x2} ${y2} L${bx} ${by}` });
}

function kresliPlat(svg, klic) {
  const V_ = VARIANTY[klic];
  clear(svg);
  const defs = E(svg, 'defs', {});
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg),
    turfD = V('--turf-d', svg), water = V('--water', svg), flag = V('--flag', svg);

  E(svg, 'rect', { x: 0, y: 0, width: 400, height: 520, fill: turfD, opacity: 0.35 });

  // fairway
  const fid = 'l5-fw';
  const fd = fairwayPathD();
  clipPath(defs, fid, fd);
  E(svg, 'path', { d: fd, fill: turf, opacity: 0.9 });
  hatch(svg, fid, { x: 0, y: 0, w: 400, h: 520 }, 1.05, 4, { op: 0.15, seed: 12 });
  E(svg, 'path', { d: fd, fill: 'none', stroke: ink, 'stroke-width': 1, opacity: 0.7 });

  // rybník
  const r = V_.rybnik;
  const rd = blob(toX(r.x), toY(r.y), r.rx * SX, r.ry * SY, 0.05, r.seed, 0.08, 44);
  const rid = 'l5-water';
  clipPath(defs, rid, rd);
  E(svg, 'path', { d: rd, fill: water, opacity: 0.8 });
  vlnky(svg, rid, { x: toX(r.x) - r.rx * SX, y: toY(r.y) - r.ry * SY, w: r.rx * SX * 2, h: r.ry * SY * 2 }, r.seed + 5);
  E(svg, 'path', { d: rd, fill: 'none', stroke: ink, 'stroke-width': 0.9 });

  // green a odpaliště
  E(svg, 'ellipse', { cx: toX(GREEN.x), cy: toY(GREEN.y), rx: GREEN.rx * SX, ry: GREEN.ry * SY, fill: turf, stroke: ink, 'stroke-width': 1.3 });
  pin(svg, toX(GREEN.x), toY(GREEN.y), { h: 16, r: 2, flagW: 11, flagH: 4.5 });
  E(svg, 'rect', { x: toX(0) - 8, y: toY(0) - 3, width: 16, height: 6, fill: ink2, opacity: 0.6 });

  // dvě cesty
  const b = V_.bezpecne, o = V_.odvazne;
  sipka(svg, toX(0), toY(0), toX(b.x), toY(b.y), ink, '3 4');
  sipka(svg, toX(b.x), toY(b.y), toX(GREEN.x), toY(GREEN.y) + 8, ink, '3 4');
  sipka(svg, toX(0), toY(0), toX(o.x), toY(o.y), flag);
  sipka(svg, toX(o.x), toY(o.y), toX(GREEN.x), toY(GREEN.y) + 8, flag);

  const cs = jazyk.lang === 'cs';
  E(svg, 'text', { x: toX(b.x) - 6, y: toY(b.y) - 12, class: 'lab sm', 'text-anchor': 'end', fill: ink },
    cs ? 'BEZPEČNĚ' : 'SAFE');
  E(svg, 'text', { x: toX(o.x) + 8, y: toY(o.y) - 12, class: 'lab sm', 'text-anchor': 'start', fill: flag },
    cs ? 'ODVÁŽNĚ' : 'BOLD');
  E(svg, 'text', { x: toX(r.x), y: toY(r.y), class: 'lab sm', 'text-anchor': 'middle', fill: ink },
    cs ? 'RYBNÍK' : 'POND');
}

function renderSazka(klic) {
  const s = VARIANTY[klic].sazka;
  const z = cistyZisk(s);
  $('sCena').textContent = cislo(s.cena) + ' ' + jazyk.t('teeShot.sazkaJednotka');
  $('sOdmena').textContent = cislo(s.odmena) + ' ' + jazyk.t('teeShot.sazkaJednotka');
  $('sSance').textContent = Math.round(s.sance * 100) + ' %';
  $('sVysledek').textContent = (z >= 0 ? '+' : '−') + cislo(Math.abs(z)) + ' ' + jazyk.t('teeShot.sazkaJednotka');

  const verdikt = z > 0.12 ? 'dar' : (z < -0.12 ? 'trest' : 'poctiva');
  $('sazkaVerdikt').textContent = jazyk.t('teeShot.verdikt.' + verdikt).replace('{z}', cislo(Math.abs(z)));
}

function render() {
  const klic = document.querySelector('#sazkaToggle button[aria-pressed="true"]')?.dataset.sazka || 'zadarmo';
  kresliPlat($('p1'), klic);
  $('sazkaPopis').innerHTML = jazyk.t('teeShot.popis.' + klic);
  renderSazka(klic);
}

document.querySelectorAll('#sazkaToggle button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#sazkaToggle button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
});

jazyk.on(() => {
  render();
  vykresliNavSekci({ lekce: 5, index: 0, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 5, index: 0, jazyk, slovnikPojmu });
});
</script>
</body>
