<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, rng } from '../../js/platy.js';
import { HRACI, LEZENI, PODELNA_CHYBA, bocniChyba, gauss, putty } from '../../js/simulace.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-07.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 7: Approach' : 'ROUTING — Lesson 7: Approach',
});

/* ============================================================================
 * SIMULACE „PŘELETĚT, NEBO POLOŽIT“
 *
 * Par 5 s příčným bunkrem. Geometrie je převzatá z jediného doloženého čísla
 * na kartě St Andrews Old 14: Hell Bunker leží 108 yardů (99 m) před greenem.
 * Jamka sama je ilustrativní — není to plán čtrnáctky, jen její rozměr.
 *
 * Dvě strategie:
 *   SMĚLE   — hráč vždycky hraje tak daleko, jak umí.
 *   OPATRNĚ — hráč nikdy nezahraje ránu, která by podle plánu skončila
 *             v bunkru; místo ní zvolí kratší a zastaví se 12 m před ním.
 *
 * Náhoda je nasazená semínkem (`rng`), takže čísla jsou při každé návštěvě
 * stejná a dá se o nich psát v textu (past z `poznamky.md`, Krok 14).
 * ==========================================================================*/
const DELKA = 520;                                  // m
const PIN = { x: 0, y: DELKA };
const GREEN_R = 13;
const FW_POLOSIRKA = 25;
const HAZ = { y0: 420, y1: 448, polosirka: 30 };    // příčný bunkr, 99 m před greenem
const REZERVA = 12;                                 // o kolik metrů před hazard se pokládá
const KOL = 1500;

const SX = 3.3, SY = 0.92;
const toX = (x) => 200 + x * SX;
const toY = (y) => 535 - y * SY;

const HRACI_RADA = [HRACI[0], HRACI[9], HRACI[18], HRACI[24]];

function lezeni(x, y) {
  if (y >= HAZ.y0 && y <= HAZ.y1 && Math.abs(x) <= HAZ.polosirka) return 'bunkr';
  return Math.abs(x) <= FW_POLOSIRKA ? 'fairway' : 'rough';
}

/** Odehraje jedno kolo. Vrací počet ran, zda se míč potkal s bunkrem,
 *  číslo rány, která do bunkru dopadla, a místa dopadu 2. a 3. rány. */
function kolo(hrac, opatrne, rnd) {
  let x = 0, y = 0, ran = 0, lie = 'fairway';
  let bunkrRana = 0;
  const dopady = {};

  for (let i = 0; i < 12; i++) {
    ran++;
    const dx = PIN.x - x, dy = PIN.y - y;
    const zbyva = Math.hypot(dx, dy) || 1;
    const ux = dx / zbyva, uy = dy / zbyva;

    if (ran === 1) {
      y += Math.min(hrac.drive, zbyva) + gauss(rnd) * hrac.sigLong;
      x += gauss(rnd) * hrac.sigLat;
    } else {
      const l = LEZENI[lie];
      let d = Math.min(zbyva, hrac.maxIron * l.dosah);
      if (opatrne && lie !== 'bunkr') {
        const cilY = y + uy * d;
        const mez = HAZ.y0 - REZERVA;
        if (y < mez && cilY > mez && cilY < HAZ.y1 + 8) {
          const kratsi = uy > 1e-6 ? (mez - y) / uy : d;
          if (kratsi > 5) d = kratsi;
        }
      }
      const chybaP = gauss(rnd) * PODELNA_CHYBA * d * l.rozptyl;
      const chybaB = gauss(rnd) * bocniChyba(hrac.hcp) * d * l.rozptyl;
      x += ux * (d + chybaP) - uy * chybaB;
      y += uy * (d + chybaP) + ux * chybaB;
    }

    if (ran === 2 || ran === 3) dopady[ran] = { x, y };

    const dGreen = Math.hypot(x - PIN.x, y - PIN.y);
    if (dGreen <= GREEN_R) { ran += putty(dGreen); break; }
    lie = lezeni(x, y);
    if (lie === 'bunkr' && !bunkrRana) bunkrRana = ran;
  }
  return { rany: Math.min(ran, 10), bunkrRana, dopady };
}

function davka(hrac, opatrne, seed) {
  const rnd = rng(seed);
  let suma = 0, vBunkru = 0;
  const poRane = [0, 0, 0, 0, 0, 0];
  const body2 = [], body3 = [];
  for (let i = 0; i < KOL; i++) {
    const v = kolo(hrac, opatrne, rnd);
    suma += v.rany;
    if (v.bunkrRana) { vBunkru++; poRane[Math.min(v.bunkrRana, 5)]++; }
    if (i < 260) {
      if (v.dopady[2]) body2.push(v.dopady[2]);
      if (v.dopady[3]) body3.push(v.dopady[3]);
    }
  }
  return { prumer: suma / KOL, podilBunkr: vBunkru / KOL, poRane, body2, body3 };
}

/* Spočítá se jednou při načtení — čísla jsou pak stejná po celou návštěvu. */
const VYSLEDKY = HRACI_RADA.map((h, i) => ({
  hrac: h,
  smele: davka(h, false, 7700 + i * 10),
  opatrne: davka(h, true, 7700 + i * 10),
}));

function cislo(n, des = 2) {
  const t = n.toFixed(des);
  return jazyk.lang === 'cs' ? t.replace('.', ',') : t;
}

/** Které ráně hazard u tohohle hráče patří — podle toho, kolikátá rána do něj
 *  nejčastěji dopadá. Pod dvě procenta kol se to nepočítá vůbec. */
function kteraRana(v) {
  if (v.smele.podilBunkr < 0.02) return 3;
  const p = v.smele.poRane;
  let nej = 2;
  for (let r = 2; r <= 5; r++) if (p[r] > p[nej]) nej = r;
  return Math.min(nej - 2, 2);
}

/* --- kresba ------------------------------------------------------------- */
function kresli(svg, idx) {
  clear(svg);
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg),
    turfD = V('--turf-d', svg), sand = V('--sand', svg), flag = V('--flag', svg);
  svg.setAttribute('aria-label', jazyk.t('approach1.planLabel'));

  E(svg, 'rect', { x: 0, y: 0, width: 400, height: 560, fill: turfD, opacity: 0.35 });
  E(svg, 'rect', {
    x: toX(-FW_POLOSIRKA), y: toY(DELKA - 4), width: FW_POLOSIRKA * 2 * SX, height: (DELKA - 26) * SY,
    fill: turf, stroke: ink, 'stroke-width': 1.1, rx: 10,
  });

  // příčný bunkr
  const bx = toX(-HAZ.polosirka), bw = HAZ.polosirka * 2 * SX;
  const by = toY(HAZ.y1), bh = (HAZ.y1 - HAZ.y0) * SY;
  E(svg, 'rect', { x: bx, y: by, width: bw, height: bh, rx: 6, fill: sand, stroke: ink, 'stroke-width': 1.3 });
  const zrno = E(svg, 'g', { fill: ink, opacity: 0.3 });
  const s = rng(7799);
  for (let k = 0; k < 60; k++) {
    E(zrno, 'circle', { cx: (bx + 3 + s() * (bw - 6)).toFixed(1), cy: (by + 3 + s() * (bh - 6)).toFixed(1), r: 0.9 });
  }
  /* Popisek u bunkru se nekreslí schválně: tečky dopadů se kolem něj tlačí
     a jakýkoli text by se s nimi překryl. Vzdálenost říká měřítko po levé
     straně i text pod plánem (past z `poznamky.md`, Krok 9 — popisky se
     zkracují nebo ruší, prvky se neposouvají). */

  // dopady druhé a třetí rány sledovaného hráče (strategie „směle“)
  const v = VYSLEDKY[idx].smele;
  const g3 = E(svg, 'g', { fill: ink, opacity: 0.22 });
  v.body3.forEach((b) => E(g3, 'circle', { cx: toX(b.x).toFixed(1), cy: toY(b.y).toFixed(1), r: 1.7 }));
  const g2 = E(svg, 'g', { fill: ink, opacity: 0.55 });
  v.body2.forEach((b) => E(g2, 'circle', { cx: toX(b.x).toFixed(1), cy: toY(b.y).toFixed(1), r: 1.9 }));

  // green
  E(svg, 'ellipse', { cx: toX(0), cy: toY(DELKA), rx: GREEN_R * SX, ry: GREEN_R * SY * 2.1, fill: turf, stroke: ink, 'stroke-width': 1.3 });
  E(svg, 'circle', { cx: toX(0), cy: toY(DELKA), r: 2, fill: ink });
  E(svg, 'path', { d: `M${toX(0)} ${toY(DELKA)} L${toX(0)} ${toY(DELKA) - 20} L${toX(0) + 13} ${toY(DELKA) - 15.5} L${toX(0)} ${toY(DELKA) - 11}`, fill: flag, stroke: ink, 'stroke-width': 1 });

  E(svg, 'rect', { x: toX(0) - 9, y: toY(0) - 6, width: 18, height: 11, rx: 2, fill: turf, stroke: ink, 'stroke-width': 1.1 });

  const zlab = E(svg, 'g', { fill: ink2 });
  [150, 300, 450].forEach((m) => {
    E(zlab, 'path', { d: `M14 ${toY(m)} h9`, stroke: ink2, 'stroke-width': 0.9, fill: 'none', opacity: 0.7 });
    E(zlab, 'text', { x: 26, y: toY(m) + 3, class: 'lab sm' }).textContent = `${m} m`;
  });
}

/* --- tabulka ------------------------------------------------------------- */
function vypln() {
  const telo = $('tabTelo');
  telo.innerHTML = '';
  const nazvy = jazyk.t('approach1.ranaNazvy');
  VYSLEDKY.forEach((v) => {
    const rozdil = v.opatrne.prumer - v.smele.prumer;
    const znak = rozdil > 0 ? '+' : (rozdil < 0 ? '−' : '');
    const tr = document.createElement('tr');
    tr.innerHTML = `<th>${v.hrac.jmeno}</th>`
      + `<td>${cislo(v.smele.prumer)}</td>`
      + `<td>${cislo(v.opatrne.prumer)}</td>`
      + `<td>${znak}${cislo(Math.abs(rozdil))}</td>`
      + `<td>${nazvy[kteraRana(v)]} · ${cislo(v.smele.podilBunkr * 100, 0)} %</td>`;
    telo.appendChild(tr);
  });
}

let idx = 0;
function prekresli() {
  kresli($('p4'), idx);
  $('hracToggle').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === idx)));
}

function stavToggle() {
  const t = $('hracToggle');
  t.innerHTML = '';
  t.setAttribute('aria-label', jazyk.t('approach1.hracLabel'));
  HRACI_RADA.forEach((h, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = h.jmeno;
    b.addEventListener('click', () => { idx = i; prekresli(); });
    t.appendChild(b);
  });
}

jazyk.on(() => {
  $('hracLabel').textContent = jazyk.t('approach1.hracLabel');
  stavToggle();
  vypln();
  prekresli();
  $('zaver').innerHTML = jazyk.t('approach1.zaver');
  vykresliNavSekci({ lekce: 7, index: 3, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 7, index: 3, jazyk, slovnikPojmu });
});
</script>
