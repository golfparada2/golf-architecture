<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, rng } from '../../js/platy.js';
import { HRACI, normCdf } from '../../js/simulace.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-07.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 7: Tee shot' : 'ROUTING — Lesson 7: Tee shot',
});

/* ============================================================================
 * PLÁT „STEJNÝ PÍSEK, JINÁ OTÁZKA“
 *
 * Jamka je ilustrativní, ne převzatá z konkrétního hřiště (stejně jako pláty
 * v lekcích 4–6). Tři varianty mají STEJNOU jamku, STEJNOU plochu písku a
 * u dvou z nich i STEJNÉ vzdálenosti od odpaliště — mění se jen poloha
 * napříč fairwayí. To je celý smysl plátu.
 *
 * POZOR — kresba a výpočet musí vycházet z týchž čísel. Pásy písku se proto
 * kreslí jako obdélníky přesně podle mezí v `VARIANTY`, ne jako volné tvary:
 * kdyby se kreslil elipsovitý blob, tabulka by počítala něco jiného, než
 * student vidí (past zapsaná v `poznamky.md`, Krok 15).
 *
 * Čísla se NESIMULUJÍ, počítají se analyticky z rozptylu odpalu v
 * `js/simulace.js`. Rozptyl je dvourozměrný normální: podélná odchylka
 * `sigLong`, boční `sigLat`. Pro obdélníkový pás pak platí
 *     P(písek) = P(y v pásmu) × P(|x| v pásmu)
 * a průměrná odchylka chycené rány od osy je střední hodnota useknutého
 * normálního rozdělení. Simulace by dala totéž, jen s šumem.
 *
 * Souřadnice v metrech, y roste od odpaliště ke greenu, x kladně vpravo.
 * ==========================================================================*/
const DELKA = 380;          // m
const POLOSIRKA = 22;       // m, fairway
const SX = 3.4, SY = 1.22;
const toX = (x) => 200 + x * SX;
const toY = (y) => 495 - y * SY;

const VARIANTY = {
  okraje:  { x0: 14, x1: 24, y0: 180, y1: 260 },
  stred:   { x0: 3,  x1: 13, y0: 180, y1: 260 },
  daleko:  { x0: 3,  x1: 13, y0: 300, y1: 380 },
};
const HRACI_RADA = [HRACI[0], HRACI[9], HRACI[18], HRACI[24]];

/** Hustota normálního rozdělení (střed 0, odchylka 1). */
function fiHustota(z) { return 0.3989422804014327 * Math.exp(-z * z / 2); }

/**
 * Pro daného hráče a pás písku vrátí podíl odpalů, které v něm skončí,
 * a průměrnou vzdálenost chycené rány od osy jamky.
 */
function spocitej(hrac, v) {
  const Py = normCdf((v.y1 - hrac.drive) / hrac.sigLong) - normCdf((v.y0 - hrac.drive) / hrac.sigLong);
  const a = v.x0 / hrac.sigLat, b = v.x1 / hrac.sigLat;
  const jednaStrana = normCdf(b) - normCdf(a);
  const Px = 2 * jednaStrana;
  const odchylka = jednaStrana > 1e-9
    ? hrac.sigLat * (fiHustota(a) - fiHustota(b)) / jednaStrana
    : 0;
  return { podil: Math.max(0, Py) * Px, odchylka };
}

function cislo(n, des = 1) {
  const t = n.toFixed(des);
  return jazyk.lang === 'cs' ? t.replace('.', ',') : t;
}

/* --- kresba ------------------------------------------------------------- */
function pasPisku(svg, v, znam, ink, sand) {
  const seed = rng(7010 + znam);
  [[-v.x1, -v.x0], [v.x0, v.x1]].forEach(([xa, xb], i) => {
    const x = toX(xa), w = (xb - xa) * SX;
    const y = toY(v.y1), h = (v.y1 - v.y0) * SY;
    E(svg, 'rect', { x, y, width: w, height: h, rx: 7, fill: sand, stroke: ink, 'stroke-width': 1.2 });
    // zrnitost — tečky uvnitř pásu, ať písek nevypadá jako plná barva
    const g = E(svg, 'g', { fill: ink, opacity: 0.28 });
    for (let k = 0; k < 26; k++) {
      E(g, 'circle', { cx: (x + 2 + seed() * (w - 4)).toFixed(1), cy: (y + 3 + seed() * (h - 6)).toFixed(1), r: 0.9 });
    }
  });
}

function kresli(svg, klic) {
  clear(svg);
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg),
    turfD = V('--turf-d', svg), sand = V('--sand', svg), flag = V('--flag', svg);
  svg.setAttribute('aria-label', jazyk.t('teeShot.planLabel'));

  E(svg, 'rect', { x: 0, y: 0, width: 400, height: 520, fill: turfD, opacity: 0.35 });

  // fairway jako rovný koridor
  E(svg, 'rect', {
    x: toX(-POLOSIRKA), y: toY(DELKA - 10), width: POLOSIRKA * 2 * SX, height: (DELKA - 30) * SY,
    fill: turf, stroke: ink, 'stroke-width': 1.1, rx: 10,
  });

  // osa jamky — to, kolem čeho se celý plát točí
  E(svg, 'path', {
    d: `M${toX(0)} ${toY(8)} L${toX(0)} ${toY(DELKA - 22)}`,
    stroke: ink2, 'stroke-width': 1, 'stroke-dasharray': '4 5', opacity: 0.65, fill: 'none',
  });

  pasPisku(svg, VARIANTY[klic], Object.keys(VARIANTY).indexOf(klic), ink, sand);

  // green a praporek
  E(svg, 'ellipse', { cx: toX(0), cy: toY(DELKA), rx: 11 * SX, ry: 9 * SY * 2.2, fill: turf, stroke: ink, 'stroke-width': 1.3 });
  E(svg, 'circle', { cx: toX(0), cy: toY(DELKA), r: 2, fill: ink });
  E(svg, 'path', { d: `M${toX(0)} ${toY(DELKA)} L${toX(0)} ${toY(DELKA) - 22} L${toX(0) + 14} ${toY(DELKA) - 17} L${toX(0)} ${toY(DELKA) - 12}`, fill: flag, stroke: ink, 'stroke-width': 1 });

  // odpaliště
  E(svg, 'rect', { x: toX(0) - 9, y: toY(0) - 6, width: 18, height: 11, rx: 2, fill: turf, stroke: ink, 'stroke-width': 1.1 });

  // měřítko vzdáleností po levé straně
  const zlab = E(svg, 'g', { fill: ink2, 'font-size': 9 });
  [100, 200, 300].forEach((m) => {
    E(zlab, 'path', { d: `M14 ${toY(m)} h9`, stroke: ink2, 'stroke-width': 0.9, fill: 'none', opacity: 0.7 });
    E(zlab, 'text', { x: 26, y: toY(m) + 3, class: 'lab sm' }).textContent = `${m} m`;
  });
}

/* --- tabulka a verdikt --------------------------------------------------- */
function vypln(klic) {
  const v = VARIANTY[klic];
  const telo = $('tabTelo');
  telo.innerHTML = '';
  let maxPodil = 0, vazenaOdch = 0, vaha = 0;

  HRACI_RADA.forEach((h) => {
    const r = spocitej(h, v);
    maxPodil = Math.max(maxPodil, r.podil);
    vazenaOdch += r.odchylka * r.podil;
    vaha += r.podil;

    const tr = document.createElement('tr');
    const proc = r.podil * 100;
    tr.innerHTML = `<th>${h.jmeno}</th>`
      + `<td>${cislo(proc, proc < 1 ? 2 : 1)} %</td>`
      + `<td>${r.podil < 0.005 ? '—' : cislo(r.odchylka, 1) + ' m'}</td>`;
    telo.appendChild(tr);
  });

  const odch = vaha > 1e-9 ? vazenaOdch / vaha : 0;
  const el = $('verdikt');
  if (maxPodil < 0.03) {
    el.innerHTML = jazyk.t('teeShot.verdikt.dekorace').replace('{max}', cislo(maxPodil * 100, 2));
  } else if (odch < 10) {
    el.innerHTML = jazyk.t('teeShot.verdikt.rovne').replace('{odch}', cislo(odch, 1));
  } else {
    el.innerHTML = jazyk.t('teeShot.verdikt.krive').replace('{odch}', cislo(odch, 1));
  }
  $('polohaPopis').textContent = jazyk.t('teeShot.popis.' + klic);
}

let aktualni = 'okraje';
function prekresli() {
  kresli($('p1'), aktualni);
  vypln(aktualni);
  $('polohaToggle').querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.poloha === aktualni));
  });
}

$('polohaToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-poloha]');
  if (!b) return;
  aktualni = b.dataset.poloha;
  prekresli();
});

jazyk.on(() => {
  $('polohaToggle').setAttribute('aria-label', jazyk.t('teeShot.tabHead'));
  prekresli();
  vykresliNavSekci({ lekce: 7, index: 0, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 7, index: 0, jazyk, slovnikPojmu });
});
</script>
