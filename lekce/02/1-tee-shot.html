<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">

</head>
<body>

</div>
<a class="zpet" href="index.html" data-t="nav.prehled"></a>
<p class="krokLabel" id="krokLabel"></p>

<section class="plat" id="secTeeShot">
  <p class="eyebrow" data-t="teeShot.eyebrow"></p>
  <h2 class="platNadpis"><em data-t="teeShot.over"></em><span data-t="teeShot.title"></span></h2>
  <p class="lede" data-t="teeShot.lede"></p>
  <div class="principBox"><b data-t="principLabel"></b><br><span data-t="teeShot.principle"></span></div>

  <svg id="p1" viewBox="0 0 400 520" role="img" aria-label="Pozemek v pěti vrstvách"></svg>

  <div class="toggle" id="teeShotToggle" role="group" aria-label="Vrstvy pozemku">
    <button type="button" data-vrstva="vrstevnice" data-t="teeShot.toggle.vrstevnice" aria-pressed="true"></button>
    <button type="button" data-vrstva="odtok" data-t="teeShot.toggle.odtok"></button>
    <button type="button" data-vrstva="slunce" data-t="teeShot.toggle.slunce"></button>
    <button type="button" data-vrstva="vitr" data-t="teeShot.toggle.vitr"></button>
    <button type="button" data-vrstva="podlozi" data-t="teeShot.toggle.podlozi"></button>
  </div>
  <p class="popisFilozofie" id="teeShotPopis"></p>

  <p class="listMark" data-t="teeShot.foot"></p>
</section>

<div class="sekceNav" id="sekceNav"></div>
<div class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></div>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, blob, hatch, clipPath } from '../../js/platy.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-02.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 2: Tee shot' : 'ROUTING — Lesson 2: Tee shot',
});

/* ============================================================================
 * SPOLEČNÝ POZEMEK — stejný obrys jako v approach 1 (viz `4-approach.html`),
 * ať jsou vrstvy a „Nesmí" geograficky konzistentní (potok/nejnižší bod
 * vpravo dole, strmý svah vlevo nahoře, stín vpravo nahoře).
 * ==========================================================================*/
const POZEMEK = blob(200, 270, 172, 220, 0.05, 707, 0.05, 60);

function kresliPozemek(svg, defs) {
  const cid = 'pz-obrys';
  clipPath(defs, cid, POZEMEK);
  E(svg, 'path', { d: POZEMEK, fill: V('--turf-d', svg), opacity: 0.55 });
  hatch(svg, cid, { x: 10, y: 20, w: 380, h: 500 }, 1.1, 4.2, { op: 0.22, seed: 9 });
  E(svg, 'path', { d: POZEMEK, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1, opacity: 0.8 });
  return cid;
}

let vrstva = 'vrstevnice';

function kresliVrstevnice(svg, defs) {
  kresliPozemek(svg, defs);
  const stred = [[130, 400, 150, 40], [110, 330, 150, 40], [95, 260, 150, 40], [85, 190, 150, 40]];
  stred.forEach(([x, y, w]) => {
    E(svg, 'path', {
      d: `M${x} ${y} Q${x + w * 0.5} ${y - 18} ${x + w} ${y + 6} T${x + w * 2} ${y}`,
      fill: 'none', stroke: V('--ink2', svg), 'stroke-width': 0.9, opacity: 0.6,
    });
  });
  const strme = [[60, 120], [72, 100], [84, 82], [96, 66], [107, 52]];
  for (let i = 0; i < strme.length; i++) {
    E(svg, 'path', {
      d: `M40 ${strme[i][1] + 6} Q${strme[i][0]} ${strme[i][1] - 4} ${strme[i][0] + 90} ${strme[i][1] + 2}`,
      fill: 'none', stroke: V('--ink2', svg), 'stroke-width': 0.9, opacity: 0.7,
    });
  }
  const L = jazyk.t('teeShot.L');
  E(svg, 'text', { x: 210, y: 300, class: 'lab sm', 'text-anchor': 'middle' }, L.prevyseni[0]);
  E(svg, 'text', { x: 210, y: 316, class: 'lab sm', 'text-anchor': 'middle' }, L.prevyseni[1]);
  E(svg, 'text', { x: 100, y: 90, class: 'lab sm', 'text-anchor': 'middle' }, L.strmy[0]);
  E(svg, 'text', { x: 100, y: 106, class: 'lab sm', 'text-anchor': 'middle' }, L.strmy[1]);
}

function kresliOdtok(svg, defs) {
  kresliPozemek(svg, defs);
  const potok = 'M310 130 C 300 220, 320 300, 290 420 C 280 455, 265 460, 250 462';
  E(svg, 'path', { d: potok, fill: 'none', stroke: V('--water', svg), 'stroke-width': 6, opacity: 0.8, 'stroke-linecap': 'round' });
  E(svg, 'path', { d: potok, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1, opacity: 0.55 });
  const sipky = [
    [120, 160, 250, 400], [90, 240, 240, 400], [150, 340, 260, 415],
    [220, 150, 280, 360], [260, 200, 285, 380], [180, 420, 250, 445],
  ];
  const g = E(svg, 'g', { stroke: V('--ink', svg), 'stroke-width': 1, opacity: 0.7, fill: V('--ink', svg) });
  sipky.forEach(([x1, y1, x2, y2]) => {
    E(g, 'line', { x1, y1, x2, y2 });
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const ax = x2 - Math.cos(ang - 0.4) * 9, ay = y2 - Math.sin(ang - 0.4) * 9;
    const bx = x2 - Math.cos(ang + 0.4) * 9, by = y2 - Math.sin(ang + 0.4) * 9;
    E(g, 'path', { d: `M${x2} ${y2} L${ax} ${ay} M${x2} ${y2} L${bx} ${by}` });
  });
  const L = jazyk.t('teeShot.L');
  E(svg, 'text', { x: 335, y: 260, class: 'lab sm', 'text-anchor': 'middle' }, L.potok);
  E(svg, 'text', { x: 255, y: 440, class: 'lab', 'text-anchor': 'middle' }, L.nejnizsi[0]);
  E(svg, 'text', { x: 255, y: 456, class: 'lab', 'text-anchor': 'middle' }, L.nejnizsi[1]);
}

function kresliSlunce(svg, defs) {
  kresliPozemek(svg, defs);
  const stinTvar = blob(300, 160, 70, 60, 0.2, 808, 0.1, 40);
  const cid = 'stin';
  clipPath(defs, cid, stinTvar);
  E(svg, 'path', { d: stinTvar, fill: V('--ink2', svg), opacity: 0.28 });
  hatch(svg, cid, { x: 220, y: 90, w: 160, h: 140 }, 0.8, 4, { op: 0.35, seed: 21 });
  E(svg, 'path', { d: stinTvar, fill: 'none', stroke: V('--ink2', svg), 'stroke-width': 0.8, opacity: 0.6 });
  const sx = 90, sy = 440;
  E(svg, 'circle', { cx: sx, cy: sy, r: 14, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.3 });
  const rg = E(svg, 'g', { stroke: V('--ink', svg), 'stroke-width': 0.8, opacity: 0.55 });
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 - 0.3 + (i / 9) * (Math.PI / 2 + 0.5);
    E(rg, 'line', { x1: sx + Math.cos(a) * 20, y1: sy + Math.sin(a) * 20, x2: sx + Math.cos(a) * 230, y2: sy + Math.sin(a) * 230, 'stroke-dasharray': '2 5' });
  }
  const L = jazyk.t('teeShot.L');
  E(svg, 'text', { x: 300, y: 150, class: 'lab sm', 'text-anchor': 'middle' }, L.stin[0]);
  E(svg, 'text', { x: 300, y: 166, class: 'lab sm', 'text-anchor': 'middle' }, L.stin[1]);
  E(svg, 'text', { x: 130, y: 400, class: 'lab', 'text-anchor': 'middle' }, L.ranniSlunce[0]);
  E(svg, 'text', { x: 130, y: 416, class: 'lab', 'text-anchor': 'middle' }, L.ranniSlunce[1]);
}

function kresliVitr(svg, defs) {
  kresliPozemek(svg, defs);
  const cx = 200, cy = 270;
  const g = E(svg, 'g', { stroke: V('--ink2', svg), 'stroke-width': 0.8, opacity: 0.5, fill: 'none' });
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    E(g, 'line', { x1: cx, y1: cy, x2: cx + Math.cos(a) * 150, y2: cy + Math.sin(a) * 150 });
  }
  const fromX = cx - Math.cos(Math.PI / 5) * 160, fromY = cy + Math.sin(Math.PI / 5) * 160;
  const toX = cx + Math.cos(Math.PI / 5) * 130, toY = cy - Math.sin(Math.PI / 5) * 130;
  E(svg, 'line', { x1: fromX, y1: fromY, x2: toX, y2: toY, stroke: V('--ink', svg), 'stroke-width': 2.2 });
  const ang = Math.atan2(toY - fromY, toX - fromX);
  const ax = toX - Math.cos(ang - 0.4) * 16, ay = toY - Math.sin(ang - 0.4) * 16;
  const bx = toX - Math.cos(ang + 0.4) * 16, by = toY - Math.sin(ang + 0.4) * 16;
  E(svg, 'path', { d: `M${toX} ${toY} L${ax} ${ay} M${toX} ${toY} L${bx} ${by}`, stroke: V('--ink', svg), 'stroke-width': 2.2, fill: 'none' });
  const L = jazyk.t('teeShot.L');
  E(svg, 'text', { x: fromX - 6, y: fromY + 26, class: 'lab', 'text-anchor': 'middle' }, L.vitr[0]);
  E(svg, 'text', { x: fromX - 6, y: fromY + 42, class: 'lab', 'text-anchor': 'middle' }, L.vitr[1]);
}

function kresliPodlozi(svg) {
  const L = jazyk.t('teeShot.L');
  const cols = [
    { x: 55, vrstvy: [['pisek', 260]] },
    { x: 178, vrstvy: [['pisek', 60], ['jil', 200]] },
    { x: 301, vrstvy: [['pisek', 30], ['skala', 230]] },
  ];
  const barvy = { pisek: V('--sand', svg), jil: '#B7A98C', skala: V('--ink2', svg) };
  const top = 90, w = 90, bottom = 470;
  const ax = E(svg, 'g', { stroke: V('--ink2', svg), 'stroke-width': 0.8, opacity: 0.6, fill: 'none' });
  for (let m = 0; m <= 4; m++) {
    const y = top + (m / 4) * (bottom - top);
    E(ax, 'line', { x1: 10, y1: y, x2: 22, y2: y });
    E(svg, 'text', { x: 26, y: y + 4, class: 'lab sm' }, (m * 0.4).toFixed(1) + ' m');
  }
  cols.forEach((col) => {
    let y = top;
    col.vrstvy.forEach(([typ, h]) => {
      const rectH = (h / 260) * (bottom - top);
      E(svg, 'rect', { x: col.x, y, width: w, height: rectH, fill: barvy[typ], stroke: V('--ink', svg), 'stroke-width': 1 });
      const label = L[typ];
      E(svg, 'text', { x: col.x + w / 2, y: y + rectH / 2 + 4, class: 'lab sm', 'text-anchor': 'middle', fill: typ === 'skala' ? V('--paper', svg) : V('--ink', svg) }, label);
      y += rectH;
    });
    E(svg, 'text', { x: col.x + w / 2, y: bottom + 22, class: 'lab sm', 'text-anchor': 'middle' }, L.povrch);
    E(svg, 'line', { x1: col.x, y1: top, x2: col.x + w, y2: top, stroke: V('--ink', svg), 'stroke-width': 1.6 });
  });
}

function kresliTeeShot(svg, v) {
  clear(svg);
  const defs = E(svg, 'defs', {});
  if (v === 'vrstevnice') kresliVrstevnice(svg, defs);
  else if (v === 'odtok') kresliOdtok(svg, defs);
  else if (v === 'slunce') kresliSlunce(svg, defs);
  else if (v === 'vitr') kresliVitr(svg, defs);
  else if (v === 'podlozi') kresliPodlozi(svg);
}

function renderTeeShot() {
  kresliTeeShot($('p1'), vrstva);
  $('teeShotPopis').innerHTML = jazyk.t('teeShot.popis.' + vrstva);
  document.querySelectorAll('#teeShotToggle button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.vrstva === vrstva));
  });
}
document.querySelectorAll('#teeShotToggle button').forEach((b) => {
  b.addEventListener('click', () => { vrstva = b.dataset.vrstva; renderTeeShot(); });
});

jazyk.on(() => {
  renderTeeShot();
  vykresliNavSekci({ lekce: 2, index: 0, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
});
</script>
