<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 2: Approach</title>
<meta name="description" content="Lekce 2, sekce 4 z 7: dva úkoly — kam green nesmí, a terénní úkol s vlastní fotkou.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
<style>
  /* styly specifické pro tuto sekci — sdílené věci jsou v assets/styl.css, sekce 14 a 15 */
  .zonyStav{margin-top:12px}
  .zonaNalezena{margin-top:12px;padding-left:13px;border-left:2px solid var(--good);font-size:15px;line-height:1.4}
  .zonaNalezena b{color:var(--olive);font-weight:500;display:block;margin-bottom:2px}

  .fotoWrap{margin-top:16px}
  .fotoBtn{
    display:inline-block;font-family:'Literata',serif;font-size:14px;letter-spacing:.14em;
    text-transform:uppercase;border:1.5px solid var(--olive);color:var(--olive);
    padding:9px 16px;cursor:pointer;background:none;min-height:32px;
  }
  .fotoBtn:focus-visible{outline:2px solid var(--flag);outline-offset:3px}
  .fotoHint{font-size:13px;font-style:italic;color:var(--ink2);margin-top:8px;line-height:1.4}
  .fotoPoznamka{font-size:12.5px;color:var(--ink2);opacity:.85;margin-top:8px;line-height:1.5}
  .fotoPreview{margin-top:14px;max-width:100%;border:1.5px solid rgba(74,68,58,.35)}
  .fotoPreview img{display:block;width:100%;height:auto}
</style>
</head>
<body>

<a class="preskocit" href="#obsah" data-t="nav.preskocit">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language" data-t="nav.jazykLabel" data-t-attr="aria-label">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
<p class="krokLabel" id="krokLabel"></p>
<nav class="kroky" id="kroky"></nav>
</header>

<main id="obsah">

<section class="plat" id="secApproachIntro">
  <p class="eyebrow" data-t="approachNadpis.eyebrow"></p>
  <h1 class="platNadpis"><em data-t="approachNadpis.over"></em><span data-t="approachNadpis.title"></span></h1>
  <p class="lede" data-t="approachNadpis.lede"></p>
  <div class="cileBox" id="cileBox" hidden></div>
</section>

<section class="plat" id="secApproach1">
  <p class="eyebrow" data-t="approach1.eyebrow"></p>
  <h2 class="platNadpis"><em data-t="approach1.over"></em><span data-t="approach1.title"></span></h2>
  <p class="lede" data-t="approach1.lede"></p>

  <svg id="p2" class="plate-work" viewBox="0 0 400 520" data-t="approach1.planLabel" data-t-attr="aria-label"></svg>
  <p class="state" id="a1kurzor" role="status" aria-live="polite"></p>
  <p class="listMark" data-t="nav.klavesniNapoveda"></p>

  <div class="tools">
    <button type="button" id="a1clear" class="quiet" data-t="approach1.tools.clear"></button>
  </div>
  <p class="state" id="a1state"></p>
  <div class="zonyStav" id="a1zony"></div>

  <p class="listMark" data-t="approach1.foot"></p>
</section>

<section class="plat" id="secApproach2">
  <p class="eyebrow" data-t="approach2.eyebrow"></p>
  <h2 class="platNadpis"><em data-t="approach2.over"></em><span data-t="approach2.title"></span></h2>
  <p class="lede" data-t="approach2.lede"></p>

  <div class="fotoWrap">
    <label class="fotoBtn" for="fotoInput" data-t="approach2.fotoLabel"></label>
    <input type="file" id="fotoInput" accept="image/*" capture="environment" class="visually-hidden">
    <p class="fotoHint" data-t="approach2.fotoHint"></p>
    <p class="fotoPoznamka" data-t="approach2.fotoPoznamka"></p>
    <div class="fotoPreview" id="fotoPreview" hidden><img id="fotoImg" alt="" style="max-height:60vh"></div>
  </div>

  <div id="terenniQuestions"></div>

  <p class="listMark" data-t="approach2.foot"></p>
</section>

<div class="zapamatujBox" id="zapamatujBox" hidden></div>

<nav class="sekceNav" id="sekceNav" data-t="nav.sekceNavLabel" data-t-attr="aria-label"></nav>
</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, blob, hatch, clipPath } from '../../js/platy.js';
import { vytvorPutt } from '../../js/spolecne.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec, ovladaniKlavesnici } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-02.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 2: Approach' : 'ROUTING — Lesson 2: Approach',
});

/* ============================================================================
 * SPOLEČNÝ POZEMEK — stejný obrys jako v tee shot (viz `1-tee-shot.html`).
 * ==========================================================================*/
const POZEMEK = blob(200, 270, 172, 220, 0.05, 707, 0.05, 60);

function kresliPozemek(svg, defs) {
  const cid = 'pz-obrys';
  clipPath(defs, cid, POZEMEK);
  E(svg, 'path', { d: POZEMEK, fill: V('--turf-d', svg), opacity: 0.55 });
  hatch(svg, cid, { x: 10, y: 20, w: 380, h: 500 }, 1.1, 4.2, { op: 0.22, seed: 9 });
  E(svg, 'path', { d: POZEMEK, fill: 'none', stroke: V('--ink', svg), 'stroke-width': 1.1, opacity: 0.8 });
  return cid;
}

/* ============================================================================
 * APPROACH 1 — „Nesmí". Tři pevné zóny na stejném `POZEMEK` obrysu jako
 * tee shot. Klepnutím student hledá, poloměr zásahu je o něco větší než
 * viditelný hazard, ať je to hratelné i na malém displeji.
 * ==========================================================================*/
const A1_ZONY = {
  odtok: { cx: 255, cy: 440, r: 55 },
  svah: { cx: 95, cy: 90, r: 50 },
  stin: { cx: 300, cy: 160, r: 55 },
};
let a1Nalezeno = new Set();

function kresliApproach1(svg) {
  clear(svg);
  const defs = E(svg, 'defs', {});
  kresliPozemek(svg, defs);
  const potok = 'M310 130 C 300 220, 320 300, 290 420 C 280 455, 265 460, 250 462';
  E(svg, 'path', { d: potok, fill: 'none', stroke: V('--water', svg), 'stroke-width': 6, opacity: 0.55, 'stroke-linecap': 'round' });

  Object.entries(A1_ZONY).forEach(([klic, z]) => {
    if (a1Nalezeno.has(klic)) {
      E(svg, 'circle', { cx: z.cx, cy: z.cy, r: 10, fill: V('--flag', svg), opacity: 0.85, stroke: V('--paper', svg), 'stroke-width': 2 });
      E(svg, 'path', { d: `M${z.cx - 4} ${z.cy} l4 5 l7 -10`, stroke: V('--paper', svg), 'stroke-width': 1.6, fill: 'none' });
    }
  });
}

function a1Render() {
  kresliApproach1($('p2'));
  const n = a1Nalezeno.size;
  $('a1state').textContent = n === 0 ? jazyk.t('approach1.stavHledej')
    : n === 3 ? jazyk.t('approach1.stavHotovo')
    : jazyk.t('approach1.stavPokrok').replace('{n}', n);
  const zonyWrap = $('a1zony');
  zonyWrap.innerHTML = '';
  ['odtok', 'svah', 'stin'].forEach((klic) => {
    if (!a1Nalezeno.has(klic)) return;
    const z = jazyk.t('approach1.zony.' + klic);
    const div = document.createElement('div');
    div.className = 'zonaNalezena';
    div.innerHTML = `<b>${z.nazev}</b>${z.popis}`;
    zonyWrap.appendChild(div);
  });
}
function a1Vyber(x, y) {
  for (const [klic, z] of Object.entries(A1_ZONY)) {
    if (Math.hypot(x - z.cx, y - z.cy) <= z.r) { a1Nalezeno.add(klic); break; }
  }
  a1Render();
}
$('p2').addEventListener('click', (ev) => {
  const r = $('p2').getBoundingClientRect();
  a1Vyber((ev.clientX - r.left) / r.width * 400, (ev.clientY - r.top) / r.height * 520);
});
const a1Klavesy = ovladaniKlavesnici($('p2'), {
  sirka: 400, vyska: 520, jazyk, krok: 18, stavEl: $('a1kurzor'),
  onVyber: (x, y) => { a1Vyber(x, y); a1Klavesy.kresliKurzor(); },
});
$('a1clear').addEventListener('click', () => { a1Nalezeno = new Set(); a1Render(); });

/* ============================================================================
 * APPROACH 2 — terénní úkol. Fotka jen jako dočasný náhled (object URL),
 * nikdy se neukládá ani nikam neodesílá.
 * ==========================================================================*/
$('fotoInput').addEventListener('change', () => {
  const f = $('fotoInput').files[0];
  if (!f) return;
  $('fotoImg').src = URL.createObjectURL(f);
  $('fotoPreview').hidden = false;
});

function renderTerenni() {
  vytvorPutt({
    container: $('terenniQuestions'), slovnik, jazyk,
    klicOtazky: 'approach2.otazky', klicPlaceholder: 'putt.poznamkaPlaceholder',
    klicUlozeno: 'approach2.ulozeno', ulozisteKlic: 'routing.terenni.lekce2',
  });
}

jazyk.on(() => {
  a1Render();
  renderTerenni();
  vykresliNavSekci({ lekce: 2, index: 3, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 2, index: 3, jazyk, slovnikPojmu });
});
</script>
</body>
</html>
