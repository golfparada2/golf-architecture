<div class="topbar">
  <div class="hr"><span data-t="toc.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<a class="zpet" href="../../prehled/index.html" data-t="toc.zpetNaPrehled"></a>

<p class="eyebrow" data-t="meta.chapter"></p>
<h1><em data-t="meta.over"></em><span data-t="meta.title"></span></h1>
<div class="dashline"></div>
<p class="lede" data-t="meta.lede"></p>

<div class="hr" style="margin-top:22px"><span data-t="toc.sekceHead"></span></div>
<div class="tocList" id="tocList"></div>

<div class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="../../prehled/index.html" data-t="toc.zpetNaPrehled"></a></div>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { sekceLekce } from '../../js/sekce-nav.js';

const $ = (id) => document.getElementById(id);
const LEKCE = 2;

const slovnik = await nactiSlovnik('../../data/preklady/lekce-02.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 2: Čtení pozemku' : 'ROUTING — Lesson 2: Reading the Land',
});

function renderToc() {
  const wrap = $('tocList');
  wrap.innerHTML = '';
  const sekce = sekceLekce(LEKCE);

  sekce.forEach((s, i) => {
    const a = document.createElement('a');
    a.className = 'tocItem';
    a.href = s.soubor;

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i + 1).padStart(2, '0');

    const meta = document.createElement('span');
    meta.className = 'meta';
    const nadpis = `${jazyk.t(s.klic + '.over')} ${jazyk.t(s.klic + '.title')}`;
    const popis = jazyk.t(s.klic + '.lede');
    meta.innerHTML = `<span class="t">${nadpis}</span><span class="p">${popis}</span>`;

    a.appendChild(num); a.appendChild(meta);
    wrap.appendChild(a);
  });
}

jazyk.on(() => { renderToc(); });
</script>
</body>
</html>
