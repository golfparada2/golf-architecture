<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 2: Česká jamka</title>
<meta name="description" content="Lekce 2, sekce 3 z 7: jedna česká jamka — Golf Dobrouč.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
</head>
<body>

<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<a class="zpet" href="index.html" data-t="nav.prehled"></a>
<p class="krokLabel" id="krokLabel"></p>

<section class="plat" id="secCeska">
  <p class="eyebrow" data-t="ceskaJamka.eyebrow"></p>
  <h2 class="platNadpis"><em data-t="ceskaJamka.over"></em><span data-t="ceskaJamka.title"></span></h2>
  <p class="lede" data-t="ceskaJamka.lede"></p>
  <div id="ceskaKarta"></div>
</section>

<div class="sekceNav" id="sekceNav"></div>
<div class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></div>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { kartaJamky } from '../../js/spolecne.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';

const $ = (id) => document.getElementById(id);

const [slovnik, kartaDobrouc] = await Promise.all([
  nactiSlovnik('../../data/preklady/lekce-02.json'),
  nactiSlovnik('../../data/jamky/dobrouc-3.json'),
]);

const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 2: Česká jamka' : 'ROUTING — Lesson 2: A Czech Hole',
});

function renderKartaCeska() {
  const c = $('ceskaKarta');
  c.innerHTML = '';
  kartaJamky(c, kartaDobrouc, slovnik, jazyk.lang);
}

jazyk.on(() => {
  renderKartaCeska();
  vykresliNavSekci({ lekce: 2, index: 2, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
});
</script>
</body>
</html>
