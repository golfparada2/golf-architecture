<meta name="description" content="Lekce 4, sekce 1 z 7: bezpečná strana, odvážná strana — jak fairway vytváří úhel na green.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">

</head>
<body>

<div class="topbar">

  </div>
</div>

<main id="obsah">

<section class="plat" id="secTeeShot">
  <p class="eyebrow" data-t="teeShot.eyebrow"></p>
  <h1 class="platNadpis"><em data-t="teeShot.over"></em><span data-t="teeShot.title"></span></h1>
  <p class="lede" data-t="teeShot.lede"></p>
  <div class="cileBox" id="cileBox" hidden></div>
  <div class="principBox"><b data-t="principLabel"></b><br><span data-t="teeShot.principle"></span></div>

  <svg id="p1" viewBox="0 0 400 520" role="img" aria-label="Plán jamky se dvěma stranami fairwaye"></svg>

  <div class="toggle" id="teeShotToggle" role="group" aria-label="Strana fairwaye">
    <button type="button" data-strana="bezpecna" data-t="teeShot.toggle.bezpecna" aria-pressed="true"></button>
    <button type="button" data-strana="odvazna" data-t="teeShot.toggle.odvazna"></button>
  </div>

</section>

<div class="zapamatujBox" id="zapamatujBox" hidden></div>

</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, hatch, clipPath } from '../../js/platy.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-04.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 4: Tee shot' : 'ROUTING — Lesson 4: Tee shot',
});

/* ============================================================================
 * GEOMETRIE JAMKY — sdílená (v duchu) se cvičením v `4-approach.html`, kde
 * tatáž fairway/bunkry/green skutečně řídí simulaci přes `resolveLie()`.
 * Tady je to čistě ilustrativní kresba, žádná fyzika za tím není — proto je
 * bezpečné mít konstanty zapsané zvlášť v obou souborech (stejný vzor jako
 * `POZEMEK` duplikovaný mezi sekcemi 1 a 4 v lekci 2).
 *
 * Souřadnice v metrech, y roste směrem od odpaliště ke greenu (stejná
 * konvence jako `js/simulace.js`). Do SVG (viewBox 400×520) se převádí
 * měřítkem 1.2 s odpalištěm dole.
 * ==========================================================================*/
const SCALE = 1.2;
const toX = (x) => 200 + x * SCALE;
const toY = (y) => 510 - y * SCALE;

const FAIRWAY_PTS = [[0, 0], [190, 4], [230, 32], [400, 20]];
const HALF_W = 17;
function centerX(y) {
  if (y <= FAIRWAY_PTS[0][0]) return FAIRWAY_PTS[0][1];
  for (let i = 0; i < FAIRWAY_PTS.length - 1; i++) {
    const [y0, x0] = FAIRWAY_PTS[i], [y1, x1] = FAIRWAY_PTS[i + 1];
    if (y <= y1) return x0 + (x1 - x0) * ((y - y0) / (y1 - y0));
  }
  return FAIRWAY_PTS[FAIRWAY_PTS.length - 1][1];
}

const BUNKER_CORNER = { x: 38, y: 222, r: 13 };
const BUNKER_GREEN = { x: 2, y: 330, r: 7 };
const GREEN = { x: 20, y: 345, rx: 10, ry: 9 };
const PIN = { x: 20, y: 345 };
const AIM = {
  bezpecna: { x: -8, y: 195 },
  odvazna: { x: 30, y: 235 },
};

function fairwayPathD() {
  const n = 40;
  const left = [], right = [];
  for (let i = 0; i <= n; i++) {
    const y = (i / n) * 400;
    const cx = centerX(y);
    left.push([toX(cx - HALF_W), toY(y)]);
    right.push([toX(cx + HALF_W), toY(y)]);
  }
  let d = `M${left[0][0]} ${left[0][1]} `;
  left.slice(1).forEach(([x, y]) => { d += `L${x} ${y} `; });
  right.reverse().forEach(([x, y]) => { d += `L${x} ${y} `; });
  return d + 'Z';
}

function drawArrow(svg, x1, y1, x2, y2, color, dash) {
  const g = E(svg, 'g', { stroke: color, 'stroke-width': 2.2, fill: 'none', 'stroke-dasharray': dash || '' });
  E(g, 'line', { x1, y1, x2, y2 });
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const ax = x2 - Math.cos(ang - 0.4) * 11, ay = y2 - Math.sin(ang - 0.4) * 11;
  const bx = x2 - Math.cos(ang + 0.4) * 11, by = y2 - Math.sin(ang + 0.4) * 11;
  E(g, 'path', { d: `M${x2} ${y2} L${ax} ${ay} M${x2} ${y2} L${bx} ${by}` });
}

function kresliPlate(svg, strana) {
  clear(svg);
  const defs = E(svg, 'defs', {});
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg),
    turfD = V('--turf-d', svg), sand = V('--sand', svg), flag = V('--flag', svg), paper = V('--paper', svg);

  // pozadí — hrubší rough kolem fairwaye
  E(svg, 'rect', { x: 0, y: 0, width: 400, height: 520, fill: turfD, opacity: 0.35 });

  // fairway
  const fid = 'l4-fw';
  const fd = fairwayPathD();
  clipPath(defs, fid, fd);
  E(svg, 'path', { d: fd, fill: turf, opacity: 0.9 });
  hatch(svg, fid, { x: 0, y: 0, w: 400, h: 520 }, 1.05, 4, { op: 0.15, seed: 12 });
  E(svg, 'path', { d: fd, fill: 'none', stroke: ink, 'stroke-width': 1, opacity: 0.7 });

  // bunkry
  [BUNKER_CORNER, BUNKER_GREEN].forEach((b) => {
    E(svg, 'ellipse', { cx: toX(b.x), cy: toY(b.y), rx: b.r * SCALE, ry: b.r * SCALE * 0.85, fill: sand, stroke: ink, 'stroke-width': 1 });
  });

  // green
  E(svg, 'ellipse', { cx: toX(GREEN.x), cy: toY(GREEN.y), rx: GREEN.rx * SCALE, ry: GREEN.ry * SCALE, fill: turf, stroke: ink, 'stroke-width': 1.3 });
  E(svg, 'circle', { cx: toX(PIN.x), cy: toY(PIN.y) - 3, r: 1.8, fill: ink });

  // odpaliste
  E(svg, 'rect', { x: toX(-6), y: toY(0) - 3, width: 12 * SCALE, height: 6, fill: ink2, opacity: 0.6 });

  // linie odpalu + přístupu na green, podle zvolené strany
  const aim = AIM[strana];
  const barva = strana === 'odvazna' ? flag : ink;
  drawArrow(svg, toX(0), toY(0), toX(aim.x), toY(aim.y), barva);
  const dash = strana === 'bezpecna' ? '3 4' : '';
  drawArrow(svg, toX(aim.x), toY(aim.y), toX(PIN.x), toY(PIN.y) + 6, barva, dash);

  // popisky
  const L = strana === 'bezpecna'
    ? (jazyk.lang === 'cs' ? 'BEZPEČNÁ STRANA' : 'SAFE SIDE')
    : (jazyk.lang === 'cs' ? 'ODVÁŽNÁ STRANA' : 'BOLD SIDE');
  E(svg, 'text', { x: toX(aim.x), y: toY(aim.y) - 14, class: 'lab sm', 'text-anchor': 'middle', fill: barva }, L);
}

function renderTeeShot() {
  const strana = document.querySelector('#teeShotToggle button[aria-pressed="true"]')?.dataset.strana || 'bezpecna';
  kresliPlate($('p1'), strana);
  $('teeShotPopis').innerHTML = jazyk.t('teeShot.popis.' + strana);
}
document.querySelectorAll('#teeShotToggle button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#teeShotToggle button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderTeeShot();
  });
});

jazyk.on(() => {
  renderTeeShot();
  vykresliNavSekci({ lekce: 4, index: 0, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 4, index: 0, jazyk, slovnikPojmu });
});
</script>
</body>
</html>
