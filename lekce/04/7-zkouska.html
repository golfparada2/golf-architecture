<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 4: Zkouška</title>
<meta name="description" content="Lekce 4, sekce 7 z 7: šest otázek za 100 bodů.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
</head>
<body>

<a class="preskocit" href="#obsah" data-t="nav.preskocit">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language" data-t="nav.jazykLabel" data-t-attr="aria-label">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
<p class="krokLabel" id="krokLabel"></p>
<nav class="kroky" id="kroky"></nav>
</header>

<main id="obsah">

<section class="plat" id="secZkouska">
  <p class="eyebrow" data-t="zkouska.eyebrow"></p>
  <h1 class="platNadpis"><em data-t="zkouska.over"></em><span data-t="zkouska.title"></span></h1>
  <p class="lede" data-t="zkouska.lede"></p>
  <div class="cileBox" id="cileBox" hidden></div>

  <div class="meter" id="zMeter"></div>
  <div id="zQuiz"></div>
  <div class="tools">
    <button type="button" id="zSubmit" data-t="zkouska.submit" disabled></button>
    <button type="button" id="zAgain" class="quiet" data-t="zkouska.again" hidden></button>
  </div>
  <p class="note" id="zNote"></p>
  <div class="result" id="zResult" hidden></div>

  <p class="listMark" data-t="zkouska.foot"></p>
</section>

<div class="zapamatujBox" id="zapamatujBox" hidden></div>

<nav class="sekceNav" id="sekceNav" data-t="nav.sekceNavLabel" data-t-attr="aria-label"></nav>
</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V } from '../../js/platy.js';
import { vytvorZkousku } from '../../js/zkouska.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-04.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 4: Zkouška' : 'ROUTING — Lesson 4: Exam',
});

/* ============================================================================
 * ZKOUŠKA — miniatury pro Q1 (která fairway nabízí volbu úhlu) a Q4 (ze
 * kterého úhlu je přístup na green nejotevřenější).
 * ==========================================================================*/
function kresliMiniFairway(svg, kind) {
  const ink = V('--ink', svg), turf = V('--turf', svg), turfD = V('--turf-d', svg), sand = V('--sand', svg);
  E(svg, 'rect', { x: 0, y: 0, width: 120, height: 220, fill: turfD, opacity: 0.35 });
  if (kind === 'a') {
    E(svg, 'rect', { x: 35, y: 15, width: 50, height: 190, fill: turf, stroke: ink, 'stroke-width': 1 });
    E(svg, 'ellipse', { cx: 60, cy: 30, rx: 14, ry: 11, fill: turf, stroke: ink, 'stroke-width': 1.2 });
  } else if (kind === 'b') {
    E(svg, 'path', { d: 'M30 205 L38 110 L60 30 L95 30 L88 120 L90 205 Z', fill: turf, stroke: ink, 'stroke-width': 1 });
    E(svg, 'ellipse', { cx: 96, cy: 118, rx: 16, ry: 12, fill: sand, stroke: ink, 'stroke-width': 1 });
    E(svg, 'ellipse', { cx: 70, cy: 34, rx: 13, ry: 10, fill: turf, stroke: ink, 'stroke-width': 1.2 });
  } else {
    E(svg, 'rect', { x: 35, y: 15, width: 50, height: 190, fill: turf, stroke: ink, 'stroke-width': 1 });
    E(svg, 'rect', { x: 20, y: 100, width: 80, height: 22, fill: sand, stroke: ink, 'stroke-width': 1 });
    E(svg, 'ellipse', { cx: 60, cy: 30, rx: 14, ry: 11, fill: turf, stroke: ink, 'stroke-width': 1.2 });
  }
  E(svg, 'rect', { x: 54, y: 200, width: 12, height: 6, fill: ink, opacity: 0.6 });
}

function kresliMiniAngle(svg, kind) {
  const ink = V('--ink', svg), turf = V('--turf', svg), turfD = V('--turf-d', svg), sand = V('--sand', svg), flag = V('--flag', svg);
  E(svg, 'rect', { x: 0, y: 0, width: 120, height: 220, fill: turfD, opacity: 0.35 });
  E(svg, 'ellipse', { cx: 60, cy: 40, rx: 16, ry: 12, fill: turf, stroke: ink, 'stroke-width': 1.2 });
  E(svg, 'ellipse', { cx: 42, cy: 60, rx: 11, ry: 8, fill: sand, stroke: ink, 'stroke-width': 1 });
  E(svg, 'circle', { cx: 60, cy: 38, r: 2, fill: ink });
  const starty = { a: [102, 195], b: [22, 195], c: [46, 195] };
  const [sx, sy] = starty[kind];
  const g = E(svg, 'g', { stroke: flag, 'stroke-width': 2.4, fill: 'none' });
  E(g, 'line', { x1: sx, y1: sy, x2: 60, y2: 42 });
  const ang = Math.atan2(42 - sy, 60 - sx);
  const ax = 60 - Math.cos(ang - 0.4) * 9, ay = 42 - Math.sin(ang - 0.4) * 9;
  const bx = 60 - Math.cos(ang + 0.4) * 9, by = 42 - Math.sin(ang + 0.4) * 9;
  E(g, 'path', { d: `M60 42 L${ax} ${ay} M60 42 L${bx} ${by}` });
}

const zkouskaOtazky = [
  {
    typ: 'obrazek', body: 20, tema: 'strategie', textKlic: 'zkouska.q1.text', hintKlic: 'zkouska.q1.hint',
    vysvetleniKlic: 'zkouska.q1.why', zpetKlic: 'zkouska.q1.back', spravna: 'b',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniFairway(svg, id) })),
  },
  {
    typ: 'jedna', body: 15, tema: 'umisteni-hazardu', textKlic: 'zkouska.q2.text',
    vysvetleniKlic: 'zkouska.q2.why', zpetKlic: 'zkouska.q2.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q2.' + id })),
  },
  {
    typ: 'jedna', body: 15, tema: 'uhel-nabehu', textKlic: 'zkouska.q3.text',
    vysvetleniKlic: 'zkouska.q3.why', zpetKlic: 'zkouska.q3.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q3.' + id })),
  },
  {
    typ: 'obrazek', body: 20, tema: 'uhel-nabehu', textKlic: 'zkouska.q4.text', hintKlic: 'zkouska.q4.hint',
    vysvetleniKlic: 'zkouska.q4.why', zpetKlic: 'zkouska.q4.back', spravna: 'a',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniAngle(svg, id) })),
  },
  {
    typ: 'vice', body: 15, tema: 'strategie', textKlic: 'zkouska.q5.text', hintKlic: 'zkouska.q5.hint',
    vysvetleniKlic: 'zkouska.q5.why', zpetKlic: 'zkouska.q5.back',
    moznosti: [
      { id: 'a', textKlic: 'zkouska.q5.a', ok: true },
      { id: 'b', textKlic: 'zkouska.q5.b', ok: false },
      { id: 'c', textKlic: 'zkouska.q5.c', ok: true },
      { id: 'd', textKlic: 'zkouska.q5.d', ok: true },
    ],
  },
  {
    typ: 'jedna', body: 15, tema: 'diagonalni-hazard', textKlic: 'zkouska.q6.text',
    vysvetleniKlic: 'zkouska.q6.why', zpetKlic: 'zkouska.q6.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q6.' + id })),
  },
];

vytvorZkousku({
  lekce: 4,
  otazky: zkouskaOtazky,
  slovnik,
  jazyk,
  el: { meter: $('zMeter'), quiz: $('zQuiz'), submit: $('zSubmit'), again: $('zAgain'), note: $('zNote'), result: $('zResult') },
});

jazyk.on(() => {
  vykresliNavSekci({ lekce: 4, index: 6, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 4, index: 6, jazyk, slovnikPojmu });
});
</script>
</body>
</html>
