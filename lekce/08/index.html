<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 8: Vzorové jamky</title>
<meta name="description" content="Lekce 8: Vzorové jamky — Redan, Biarritz a Punchbowl, tři nejkopírovanější šablony v dějinách oboru. Sedm sekcí, každá na vlastní stránce.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
</head>
<body>

<a class="preskocit" href="#obsah" data-t="nav.preskocit">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="toc.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language" data-t="nav.jazykLabel" data-t-attr="aria-label">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
</header>

<main id="obsah">

<p class="eyebrow" data-t="meta.chapter"></p>
<h1><em data-t="meta.over"></em><span data-t="meta.title"></span></h1>
<div class="dashline"></div>
<p class="lede" data-t="meta.lede"></p>

<div class="hr" style="margin-top:22px"><span data-t="toc.sekceHead"></span></div>
<div class="tocList" id="tocList"></div>

<div class="hr" style="margin-top:26px"><span data-t="toc.daleHead"></span></div>
<div class="sbirka" id="odkazy"></div>
</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="../../prehled/index.html" data-t="toc.zpetNaPrehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { sekceLekce, nazevSekce } from '../../js/sekce-nav.js';
import { nactiUI, u, vykresliPokracovat } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);
const LEKCE = 8;

const slovnik = await nactiSlovnik('../../data/preklady/lekce-08.json');
await nactiUI('../../');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 8: Vzorové jamky' : 'ROUTING — Lesson 8: Template holes',
});

function renderToc() {
  const wrap = $('tocList');
  wrap.innerHTML = '';
  const sekce = sekceLekce(LEKCE);

  sekce.forEach((s, i) => {
    const a = document.createElement('a');
    a.className = 'tocItem';
    a.href = s.soubor;

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i + 1).padStart(2, '0');

    const meta = document.createElement('span');
    meta.className = 'meta';
    const nadpis = `${jazyk.t(s.klic + '.over')} ${jazyk.t(s.klic + '.title')}`;
    const popis = jazyk.t(s.klic + '.lede');
    meta.innerHTML = `<span class="t">${nadpis}</span><span class="p">${popis}</span>`;

    a.appendChild(num); a.appendChild(meta);
    wrap.appendChild(a);
  });
}

function renderDrobky() {
  const el = $('drobky');
  el.setAttribute('aria-label', u(jazyk.lang, 'drobkyLabel'));
  el.innerHTML = `<ol><li><a href="../../prehled/index.html">${u(jazyk.lang, 'prehled')}</a></li>`
    + `<li><span aria-current="page">${u(jazyk.lang, 'lekceN').replace('{n}', LEKCE)}</span></li></ol>`;
}

function renderOdkazy() {
  const el = $('odkazy');
  el.innerHTML = '';
  [
    { href: '../../slovnicek/index.html', jm: u(jazyk.lang, 'slovnicek'), po: jazyk.t('toc.slovnicekPopis') },
    { href: '../../jamky/index.html', jm: u(jazyk.lang, 'sbirkaJamek'), po: jazyk.t('toc.sbirkaPopis') },
  ].forEach((o) => {
    const a = document.createElement('a');
    a.className = 'sbirkaPolozka';
    a.href = o.href;
    a.innerHTML = `<span class="jm"><b>${o.jm}</b><span>${o.po || ''}</span></span>`;
    el.appendChild(a);
  });
}

jazyk.on(() => { renderToc(); renderDrobky(); renderOdkazy(); });
</script>
</body>
</html>
