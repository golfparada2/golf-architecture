<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">

<title>ROUTING — Lekce 8: Zkouška</title>
<meta name="description" content="Lekce 8, sekce 7 z 7: šest otázek o Redanu, Biarritzu a Punchbowlu za 100 bodů.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
</head>
<body>

<a class="preskocit" href="#obsah" data-t="nav.preskocit">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language" data-t="nav.jazykLabel" data-t-attr="aria-label">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
<p class="krokLabel" id="krokLabel"></p>
<nav class="kroky" id="kroky"></nav>
</header>

<main id="obsah">

<section class="plat" id="secZkouska">
  <p class="eyebrow" data-t="zkouska.eyebrow"></p>
  <h1 class="platNadpis"><em data-t="zkouska.over"></em><span data-t="zkouska.title"></span></h1>
  <p class="lede" data-t="zkouska.lede"></p>
  <div class="cileBox" id="cileBox" hidden></div>

  <div class="meter" id="zMeter"></div>
  <div id="zQuiz"></div>
  <div class="tools">
    <button type="button" id="zSubmit" data-t="zkouska.submit" disabled></button>
    <button type="button" id="zAgain" class="quiet" data-t="zkouska.again" hidden></button>
  </div>
  <p class="note" id="zNote"></p>
  <div class="result" id="zResult" hidden></div>

  <p class="listMark" data-t="zkouska.foot"></p>
</section>

<div class="zapamatujBox" id="zapamatujBox" hidden></div>

<nav class="sekceNav" id="sekceNav" data-t="nav.sekceNavLabel" data-t-attr="aria-label"></nav>
</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V } from '../../js/platy.js';
import { vytvorZkousku } from '../../js/zkouska.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-08.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 8: Zkouška' : 'ROUTING — Lesson 8: Exam',
});

/* ============================================================================
 * MINIATURY PRO OBRÁZKOVÉ OTÁZKY
 *
 * Q1 — tři greeny, jen jeden je Redan: skloněný pod úhlem, bunkr u kratší
 *      strany. Ostatní dva jsou zdánlivě podobné greeny s bunkrem jinde.
 * Q4 — tři greeny, jen jeden je Punchbowl: obklopený valem ze všech stran.
 *      Ostatní dva jsou normální (nezapuštěný) green s bunkry.
 *
 * Miniatury bez popisků — stejné pravidlo jako v lekci 7 (viz `poznamky.md`,
 * Krok 15): do malého plátu se vejde nanejvýš jedno slovo a tady by
 * prozradilo odpověď.
 * ==========================================================================*/
function zaklad(svg, ink, turf, turfD) {
  E(svg, 'rect', { x: 0, y: 0, width: 120, height: 220, fill: turfD, opacity: 0.35 });
}

function kresliMiniRedan(svg, kind) {
  const ink = V('--ink', svg), turf = V('--turf', svg), turfD = V('--turf-d', svg), sand = V('--sand', svg);
  zaklad(svg, ink, turf, turfD);
  if (kind === 'a') {
    // SPRÁVNĚ: green skloněný pod úhlem, bunkr u jeho kratší (pravé) strany
    E(svg, 'ellipse', { cx: 54, cy: 108, rx: 34, ry: 20, transform: 'rotate(-32 54 108)', fill: turf, stroke: ink, 'stroke-width': 1.3 });
    E(svg, 'ellipse', { cx: 86, cy: 132, rx: 13, ry: 9, fill: sand, stroke: ink, 'stroke-width': 1 });
  } else if (kind === 'b') {
    // ZDÁNLIVĚ PODOBNÉ: green rovný (bez úhlu), bunkr přímo vepředu uprostřed
    E(svg, 'ellipse', { cx: 60, cy: 94, rx: 32, ry: 22, fill: turf, stroke: ink, 'stroke-width': 1.3 });
    E(svg, 'ellipse', { cx: 60, cy: 138, rx: 15, ry: 9, fill: sand, stroke: ink, 'stroke-width': 1 });
  } else {
    // ZDÁNLIVĚ PODOBNÉ: green rovný, bunkr vzadu (za greenem, ne u strany)
    E(svg, 'ellipse', { cx: 60, cy: 118, rx: 32, ry: 22, fill: turf, stroke: ink, 'stroke-width': 1.3 });
    E(svg, 'ellipse', { cx: 60, cy: 68, rx: 15, ry: 8, fill: sand, stroke: ink, 'stroke-width': 1 });
  }
}

function kresliMiniPunchbowl(svg, kind) {
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg), turfD = V('--turf-d', svg), sand = V('--sand', svg);
  zaklad(svg, ink, turf, turfD);
  if (kind === 'a') {
    // SPRÁVNĚ: green obklopený valem ze všech stran (dva soustředné obrysy)
    E(svg, 'circle', { cx: 60, cy: 110, r: 40, fill: turf, opacity: 0.55, stroke: ink2, 'stroke-width': 1, 'stroke-dasharray': '3 4' });
    E(svg, 'circle', { cx: 60, cy: 110, r: 21, fill: turf, stroke: ink, 'stroke-width': 1.3 });
  } else if (kind === 'b') {
    // ZDÁNLIVĚ PODOBNÉ: green na vyvýšeném stupni (jen jedna hrana, ne prstenec)
    E(svg, 'path', { d: 'M14 148 L106 148 L90 96 L30 96 Z', fill: turfD, opacity: 0.5 });
    E(svg, 'circle', { cx: 60, cy: 112, r: 21, fill: turf, stroke: ink, 'stroke-width': 1.3 });
  } else {
    // ZDÁNLIVĚ PODOBNÉ: normální green se dvěma bunkry po stranách, žádný val
    E(svg, 'circle', { cx: 60, cy: 110, r: 21, fill: turf, stroke: ink, 'stroke-width': 1.3 });
    E(svg, 'ellipse', { cx: 26, cy: 122, rx: 10, ry: 8, fill: sand, stroke: ink, 'stroke-width': 1 });
    E(svg, 'ellipse', { cx: 94, cy: 122, rx: 10, ry: 8, fill: sand, stroke: ink, 'stroke-width': 1 });
  }
}

const zkouskaOtazky = [
  {
    typ: 'obrazek', body: 20, tema: 'sablonova-jamka', textKlic: 'zkouska.q1.text', hintKlic: 'zkouska.q1.hint',
    vysvetleniKlic: 'zkouska.q1.why', zpetKlic: 'zkouska.q1.back', spravna: 'a',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniRedan(svg, id) })),
  },
  {
    typ: 'jedna', body: 15, tema: 'sablonova-jamka', textKlic: 'zkouska.q2.text',
    vysvetleniKlic: 'zkouska.q2.why', zpetKlic: 'zkouska.q2.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q2.' + id })),
  },
  {
    typ: 'jedna', body: 15, tema: 'sablonova-jamka', textKlic: 'zkouska.q3.text',
    vysvetleniKlic: 'zkouska.q3.why', zpetKlic: 'zkouska.q3.back', spravna: 'a',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q3.' + id })),
  },
  {
    typ: 'obrazek', body: 20, tema: 'sablonova-jamka', textKlic: 'zkouska.q4.text', hintKlic: 'zkouska.q4.hint',
    vysvetleniKlic: 'zkouska.q4.why', zpetKlic: 'zkouska.q4.back', spravna: 'a',
    moznosti: ['a', 'b', 'c'].map((id) => ({ id, kresli: (svg) => kresliMiniPunchbowl(svg, id) })),
  },
  {
    typ: 'vice', body: 15, tema: 'sablonova-jamka', textKlic: 'zkouska.q5.text', hintKlic: 'zkouska.q5.hint',
    vysvetleniKlic: 'zkouska.q5.why', zpetKlic: 'zkouska.q5.back',
    moznosti: [
      { id: 'a', textKlic: 'zkouska.q5.a', ok: true },
      { id: 'b', textKlic: 'zkouska.q5.b', ok: false },
      { id: 'c', textKlic: 'zkouska.q5.c', ok: true },
      { id: 'd', textKlic: 'zkouska.q5.d', ok: true },
    ],
  },
  {
    typ: 'jedna', body: 15, tema: 'sablonova-jamka', textKlic: 'zkouska.q6.text',
    vysvetleniKlic: 'zkouska.q6.why', zpetKlic: 'zkouska.q6.back', spravna: 'b',
    moznosti: ['a', 'b', 'c', 'd'].map((id) => ({ id, textKlic: 'zkouska.q6.' + id })),
  },
];

vytvorZkousku({
  lekce: 8,
  otazky: zkouskaOtazky,
  slovnik,
  jazyk,
  el: { meter: $('zMeter'), quiz: $('zQuiz'), submit: $('zSubmit'), again: $('zAgain'), note: $('zNote'), result: $('zResult') },
});

jazyk.on(() => {
  vykresliNavSekci({ lekce: 8, index: 6, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 8, index: 6, jazyk, slovnikPojmu });
});
</script>
</body>
</html>
