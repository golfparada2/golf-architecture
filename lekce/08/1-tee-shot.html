<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, rng } from '../../js/platy.js';
import { HRACI, gauss, bocniChyba, PODELNA_CHYBA } from '../../js/simulace.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-08.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 8: Tee shot' : 'ROUTING — Lesson 8: Tee shot',
});

/* ============================================================================
 * PLÁT „RAMENO, NE PRAPOREK“ — REDAN
 *
 * Ilustrativní Redan, ne plán konkrétní jamky (stejná zásada jako u plátů
 * v lekci 7 — viz `poznamky.md`). Souřadnice v metrech v místní soustavě
 * greenu: x napříč (kladně vpravo), y do hloubky greenu od jeho předního
 * okraje (roste směrem od hráče).
 *
 * DVĚ STRATEGIE:
 *   PŘÍMO   — cíl přiblížky je jamka.
 *   RAMENO  — cíl je vyvýšené rameno vpravo od greenu. Padne-li rána do
 *             pásu ramene, simuluje se svah: bod se posune zlomkem cesty
 *             k jamce (POSUN_RAMENE). To je jediné místo v modelu, kde
 *             strategie mění samotnou fyziku, ne jen míření — přesně jako
 *             `opatrne` u layupu v lekci 7 mění dráhu, ne jen cíl.
 *
 * Rozptyl přiblížky používá STEJNÝ vzorec jako zbytek kurzu: boční chyba
 * `bocniChyba(hcp) * vzdálenost`, podélná `PODELNA_CHYBA * vzdálenost`
 * (js/simulace.js). Žádná nová konstanta si nevymýšlí vlastní čísla.
 * ==========================================================================*/
const VZDAL = 180;                     // m, standardní délka Redanu
const PIN = { x: -2, y: 24 };
const GREEN = { cx: 0, cy: 20, rx: 9, ry: 13 };
const BUNKR = { cx: -9, cy: 6, rx: 6, ry: 5 };
const RAMENO = { cx: 12, cy: 11, rx: 9, ry: 12 };
const AIM = { primo: PIN, rameno: { x: 12, y: 11 } };
const POSUN_RAMENE = 0.8;              // podíl cesty k jamce, který svah odvede
const KOL = 2000;

const SX = 3.6, SY = 3.6;
const toX = (x) => 200 + x * SX;
const toY = (y) => 470 - y * SY;

const HRACI_RADA = [HRACI[0], HRACI[9], HRACI[18], HRACI[24]];

function vElipse(p, e) {
  const dx = (p.x - e.cx) / e.rx, dy = (p.y - e.cy) / e.ry;
  return dx * dx + dy * dy <= 1;
}

/** Jedna přiblížka: vrátí { lezeni: 'green'|'bunkr'|'mimo', vzdalPin } */
function rana(hrac, strategie, rnd) {
  const aim = AIM[strategie];
  const sigLat = bocniChyba(hrac.hcp) * VZDAL;
  const sigLong = PODELNA_CHYBA * VZDAL;
  let x = aim.x + gauss(rnd) * sigLat;
  let y = aim.y + gauss(rnd) * sigLong;

  if (strategie === 'rameno' && vElipse({ x, y }, RAMENO)) {
    x += (PIN.x - x) * POSUN_RAMENE;
    y += (PIN.y - y) * POSUN_RAMENE;
  }

  let lezeni = 'mimo';
  if (vElipse({ x, y }, BUNKR)) lezeni = 'bunkr';
  else if (vElipse({ x, y }, GREEN)) lezeni = 'green';
  return { lezeni, vzdalPin: Math.hypot(x - PIN.x, y - PIN.y) };
}

function davka(hrac, strategie, seed) {
  const rnd = rng(seed);
  let naGreenu = 0, sumaVzdal = 0;
  for (let i = 0; i < KOL; i++) {
    const r = rana(hrac, strategie, rnd);
    if (r.lezeni === 'green') { naGreenu++; sumaVzdal += r.vzdalPin; }
  }
  return { podilGreen: naGreenu / KOL, prumerVzdal: naGreenu ? sumaVzdal / naGreenu : 0 };
}

/* Spočítá se jednou při načtení — čísla jsou pak stejná po celou návštěvu. */
const VYSLEDKY = {};
HRACI_RADA.forEach((h, i) => {
  VYSLEDKY[h.hcp] = {
    primo: davka(h, 'primo', 8010 + i * 10),
    rameno: davka(h, 'rameno', 8010 + i * 10),
  };
});

function cislo(n, des = 1) {
  const t = n.toFixed(des);
  return jazyk.lang === 'cs' ? t.replace('.', ',') : t;
}

/* --- kresba --------------------------------------------------------------- */
function elipsaSvg(svg, e, attrs) {
  E(svg, 'ellipse', Object.assign({
    cx: toX(e.cx).toFixed(1), cy: toY(e.cy).toFixed(1),
    rx: (e.rx * SX).toFixed(1), ry: (e.ry * SY).toFixed(1),
  }, attrs));
}

function kresli(svg, strategie) {
  clear(svg);
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg),
    turfD = V('--turf-d', svg), sand = V('--sand', svg), flag = V('--flag', svg);
  svg.setAttribute('aria-label', jazyk.t('teeShot.planLabel'));

  E(svg, 'rect', { x: 0, y: 0, width: 400, height: 520, fill: turfD, opacity: 0.35 });

  // rameno — vyvýšená plocha vpravo od greenu, kreslí se PRVNÍ (pod greenem)
  elipsaSvg(svg, RAMENO, { fill: turf, opacity: 0.55, stroke: ink2, 'stroke-width': 1, 'stroke-dasharray': '3 4' });

  // green
  elipsaSvg(svg, GREEN, { fill: turf, stroke: ink, 'stroke-width': 1.4 });

  // bunkr
  elipsaSvg(svg, BUNKR, { fill: sand, stroke: ink, 'stroke-width': 1.3 });
  const zrno = E(svg, 'g', { fill: ink, opacity: 0.3 });
  const s = rng(8099);
  const bx = toX(BUNKR.cx) - BUNKR.rx * SX, bw = BUNKR.rx * 2 * SX;
  const by = toY(BUNKR.cy) - BUNKR.ry * SY, bh = BUNKR.ry * 2 * SY;
  for (let k = 0; k < 30; k++) {
    E(zrno, 'circle', { cx: (bx + 3 + s() * (bw - 6)).toFixed(1), cy: (by + 3 + s() * (bh - 6)).toFixed(1), r: 0.9 });
  }

  // praporek
  E(svg, 'circle', { cx: toX(PIN.x).toFixed(1), cy: toY(PIN.y).toFixed(1), r: 2, fill: ink });
  E(svg, 'path', {
    d: `M${toX(PIN.x)} ${toY(PIN.y)} L${toX(PIN.x)} ${toY(PIN.y) - 22} L${toX(PIN.x) + 14} ${toY(PIN.y) - 17} L${toX(PIN.x)} ${toY(PIN.y) - 12}`,
    fill: flag, stroke: ink, 'stroke-width': 1,
  });

  // šipka k aktuálnímu cíli
  const aim = AIM[strategie];
  const ax = toX(aim.x), ay = toY(aim.y);
  E(svg, 'line', { x1: 200, y1: 500, x2: ax, y2: ay, stroke: ink2, 'stroke-width': 1, 'stroke-dasharray': '5 4', opacity: 0.55 });
  E(svg, 'circle', { cx: ax, cy: ay, r: 3.2, fill: 'none', stroke: flag, 'stroke-width': 1.6 });

  // odpaliště (jen orientační bod dole)
  E(svg, 'rect', { x: 191, y: 494, width: 18, height: 11, rx: 2, fill: turf, stroke: ink, 'stroke-width': 1.1 });
}

/* --- tabulka a verdikt ----------------------------------------------------- */
function vypln(strategie) {
  const telo = $('tabTelo');
  telo.innerHTML = '';
  let maxRozdil = -Infinity;

  HRACI_RADA.forEach((h) => {
    const v = VYSLEDKY[h.hcp][strategie];
    const rozdil = (VYSLEDKY[h.hcp].rameno.podilGreen - VYSLEDKY[h.hcp].primo.podilGreen) * 100;
    if (rozdil > maxRozdil) maxRozdil = rozdil;

    const tr = document.createElement('tr');
    const proc = v.podilGreen * 100;
    tr.innerHTML = `<th>${h.jmeno}</th>`
      + `<td>${cislo(proc, 1)} %</td>`
      + `<td>${v.podilGreen < 0.01 ? '—' : cislo(v.prumerVzdal, 1) + ' m'}</td>`;
    telo.appendChild(tr);
  });

  const el = $('verdikt');
  const maxPodil = Math.max(...HRACI_RADA.map((h) => VYSLEDKY[h.hcp].primo.podilGreen), ...HRACI_RADA.map((h) => VYSLEDKY[h.hcp].rameno.podilGreen));
  if (maxPodil < 0.03) {
    el.innerHTML = jazyk.t('teeShot.verdikt.dekorace').replace('{max}', cislo(maxPodil * 100, 1));
  } else if (maxRozdil < 3) {
    el.innerHTML = jazyk.t('teeShot.verdikt.rovne').replace('{odch}', cislo(maxRozdil, 1));
  } else {
    el.innerHTML = jazyk.t('teeShot.verdikt.krive').replace('{odch}', cislo(maxRozdil, 1));
  }
  $('strategiePopis').textContent = jazyk.t('teeShot.popis.' + (strategie === 'primo' ? 'okraje' : 'stred'));
}

let aktualni = 'primo';
function prekresli() {
  kresli($('p1'), aktualni);
  vypln(aktualni);
  $('strategieToggle').querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.strategie === aktualni));
  });
}

$('strategieToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-strategie]');
  if (!b) return;
  aktualni = b.dataset.strategie;
  prekresli();
});

jazyk.on(() => {
  $('strategieToggle').setAttribute('aria-label', jazyk.t('teeShot.tabHead'));
  prekresli();
  vykresliNavSekci({ lekce: 8, index: 0, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 8, index: 0, jazyk, slovnikPojmu });
});
</script>
