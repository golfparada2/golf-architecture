<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 8: Tři šablony</title>
<meta name="description" content="Lekce 8, sekce 2 z 7: Redan, Biarritz a Punchbowl — původ, definiční rys a nejslavnější příklad každé šablony.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
<style>
  .vzorKarta{margin-top:26px;padding-top:20px;border-top:1px solid rgba(74,68,58,.25)}
  .vzorKarta:first-of-type{border-top:0;padding-top:0}
  .vzorKarta h2{font-family:'Fraunces',serif;font-weight:900;font-size:22px;margin:0 0 8px}
  .vzorRadek{display:grid;grid-template-columns:1fr;gap:2px 18px;margin-top:10px}
  @media(min-width:640px){.vzorRadek{grid-template-columns:1fr 1fr}}
  .vzorPole{margin-top:10px}
  .vzorPole b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
  .vzorPole p{margin:0;font-size:14.5px;line-height:1.5}
  .vzorPrenos{margin-top:12px;padding:10px 14px;background:rgba(59,74,42,.06);border-left:3px solid var(--olive)}
  .vzorPrenos p{margin:0;font-size:14px;line-height:1.5;font-style:italic}
</style>
</head>
<body>

<a class="preskocit" href="#obsah" data-t="nav.preskocit">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language" data-t="nav.jazykLabel" data-t-attr="aria-label">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
<p class="krokLabel" id="krokLabel"></p>
<nav class="kroky" id="kroky"></nav>
</header>

<main id="obsah">

<section class="plat" id="secFairway">
  <p class="eyebrow" data-t="fairway.eyebrow"></p>
  <h1 class="platNadpis"><em data-t="fairway.over"></em><span data-t="fairway.title"></span></h1>
  <p class="lede" data-t="fairway.lede"></p>
  <div class="cileBox" id="cileBox" hidden></div>
  <div id="vzoryList"></div>
</section>

<div class="vyzkousejBox" id="vyzkousejBox" hidden></div>

<div class="zapamatujBox" id="zapamatujBox" hidden></div>

<nav class="sekceNav" id="sekceNav" data-t="nav.sekceNavLabel" data-t-attr="aria-label"></nav>
</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-08.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');

const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 8: Tři šablony' : 'ROUTING — Lesson 8: Three templates',
});

/* Tři šablony se nekreslí jako `kartaJamky()` — ta vyžaduje ověřená
   `tvary.obrys` data (viz `poznamky.md`, přísný princip doloženosti), a pro
   North Berwick 15 / Yale 9 / National 16 je nemáme. Místo schématu jsou
   tu ověřená fakta s odkazem na zdroj (viz `data/preklady/lekce-08.json`,
   pole `fairway.vzory`) — přesné obrysy těchhle jamek jsou budoucí úkol,
   ne něco, co jde domalovat od oka. */
function renderVzory() {
  const wrap = $('vzoryList');
  wrap.innerHTML = '';
  const vzory = jazyk.t('fairway.vzory') || [];
  const L = {
    puvod: jazyk.lang === 'cs' ? 'Původ' : 'Origin',
    znak: jazyk.lang === 'cs' ? 'Definiční rys' : 'Defining feature',
    priklad: jazyk.lang === 'cs' ? 'Nejslavnější příklad' : 'Most famous example',
  };
  vzory.forEach((v) => {
    const art = document.createElement('article');
    art.className = 'vzorKarta';
    art.innerHTML = `
      <h2>${v.jmeno}</h2>
      <div class="vzorRadek">
        <div class="vzorPole"><b>${L.puvod}</b><p>${v.puvod}</p></div>
        <div class="vzorPole"><b>${L.znak}</b><p>${v.znak}</p></div>
      </div>
      <div class="vzorPole"><b>${L.priklad}</b><p>${v.priklad}</p></div>
      <div class="vzorPrenos"><p>${v.prenositelne}</p></div>
    `;
    wrap.appendChild(art);
  });
}

jazyk.on(() => {
  renderVzory();
  vykresliNavSekci({ lekce: 8, index: 1, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 8, index: 1, jazyk, slovnikPojmu });
});
</script>
</body>
</html>
