<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, rng } from '../../js/platy.js';
import { HRACI, gauss, bocniChyba, PODELNA_CHYBA } from '../../js/simulace.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-08.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 8: Approach' : 'ROUTING — Lesson 8: Approach',
});

/* ============================================================================
 * PLÁT „KOLIK POMŮŽE MÍSA“ — PUNCHBOWL
 *
 * Ilustrativní green, ne plán konkrétní jamky. Souřadnice v metrech,
 * jamka/střed greenu = (0,0), stejně jako u ostatních plátů kurzu.
 *
 * DVĚ VERZE STEJNÉHO GREENU:
 *   PLOCHÝ GREEN — počítá se jen zásah do kruhu R_GREEN.
 *   PUNCHBOWL    — navíc: rána, která dopadne do prstence mezi R_GREEN
 *                  a R_BOWL (val), se posune směrem ke středu o podíl
 *                  TAH_STRED — to simuluje svah, který míč vrací dovnitř.
 *                  Rána za R_BOWL je mimo dosah valu a zůstává mimo.
 *
 * Cíl (aim) je u obou verzí střed greenu — hráč u Punchbowlu nevidí
 * green, ale míří na tyč s praporkem nad valem, ne jinam.
 *
 * Rozptyl používá STEJNÝ vzorec jako zbytek kurzu (js/simulace.js):
 * boční `bocniChyba(hcp) * vzdálenost`, podélná `PODELNA_CHYBA * vzdálenost`.
 * ==========================================================================*/
const VZDAL = 150;                 // m
const R_GREEN = 8;                 // m, poloměr putovací plochy
const R_BOWL = 17;                 // m, jak daleko sahá val
const TAH_STRED = 0.6;             // podíl cesty ke středu, který val odvede
const KOL = 2000;

const SX = 5.2, SY = 5.2;
const toX = (x) => 200 + x * SX;
const toY = (y) => 200 - y * SY;

const HRACI_RADA = [HRACI[0], HRACI[9], HRACI[18], HRACI[24]];

function vKruh(x, y, r) { return x * x + y * y <= r * r; }

/** Jedna přiblížka: vrátí { green:boolean, dopad:{x,y} (PŮVODNÍ, pro kresbu) } */
function rana(hrac, punchbowl, rnd) {
  const sigLat = bocniChyba(hrac.hcp) * VZDAL;
  const sigLong = PODELNA_CHYBA * VZDAL;
  const x0 = gauss(rnd) * sigLat, y0 = gauss(rnd) * sigLong;
  let x = x0, y = y0;
  let green = vKruh(x, y, R_GREEN);
  if (!green && punchbowl && vKruh(x, y, R_BOWL)) {
    x *= (1 - TAH_STRED); y *= (1 - TAH_STRED);
    green = vKruh(x, y, R_GREEN);
  }
  return { green, dopad: { x: x0, y: y0 } };
}

function davka(hrac, punchbowl, seed) {
  const rnd = rng(seed);
  let naGreenu = 0;
  for (let i = 0; i < KOL; i++) {
    if (rana(hrac, punchbowl, rnd).green) naGreenu++;
  }
  return { podil: naGreenu / KOL };
}

/* Spočítá se jednou při načtení. */
const VYSLEDKY = {};
HRACI_RADA.forEach((h, i) => {
  VYSLEDKY[h.hcp] = {
    plochy: davka(h, false, 9010 + i * 10),
    punchbowl: davka(h, true, 9010 + i * 10),
  };
});

function cislo(n, des = 1) {
  const t = n.toFixed(des);
  return jazyk.lang === 'cs' ? t.replace('.', ',') : t;
}

/* --- kresba ------------------------------------------------------------- */
function kresli(svg, verze) {
  clear(svg);
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), turf = V('--turf', svg), turfD = V('--turf-d', svg);
  svg.setAttribute('aria-label', jazyk.t('approach1.planLabel'));

  E(svg, 'rect', { x: 0, y: 0, width: 400, height: 400, fill: turfD, opacity: 0.35 });

  if (verze === 'punchbowl') {
    // val — prstenec kolem greenu, kreslený jako širší kruh POD greenem
    E(svg, 'circle', { cx: toX(0), cy: toY(0), r: (R_BOWL * SX).toFixed(1), fill: turf, opacity: 0.55, stroke: ink2, 'stroke-width': 1, 'stroke-dasharray': '3 4' });
  }

  // green
  E(svg, 'circle', { cx: toX(0), cy: toY(0), r: (R_GREEN * SX).toFixed(1), fill: turf, stroke: ink, 'stroke-width': 1.4 });
  E(svg, 'circle', { cx: toX(0), cy: toY(0), r: 2, fill: ink });
  E(svg, 'path', {
    d: `M${toX(0)} ${toY(0)} L${toX(0)} ${toY(0) - 22} L${toX(0) + 14} ${toY(0) - 17} L${toX(0)} ${toY(0) - 12}`,
    fill: V('--flag', svg), stroke: ink, 'stroke-width': 1,
  });
}

/* --- tabulka a verdikt ---------------------------------------------------- */
function vypln() {
  const telo = $('tabTelo');
  telo.innerHTML = '';
  HRACI_RADA.forEach((h) => {
    const p = VYSLEDKY[h.hcp].plochy.podil * 100;
    const b = VYSLEDKY[h.hcp].punchbowl.podil * 100;
    const tr = document.createElement('tr');
    tr.innerHTML = `<th>${h.jmeno}</th>`
      + `<td>${cislo(p, 1)} %</td>`
      + `<td>${cislo(b, 1)} %</td>`
      + `<td>+${cislo(b - p, 1)}</td>`;
    telo.appendChild(tr);
  });
}

let verze = 'plochy';
function prekresli() {
  kresli($('p4'), verze);
  $('verzeToggle').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.verze === verze)));
}

$('verzeToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-verze]');
  if (!b) return;
  verze = b.dataset.verze;
  prekresli();
});

jazyk.on(() => {
  $('verzeToggle').querySelector('[data-verze=plochy]').textContent = jazyk.t('approach1.tabulka.smele');
  $('verzeToggle').querySelector('[data-verze=punchbowl]').textContent = jazyk.t('approach1.tabulka.opatrne');
  $('verzeToggle').setAttribute('aria-label', jazyk.t('approach1.hracLabel'));
  $('hracLabel').textContent = jazyk.t('approach1.hracLabel');
  vypln();
  prekresli();
  $('zaver').innerHTML = jazyk.t('approach1.zaver');
  vykresliNavSekci({ lekce: 8, index: 3, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 8, index: 3, jazyk, slovnikPojmu });
});
</script>
