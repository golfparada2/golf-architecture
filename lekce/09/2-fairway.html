<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, rng } from '../../js/platy.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-09.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 9: Vítr ze všech stran' : 'ROUTING — Lesson 9: Wind from every side',
});

/* ============================================================================
 * PLÁT „VÍTR ZE VŠECH STRAN“
 *
 * Dvě ILUSTRATIVNÍ směrové růžice — ne plán žádného konkrétního hřiště
 * (stejná zásada jako u Redanu/Punchbowlu v lekci 8). Úhly jsou generované
 * nasazeným generátorem (`rng`, `js/platy.js`), takže jsou při každé
 * návštěvě stejné a dají se o nich psát v textu — ale nejde o zaměřená
 * data žádného reálného hřiště.
 * ==========================================================================*/
function generujSmery(seed, jednosmerne) {
  const r = rng(seed);
  const smery = [];
  for (let i = 0; i < 18; i++) {
    if (jednosmerne && i < 14) {
      // čtrnáct z osmnácti do stejné čtvrtiny kompasu (kolem 260°, tedy Z)
      smery.push(260 + (r() - 0.5) * 40);
    } else if (jednosmerne) {
      smery.push(r() * 360);
    } else {
      // rovnoměrně po celém kruhu s mírným rozptylem
      smery.push((i / 18) * 360 + (r() - 0.5) * 16);
    }
  }
  return smery;
}

const SMERY_JEDNO = generujSmery(9010, true);
const SMERY_MIX = generujSmery(9011, false);

function kresli(svg, smery) {
  clear(svg);
  const ink = V('--ink', svg), ink2 = V('--ink2', svg), olive = V('--olive', svg);
  const cx = 180, cy = 180, R = 150;

  // kruhy vzdálenosti
  [50, 100, 150].forEach((r) => {
    E(svg, 'circle', { cx, cy, r, fill: 'none', stroke: ink2, 'stroke-width': 0.6, opacity: 0.35 });
  });
  // osy N-S, E-W
  E(svg, 'line', { x1: cx, y1: cy - R, x2: cx, y2: cy + R, stroke: ink2, 'stroke-width': 0.6, opacity: 0.4 });
  E(svg, 'line', { x1: cx - R, y1: cy, x2: cx + R, y2: cy, stroke: ink2, 'stroke-width': 0.6, opacity: 0.4 });
  const smerLabely = jazyk.lang === 'cs' ? ['S', 'V', 'J', 'Z'] : ['N', 'E', 'S', 'W'];
  const smerPoz = [[cx, cy - R - 14], [cx + R + 12, cy], [cx, cy + R + 18], [cx - R - 14, cy]];
  smerLabely.forEach((l, i) => {
    E(svg, 'text', { x: smerPoz[i][0], y: smerPoz[i][1], 'text-anchor': 'middle', class: 'lab sm', fill: ink, opacity: 0.7 }, l);
  });

  // jamky jako šipky ze středu
  const g = E(svg, 'g', { stroke: olive, 'stroke-width': 2, opacity: 0.75, 'stroke-linecap': 'round' });
  smery.forEach((deg) => {
    const rad = (deg - 90) * Math.PI / 180;
    const x2 = cx + Math.cos(rad) * (R - 8);
    const y2 = cy + Math.sin(rad) * (R - 8);
    E(g, 'line', { x1: cx, y1: cy, x2: x2.toFixed(1), y2: y2.toFixed(1) });
    E(g, 'circle', { cx: x2.toFixed(1), cy: y2.toFixed(1), r: 2.6, fill: olive, stroke: 'none' });
  });
  E(svg, 'circle', { cx, cy, r: 3, fill: ink });
}

let aktualni = 'jednosmerne';
function prekresli() {
  const smery = aktualni === 'jednosmerne' ? SMERY_JEDNO : SMERY_MIX;
  kresli($('p2'), smery);
  $('smerToggle').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.smer === aktualni)));
  $('smerToggle').querySelector('[data-smer=jednosmerne]').textContent = jazyk.lang === 'cs' ? 'Jednosměrné' : 'One-directional';
  $('smerToggle').querySelector('[data-smer=smisene]').textContent = jazyk.lang === 'cs' ? 'Smíšené' : 'Mixed';
  $('smerPopis').textContent = jazyk.t('fairway.popis.' + aktualni);
  $('p2').setAttribute('aria-label', jazyk.t('fairway.planLabel'));
}

$('smerToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-smer]');
  if (!b) return;
  aktualni = b.dataset.smer;
  prekresli();
});

jazyk.on(() => {
  prekresli();
  vykresliNavSekci({ lekce: 9, index: 1, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 9, index: 1, jazyk, slovnikPojmu });
});
</script>
