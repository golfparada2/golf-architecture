<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — Lekce 9: Sousední jamky</title>
<meta name="description" content="Lekce 9, sekce 3 z 7: Karlštejn 14 a 15 — dvě sousední jamky se stejným rybníkem a úplně jiným úkolem.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/styl.css">
</head>
<body>

<a class="preskocit" href="#obsah" data-t="nav.preskocit">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language" data-t="nav.jazykLabel" data-t-attr="aria-label">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
<p class="krokLabel" id="krokLabel"></p>
<nav class="kroky" id="kroky"></nav>
</header>

<main id="obsah">

<section class="plat" id="secCeska">
  <p class="eyebrow" data-t="ceskaJamka.eyebrow"></p>
  <h1 class="platNadpis"><em data-t="ceskaJamka.over"></em><span data-t="ceskaJamka.title"></span></h1>
  <p class="lede" data-t="ceskaJamka.lede"></p>
  <div class="cileBox" id="cileBox" hidden></div>
  <div id="karta14"></div>
  <div id="karta15"></div>
</section>

<div class="vyzkousejBox" id="vyzkousejBox" hidden></div>

<div class="zapamatujBox" id="zapamatujBox" hidden></div>

<nav class="sekceNav" id="sekceNav" data-t="nav.sekceNavLabel" data-t-attr="aria-label"></nav>
</main>

<footer class="foot"><span data-t="foot.lekce"></span><a class="zpet" style="margin-top:0" href="index.html" data-t="nav.prehled"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { kartaJamky } from '../../js/spolecne.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const [slovnik, karlstejn14, karlstejn15] = await Promise.all([
  nactiSlovnik('../../data/preklady/lekce-09.json'),
  nactiSlovnik('../../data/jamky/karlstejn-14.json'),
  nactiSlovnik('../../data/jamky/karlstejn-15.json'),
]);

await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');

const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 9: Sousední jamky' : 'ROUTING — Lesson 9: Neighbouring holes',
});

function renderKarty() {
  const c14 = $('karta14'); c14.innerHTML = '';
  const c15 = $('karta15'); c15.innerHTML = '';
  kartaJamky(c14, karlstejn14, slovnik, jazyk.lang);
  kartaJamky(c15, karlstejn15, slovnik, jazyk.lang);
}

jazyk.on(() => {
  renderKarty();
  vykresliNavSekci({ lekce: 9, index: 2, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 9, index: 2, jazyk, slovnikPojmu });
});
</script>
</body>
</html>
