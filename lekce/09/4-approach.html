<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../../js/jazyk.js';
import { E, V, clear, rng } from '../../js/platy.js';
import { gauss } from '../../js/simulace.js';
import { vykresliNavSekci } from '../../js/sekce-nav.js';
import { nactiUI, vykresliRamec } from '../../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../../data/preklady/lekce-09.json');
await nactiUI('../../');
const slovnikPojmu = await nactiSlovnik('../../data/preklady/slovnik-pojmu.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — Lekce 9: Approach' : 'ROUTING — Lesson 9: Approach',
});

/* ============================================================================
 * PLÁT „KDE SE ROZHODUJE“ — AMEN CORNER
 *
 * Devět jamek, dvě pořadí stejné sady „klidných“ (sigma 0.3) a „švihových“
 * (sigma 1.2) jamek — jednou švihové na konci (KONEC), jednou rozprostřené
 * rovnoměrně (ROZPROSTRENE). Součet rozptylů je u obou verzí STEJNÝ
 * (ověřeno v kódu níž), takže rozdíl ve výsledku není „tahle verze je
 * těžší“ — je to čistě otázka POŘADÍ.
 *
 * Sleduje se: kolikrát se hráč, co vedl po 6. jamce, do konce PŘESTANE
 * vést (vedení se otočí). To je operacionalizace „drama na konci kola“.
 * ==========================================================================*/
const TAME = 0.3, SWINGY = 1.2;
const KONEC = [TAME, TAME, TAME, TAME, TAME, TAME, SWINGY, SWINGY, SWINGY];
const soucetRozptylu = KONEC.reduce((s, x) => s + x * x, 0);
const evenSigma = Math.sqrt(soucetRozptylu / 9);
const ROZPROSTRENE = new Array(9).fill(evenSigma);
const KOL = 20000;

function simuluj(sigmy, seed) {
  const rnd = rng(seed);
  let otoceni = 0, platnych = 0;
  for (let t = 0; t < KOL; t++) {
    let cum = 0, leaderPul = 0;
    for (let i = 0; i < 9; i++) {
      cum += gauss(rnd) * sigmy[i];
      if (i === 5) leaderPul = cum > 0 ? 1 : (cum < 0 ? -1 : 0);
    }
    const leaderKonec = cum > 0 ? 1 : (cum < 0 ? -1 : 0);
    if (leaderPul !== 0 && leaderKonec !== 0) {
      platnych++;
      if (leaderPul !== leaderKonec) otoceni++;
    }
  }
  return otoceni / platnych;
}

const P_KONEC = simuluj(KONEC, 5501);
const P_ROZPROSTRENE = simuluj(ROZPROSTRENE, 5502);

function cislo(n, des = 1) {
  const t = n.toFixed(des);
  return jazyk.lang === 'cs' ? t.replace('.', ',') : t;
}

function kresli(svg, sigmy) {
  clear(svg);
  const ink = V('--ink', svg), olive = V('--olive', svg), flag = V('--flag', svg);
  const n = sigmy.length;
  const gap = 6, w = (720 - gap * (n - 1)) / n, h = 70, y0 = 10;
  sigmy.forEach((s, i) => {
    const svihova = s > TAME;
    E(svg, 'rect', {
      x: (i * (w + gap)).toFixed(1), y: y0, width: w.toFixed(1), height: h,
      fill: svihova ? flag : olive, opacity: svihova ? 0.85 : 0.35, stroke: ink, 'stroke-width': 1,
    });
    E(svg, 'text', {
      x: (i * (w + gap) + w / 2).toFixed(1), y: y0 + h + 18, 'text-anchor': 'middle', class: 'lab sm', fill: ink, opacity: 0.6,
    }, String(i + 1));
  });
}

let aktualni = 'konec';
function prekresli() {
  const sigmy = aktualni === 'konec' ? KONEC : ROZPROSTRENE;
  kresli($('p4'), sigmy);
  $('p4').setAttribute('aria-label', jazyk.t('approach1.planLabel'));
  $('verzeToggle').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.verze === aktualni)));

  const telo = $('tabTelo');
  telo.innerHTML = '';
  const tr = document.createElement('tr');
  tr.innerHTML = `<th>${jazyk.t('approach1.tabulka.rana')}</th>`
    + `<td>${cislo(P_KONEC * 100, 1)} %</td>`
    + `<td>${cislo(P_ROZPROSTRENE * 100, 1)} %</td>`;
  telo.appendChild(tr);

  $('zaver').innerHTML = jazyk.t('approach1.zaver').replace('{a}', cislo(P_KONEC * 100, 1)).replace('{b}', cislo(P_ROZPROSTRENE * 100, 1));
}

$('verzeToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-verze]');
  if (!b) return;
  aktualni = b.dataset.verze;
  prekresli();
});

jazyk.on(() => {
  $('verzeToggle').querySelector('[data-verze=konec]').textContent = jazyk.t('approach1.tabulka.smele');
  $('verzeToggle').querySelector('[data-verze=rozprostrene]').textContent = jazyk.t('approach1.tabulka.opatrne');
  $('hracLabel').textContent = jazyk.t('approach1.hracLabel');
  prekresli();
  vykresliNavSekci({ lekce: 9, index: 3, jazyk, krokEl: $('krokLabel'), navEl: $('sekceNav') });
  vykresliRamec({ lekce: 9, index: 3, jazyk, slovnikPojmu });
});
</script>
