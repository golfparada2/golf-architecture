<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — přehled kurzu</title>
<meta name="description" content="Studijní mapa kurzu golfové architektury: 18 lekcí, přehled postupu, slovníček, sbírka rozebraných jamek a výsledky zkoušek.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/styl.css">
<style>
  /* styly specifické pro studijní mapu — sdílené věci jsou v assets/styl.css */
  .progres{margin-top:10px;font-size:13px;color:var(--ink2);font-style:italic}
  .lesson{
    display:flex;align-items:baseline;gap:14px;padding:16px 2px;
    border-bottom:1px solid rgba(74,68,58,.25);min-height:32px;
    text-decoration:none;color:inherit;
  }
  .lesson:hover{background:rgba(59,74,42,.05)}
  .lesson:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
  .lesson .num{font-family:'Fraunces',serif;font-weight:900;font-size:24px;color:var(--olive);flex:0 0 auto;width:1.4em}
  .lesson .meta{flex:1;min-width:0}
  .lesson .meta .t{font-size:17px;display:block}
  .lesson .meta .p{font-size:13px;color:var(--ink2);font-style:italic;margin-top:3px;display:block;line-height:1.45}
  .lesson .stat{font-size:12.5px;color:var(--ink2);text-align:right;white-space:nowrap;flex:0 0 auto}
  .lesson .stat.hotovo{color:var(--good)}
  .privacy{margin-top:20px;font-size:13px;color:var(--ink2);line-height:1.44}
  .datatools{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .datatools button{
    font-family:'Literata',serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    background:none;border:0;color:var(--olive);cursor:pointer;padding:6px 0;
    border-bottom:1.5px solid var(--olive);min-height:32px;
  }
  .datatools button:focus-visible{outline:2px solid var(--flag);outline-offset:3px}
  .datastav{font-size:13px;font-style:italic;color:var(--ink2);min-height:1.4em}
  .datastav.chyba{color:var(--flag)}
  .souhrn{margin-top:20px;padding:14px 16px;border:1px solid rgba(74,68,58,.22);max-width:var(--text-max)}
  .souhrn p{font-size:14px;line-height:1.44;margin:0}
  .souhrn .poznamka{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:8px;line-height:1.5}
</style>
</head>
<body>

<a class="preskocit" href="#obsah">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="kicker"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<a class="zpet" href="../index.html" data-t="zpetNaUvod"></a>
</header>

<main id="obsah">
<p class="eyebrow" data-t="eyebrow"></p>
<h1><em data-t="over"></em><span data-t="title"></span></h1>
<div class="dashline"></div>
<p class="lede" data-t="lede"></p>
<p class="progres" id="progres"></p>

<!-- Pokračovat tam, kde student skončil (AUDIT.md, bod 1.6) -->
<a class="pokracovat" id="pokracovat" hidden></a>

<div class="hr" style="margin-top:26px"><span data-t="lessonsHead"></span></div>
<div class="mapa" id="lessons"></div>
<p class="pripravujeme" data-t="pripravujeme"></p>

<div class="hr" style="margin-top:30px"><span data-t="daleHead"></span></div>
<nav class="sbirka" id="odkazy" data-t="daleHead" data-t-attr="aria-label"></nav>

<div class="hr" style="margin-top:30px"><span data-t="resultsHead"></span></div>
<p class="privacy" data-t="privacy"></p>
<div class="datatools">
  <button id="exportBtn" data-t="exportBtn"></button>
  <button id="importBtn" data-t="importBtn"></button>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>
<p class="datastav" id="datastav" role="status" aria-live="polite"></p>
<div class="souhrn" id="souhrn"></div>
</main>

<footer class="foot"><span data-t="foot1"></span><span data-t="foot2"></span></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../js/jazyk.js';
import { prvniPokusy, pokusyLekce, pasmo, importJSON, stahniSoubor } from '../js/vysledky.js';
import { nactiUI, u, vykresliPokracovat, nactiPostup } from '../js/ucebnice.js';
import { CELKEM_LEKCI } from '../js/sekce-nav.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../data/preklady/rozcestnik.json');
await nactiUI('../');

const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — přehled kurzu' : 'ROUTING — course overview',
});

function cislo2(n) { return String(n).padStart(2, '0'); }

/* ============================================================================
 * Studijní mapa
 *
 * Do redesignu tady bylo 18 řádků, z toho 15 šedivých „Připravuje se" —
 * hotový obsah se v nich ztrácel (AUDIT.md, bod 1.3). Teď se vypisují jen
 * hotové lekce a zbytek shrne jedna tichá věta pod nimi.
 * ==========================================================================*/
function renderLessons() {
  const wrap = $('lessons');
  wrap.innerHTML = '';
  const lekce = jazyk.t('lekce') || [];

  lekce.forEach((l) => {
    const a = document.createElement('a');
    a.className = 'lesson';
    a.href = `../lekce/${cislo2(l.num)}/index.html`;

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = cislo2(l.num);

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.innerHTML = `<span class="t">${l.title}</span><span class="p">${l.popis}</span>`;

    const stat = document.createElement('span');
    stat.className = 'stat';
    const pokusy = pokusyLekce(l.num);
    const prvni = pokusy.find((p) => p.pokus === 1);
    if (!prvni) {
      stat.textContent = jazyk.t('stavNezahajeno');
    } else {
      stat.classList.add('hotovo');
      let txt = jazyk.t('stavPokus')
        .replace('{proc}', prvni.procenta)
        .replace('{pasmo}', jazyk.t('pasmo.' + pasmo(prvni.procenta)));
      if (pokusy.length > 1) {
        const klic = pokusy.length >= 5 ? 'stavPocetPokusu5plus' : 'stavPocetPokusu2_4';
        txt += ' · ' + jazyk.t(klic).replace('{n}', pokusy.length);
      }
      stat.textContent = txt;
    }

    a.appendChild(num); a.appendChild(meta); a.appendChild(stat);
    wrap.appendChild(a);
  });

  $('progres').textContent = jazyk.t('progres')
    .replace('{hotovo}', lekce.length).replace('{celkem}', CELKEM_LEKCI);
}

/* Slovníček a sbírka jamek — do teď dostupné jen zevnitř lekce. */
function renderOdkazy() {
  const el = $('odkazy');
  el.innerHTML = '';
  [
    { href: '../slovnicek/index.html', jm: u(jazyk.lang, 'slovnicek'), po: jazyk.t('slovnicekPopis') },
    { href: '../jamky/index.html', jm: u(jazyk.lang, 'sbirkaJamek'), po: jazyk.t('sbirkaPopis') },
  ].forEach((o) => {
    const a = document.createElement('a');
    a.className = 'sbirkaPolozka';
    a.href = o.href;
    a.innerHTML = `<span class="jm"><b>${o.jm}</b><span>${o.po}</span></span>`;
    el.appendChild(a);
  });
}

function renderPokracovat() {
  const p = nactiPostup();
  if (!p) { $('pokracovat').hidden = true; return; }
  const lekceData = (jazyk.t('lekce') || []).find((l) => l.num === p.lekce);
  vykresliPokracovat($('pokracovat'), {
    lang: jazyk.lang, zaklad: '../',
    nazevSekce: lekceData ? lekceData.title : u(jazyk.lang, 'lekceN').replace('{n}', p.lekce),
    popis: u(jazyk.lang, 'lekceN').replace('{n}', p.lekce) + ' · ' + u(jazyk.lang, 'krokZ').replace('{n}', p.index + 1),
  });
}

function renderSouhrn() {
  const el = $('souhrn');
  const prvni = prvniPokusy().filter((p) => p.lekce >= 1 && p.lekce <= 3);
  if (!prvni.length) {
    el.innerHTML = `<p>${jazyk.t('souhrnZadne')}</p>`;
    return;
  }
  const lekce = new Set(prvni.map((p) => p.lekce));
  const prumer = Math.round(prvni.reduce((s, p) => s + p.procenta, 0) / prvni.length);
  const text = jazyk.t('souhrnText').replace('{n}', lekce.size).replace('{prumer}', prumer);
  el.innerHTML = `<p>${text}</p><p class="poznamka">${jazyk.t('souhrnPoznamka')}</p>`;
}

jazyk.on(() => { renderLessons(); renderOdkazy(); renderPokracovat(); renderSouhrn(); });

/* ============================================================================
 * Stažení / načtení výsledků. Hlášky jdou do `role="status"` na stránce,
 * ne do `alert()` — modální okno prohlížeče vytrhne studenta z prostředí
 * a čtečka ho ohlásí jako systémové upozornění (AUDIT.md, bod 2.6).
 * ==========================================================================*/
function stav(text, chyba = false) {
  const el = $('datastav');
  el.textContent = text;
  el.classList.toggle('chyba', chyba);
}

$('exportBtn').addEventListener('click', () => stahniSoubor());
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    importJSON(await file.text());
    stav(jazyk.t('importHotovo'));
    renderLessons();
    renderSouhrn();
  } catch {
    stav(jazyk.t('importChyba'), true);
  }
  ev.target.value = '';
});
</script>
</body>
</html>
