<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — přehled kurzu</title>
<meta name="description" content="Výuková aplikace o golfové architektuře pro středoškolské golfisty. Perokresba, interaktivní pláty, bodované zkoušky.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/styl.css">
<style>
  /* styly specifické pro rozcestník — sdílené věci jsou v assets/styl.css */
  .progres{margin-top:10px;font-size:13px;color:var(--ink2);font-style:italic}

  .lessons{margin-top:18px;display:flex;flex-direction:column;gap:2px}
  .lesson{
    display:flex;align-items:baseline;gap:14px;padding:14px 2px;
    border-bottom:1px solid rgba(74,68,58,.25);min-height:32px;
  }
  a.lesson{text-decoration:none;color:inherit}
  a.lesson:hover{background:rgba(59,74,42,.05)}
  a.lesson:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
  .lesson .num{
    font-family:'Fraunces',serif;font-weight:900;font-size:22px;
    color:var(--olive);flex:0 0 auto;width:1.4em;
  }
  .lesson .meta{flex:1;min-width:0}
  .lesson .meta .t{font-size:16.5px;display:block}
  .lesson .meta .p{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:2px;display:block}
  .lesson .stat{font-size:12.5px;color:var(--ink2);text-align:right;white-space:nowrap;flex:0 0 auto}
  .lesson .stat.hotovo{color:var(--good)}
  .lesson.soon{opacity:.45}
  .lesson.soon .num{color:var(--ink2)}

  .privacy{margin-top:20px;font-size:13px;color:var(--ink2);line-height:1.44;max-width:44ch}
  .datatools{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap}
  .datatools button{
    font-family:'Literata',serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    background:none;border:0;color:var(--olive);cursor:pointer;padding:6px 0;
    border-bottom:1.5px solid var(--olive);min-height:32px;
  }
  .datatools button:focus-visible{outline:2px solid var(--flag);outline-offset:3px}

  .souhrn{margin-top:20px;padding:14px 16px;border:1px solid rgba(74,68,58,.22);max-width:52ch}
  .souhrn p{font-size:14px;line-height:1.4;margin:0}
  .souhrn .poznamka{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:8px;line-height:1.44}
</style>
</head>
<body>

<div class="topbar">
  <div class="hr"><span data-t="kicker"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<a class="zpet" href="../index.html" data-t="zpetNaUvod"></a>

<p class="eyebrow" data-t="eyebrow"></p>
<h1><em data-t="over"></em><span data-t="title"></span></h1>
<div class="dashline"></div>
<p class="lede" data-t="lede"></p>
<p class="progres" id="progres"></p>

<div class="hr" style="margin-top:20px"><span data-t="lessonsHead"></span></div>
<div class="lessons" id="lessons"></div>

<div class="hr" style="margin-top:26px"><span data-t="resultsHead"></span></div>
<p class="privacy" data-t="privacy"></p>
<div class="datatools">
  <button id="exportBtn" data-t="exportBtn"></button>
  <button id="importBtn" data-t="importBtn"></button>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>
<div class="souhrn" id="souhrn"></div>

<div class="foot"><span data-t="foot1"></span><span data-t="foot2"></span></div>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../js/jazyk.js';
import { prvniPokusy, pokusyLekce, pasmo, exportJSON, importJSON, stahniSoubor } from '../js/vysledky.js';

const $ = (id) => document.getElementById(id);
const CELKEM_LEKCI = 18;

const slovnik = await nactiSlovnik('../data/preklady/rozcestnik.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — přehled kurzu' : 'ROUTING — course overview',
});

function cislo2(n) { return String(n).padStart(2, '0'); }

function renderLessons() {
  const wrap = $('lessons');
  wrap.innerHTML = '';
  const lekce = jazyk.t('lekce') || [];

  lekce.forEach((l) => {
    const a = document.createElement('a');
    a.className = 'lesson';
    a.href = `../lekce/${cislo2(l.num)}/index.html`;

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = cislo2(l.num);

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.innerHTML = `<span class="t">${l.title}</span><span class="p">${l.popis}</span>`;

    const stat = document.createElement('span');
    stat.className = 'stat';
    const pokusy = pokusyLekce(l.num);
    const prvni = pokusy.find((p) => p.pokus === 1);
    if (!prvni) {
      stat.textContent = jazyk.t('stavNezahajeno');
    } else {
      stat.classList.add('hotovo');
      const pasmoKlic = pasmo(prvni.procenta);
      let txt = jazyk.t('stavPokus').replace('{proc}', prvni.procenta).replace('{pasmo}', jazyk.t('pasmo.' + pasmoKlic));
      if (pokusy.length > 1) {
        const klicPoctu = pokusy.length >= 5 ? 'stavPocetPokusu5plus' : 'stavPocetPokusu2_4';
        txt += ' · ' + jazyk.t(klicPoctu).replace('{n}', pokusy.length);
      }
      stat.textContent = txt;
    }

    a.appendChild(num); a.appendChild(meta); a.appendChild(stat);
    wrap.appendChild(a);
  });

  for (let n = lekce.length + 1; n <= CELKEM_LEKCI; n++) {
    const div = document.createElement('div');
    div.className = 'lesson soon';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = cislo2(n);
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.innerHTML = `<span class="t">${jazyk.t('soonLabel')}</span>`;
    div.appendChild(num); div.appendChild(meta);
    wrap.appendChild(div);
  }

  $('progres').textContent = jazyk.t('progres').replace('{hotovo}', lekce.length).replace('{celkem}', CELKEM_LEKCI);
}

function renderSouhrn() {
  const el = $('souhrn');
  const prvni = prvniPokusy().filter((p) => p.lekce >= 1 && p.lekce <= 3);
  if (!prvni.length) {
    el.innerHTML = `<p>${jazyk.t('souhrnZadne')}</p>`;
    return;
  }
  const lekce = new Set(prvni.map((p) => p.lekce));
  const prumer = Math.round(prvni.reduce((s, p) => s + p.procenta, 0) / prvni.length);
  const text = jazyk.t('souhrnText').replace('{n}', lekce.size).replace('{prumer}', prumer);
  el.innerHTML = `<p>${text}</p><p class="poznamka">${jazyk.t('souhrnPoznamka')}</p>`;
}

jazyk.on(() => { renderLessons(); renderSouhrn(); });

/* ============================================================================
 * Stažení / načtení výsledků (zadání, část 10 — bez toho student o
 * všechno přijde při vyčištění prohlížeče nebo přechodu na jiné zařízení).
 * ==========================================================================*/
$('exportBtn').addEventListener('click', () => stahniSoubor());
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    importJSON(await file.text());
    alert(jazyk.t('importOk'));
    renderLessons();
    renderSouhrn();
  } catch {
    alert(jazyk.t('importErr'));
  }
  ev.target.value = '';
});
</script>
</body>
</html>
