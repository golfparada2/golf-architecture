<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — kurz golfové architektury</title>
<meta name="description" content="ROUTING — bezplatný online kurz golfové architektury pro středoškolské golfisty. 18 lekcí, reálné jamky, interaktivní pláty, bodované zkoušky.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styl.css">
</head>
<body>

<div class="topbar">
  <div class="hr"><span data-t="kicker"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>

<figure class="hero">
  <img src="assets/foto/hero-st-andrews.jpg" alt="">
  <figcaption class="heroCaption" data-t="heroCaption"></figcaption>
</figure>

<p class="eyebrow" data-t="eyebrow"></p>
<h1><em data-t="over"></em><span data-t="title"></span></h1>
<div class="dashline"></div>
<p class="lede" data-t="lede"></p>

<p class="academyIntro" data-t="academyIntro"></p>

<div class="hr" style="margin-top:26px"><span data-t="pointsHead"></span></div>
<div class="academyPoints" id="academyPoints"></div>

<div class="ctaRow">
  <a class="cta" href="prehled/index.html" data-t="ctaPrimary"></a>
  <a class="cta quiet" href="prehled/index.html" data-t="ctaSecondary"></a>
</div>

<div class="foot"><span data-t="foot1"></span><span data-t="foot2"></span></div>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from './js/jazyk.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('data/preklady/uvod.json');
const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — kurz golfové architektury' : 'ROUTING — a course in golf course architecture',
});

function renderPoints() {
  const wrap = $('academyPoints');
  wrap.innerHTML = '';
  const points = jazyk.t('points') || [];
  points.forEach((p) => {
    const row = document.createElement('div');
    row.className = 'academyPoint';
    const ico = document.createElement('span');
    ico.className = 'ico';
    ico.textContent = p.cislo;
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.innerHTML = `<b>${p.nadpis}</b><p>${p.text}</p>`;
    row.appendChild(ico); row.appendChild(txt);
    wrap.appendChild(row);
  });
}

function renderHeroAlt() {
  const img = document.querySelector('.hero img');
  if (img) img.alt = jazyk.t('heroCaption');
}

jazyk.on(() => { renderPoints(); renderHeroAlt(); });
</script>
</body>
</html>
