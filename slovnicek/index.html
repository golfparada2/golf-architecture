<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUTING — slovníček</title>
<meta name="description" content="Slovníček golfové architektury: všechny pojmy kurzu ROUTING na jednom místě, abecedně, česky i anglicky.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F7F1E0'/%3E%3Ccircle cx='16' cy='14' r='9' fill='%23A9B983' stroke='%231E1B15' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='1.6' fill='%231E1B15'/%3E%3Cpath d='M16 14 L16 5' stroke='%231E1B15' stroke-width='1.3'/%3E%3Cpath d='M16 5 L23 7.5 L16 10 Z' fill='%23B0452C' stroke='%231E1B15' stroke-width='.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/styl.css">
</head>
<body>

<a class="preskocit" href="#obsah">Přeskočit na obsah</a>

<header class="hlavicka">
<div class="topbar">
  <div class="hr"><span data-t="meta.kicker"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="cs" aria-current="true">ČES</button><i>/</i><button data-l="en">ENG</button>
  </div>
</div>
<nav class="drobky" id="drobky"></nav>
</header>

<main id="obsah">
<p class="eyebrow" data-t="meta.kicker"></p>
<h1><em data-t="meta.over"></em><span data-t="meta.title"></span></h1>
<div class="dashline"></div>
<p class="lede" data-t="meta.lede"></p>

<div class="posuvnik-wrap" style="margin-top:20px">
  <label for="filtr"><span data-t="meta.hledatLabel"></span><output id="pocet"></output></label>
  <input type="search" id="filtr" autocomplete="off"
         style="width:100%;max-width:var(--text-max);font-family:'Literata',serif;font-size:15px;padding:10px 12px;border:1.5px solid rgba(74,68,58,.35);background:rgba(255,255,255,.28);color:var(--ink)">
</div>

<nav class="abeceda" id="abeceda" aria-label="A–Z"></nav>

<div id="seznam"></div>
<p class="src" id="prazdno" hidden data-t="meta.nicNenalezeno"></p>
</main>

<footer class="foot"><span>ROUTING · SLOVNÍČEK</span><a class="zpet" style="margin-top:0" href="../prehled/index.html" data-t="meta.zpet"></a></footer>

<script type="module">
import { vytvorJazyk, nactiSlovnik } from '../js/jazyk.js';
import { nactiUI, u } from '../js/ucebnice.js';

const $ = (id) => document.getElementById(id);

const slovnik = await nactiSlovnik('../data/preklady/slovnik-pojmu.json');
await nactiUI('../');

const jazyk = vytvorJazyk(slovnik, {
  titul: (lang) => lang === 'cs' ? 'ROUTING — slovníček' : 'ROUTING — glossary',
});

const bezDiakritiky = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function renderDrobky() {
  const el = $('drobky');
  el.setAttribute('aria-label', u(jazyk.lang, 'drobkyLabel'));
  el.innerHTML = `<ol><li><a href="../prehled/index.html">${u(jazyk.lang, 'prehled')}</a></li>`
    + `<li><span aria-current="page">${u(jazyk.lang, 'slovnicek')}</span></li></ol>`;
}

function render(filtr = '') {
  const pojmy = (jazyk.t('pojmy') || []).filter((p) => {
    if (!filtr) return true;
    const q = bezDiakritiky(filtr);
    return bezDiakritiky(p.pojem).includes(q) || bezDiakritiky(p.popis).includes(q);
  });

  $('pocet').textContent = jazyk.t('meta.pocet').replace('{n}', pojmy.length);
  $('prazdno').hidden = pojmy.length > 0;

  /* Seskupení podle prvního písmene — bez diakritiky, aby „Šrafura" seděla
     pod Š a ne mezi znaky, které v české abecedě nikdo nehledá. */
  const skupiny = new Map();
  pojmy.forEach((p) => {
    const pismeno = p.pojem.charAt(0).toUpperCase();
    if (!skupiny.has(pismeno)) skupiny.set(pismeno, []);
    skupiny.get(pismeno).push(p);
  });

  const abeceda = $('abeceda');
  abeceda.innerHTML = '';
  [...skupiny.keys()].forEach((pismeno) => {
    const a = document.createElement('a');
    a.href = '#p-' + bezDiakritiky(pismeno);
    a.textContent = pismeno;
    abeceda.appendChild(a);
  });

  const wrap = $('seznam');
  wrap.innerHTML = '';
  skupiny.forEach((seznam, pismeno) => {
    const h = document.createElement('h2');
    h.className = 'pismenoHlava';
    h.id = 'p-' + bezDiakritiky(pismeno);
    h.style.scrollMarginTop = '14px';
    h.textContent = pismeno;
    wrap.appendChild(h);

    const dl = document.createElement('dl');
    dl.className = 'pojmy';
    seznam.forEach((p) => {
      const div = document.createElement('div');
      div.className = 'pojem';
      const kde = p.kde && p.kde.length
        ? `<span class="kde">${jazyk.t('meta.kdeLabel')} ` + p.kde
            .map((n) => `<a href="../lekce/0${n}/6-slovnicek.html">${n}</a>`).join(', ') + '</span>'
        : `<span class="kde">${jazyk.t('meta.kdeZadna')}</span>`;
      div.innerHTML = `<dt>${p.pojem}</dt><dd>${p.popis}${kde}</dd>`;
      dl.appendChild(div);
    });
    wrap.appendChild(dl);
  });
}

$('filtr').addEventListener('input', (e) => render(e.target.value));
jazyk.on(() => { renderDrobky(); render($('filtr').value); });
</script>
</body>
</html>
